<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - AdHash Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        .project-header {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .project-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .project-subtitle {
            font-size: 1.1rem;
            color: #6b7280;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .details-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .test-results-table th {
            background: #f9fafb;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        .test-results-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .test-results-table tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-passed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .count-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            min-width: 32px;
            text-align: center;
        }

        .count-total { background: #3b82f6; color: white; }
        .count-pass { background: #10b981; color: white; }
        .count-warning { background: #f59e0b; color: white; }
        .count-fail { background: #ef4444; color: white; }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 1.8rem;
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid var(--item-color, #667eea);
        }

        .detail-item.healthy {
            --item-color: #10b981;
        }

        .detail-item.warning {
            --item-color: #f59e0b;
        }

        .detail-item.error {
            --item-color: #ef4444;
        }

        .detail-name {
            font-weight: 600;
            color: #1f2937;
        }

        .detail-url {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 4px;
        }

        .detail-status {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .detail-status.healthy {
            background: #d1fae5;
            color: #065f46;
        }

        .detail-status.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .detail-status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .project-title {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="goBack()">
            ← Back to Dashboard
        </button>

        <div id="projectContent">
            <div class="loading">
                <div class="spinner"></div>
                Loading project details...
            </div>
        </div>
    </div>

    <script>
        let projectId = null;
        let projectData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            projectId = urlParams.get('id');

            if (!projectId) {
                window.location.href = '/project-dashboard.html';
                return;
            }

            await loadProjectDetails();
        });

        async function loadProjectDetails() {
            try {
                // Load project info
                const projectResponse = await fetch(`/api/project/${projectId}`);
                const projectData = await projectResponse.json();

                // Load test results
                const resultsResponse = await fetch(`/api/project/${projectId}/test-results`);
                const testResults = await resultsResponse.json();

                renderProjectDetails(projectData, testResults);
            } catch (error) {
                console.error('Error loading project details:', error);
                document.getElementById('projectContent').innerHTML = `
                    <div class="loading">
                        <p style="color: #fee2e2;">❌ Error loading project details</p>
                    </div>
                `;
            }
        }

        function renderProjectDetails(project, testResults) {
            const content = document.getElementById('projectContent');

            content.innerHTML = `
                <div class="project-header">
                    <div class="project-title">${project.name}</div>
                    <div class="project-subtitle">${project.description}</div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${testResults.apps.total}</div>
                            <div class="stat-label">Mobile Apps</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${testResults.servers.total}</div>
                            <div class="stat-label">Servers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${testResults.ssl.total}</div>
                            <div class="stat-label">SSL Certificates</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${testResults.domains.total}</div>
                            <div class="stat-label">Domains</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${testResults.apis.total}</div>
                            <div class="stat-label">API Endpoints</div>
                        </div>
                    </div>
                </div>

                ${renderAppsSection(testResults.apps)}
                ${renderServersSection(testResults.servers)}
                ${renderSslSection(testResults.ssl)}
                ${renderDomainsSection(testResults.domains)}
                ${renderApisSection(testResults.apis)}
            `;
        }

        function renderAppsSection(results) {
            if (!results || results.total === 0) return '';

            return `
                <div class="details-section">
                    <div class="section-header">
                        <div class="section-title">
                            <span>📱</span>
                            <span>Mobile Applications</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <span class="count-badge count-total">${results.total}</span>
                            <span class="count-badge count-pass">${results.passed}</span>
                            <span class="count-badge count-warning">${results.warning}</span>
                            <span class="count-badge count-fail">${results.failed}</span>
                        </div>
                    </div>
                    <table class="test-results-table">
                        <thead>
                            <tr>
                                <th>App Name</th>
                                <th>Platform</th>
                                <th>URL</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.tests.map(test => `
                                <tr>
                                    <td>${test.name}</td>
                                    <td>${test.platform}</td>
                                    <td><a href="${test.url}" target="_blank" style="color: #667eea;">${test.url}</a></td>
                                    <td><span class="status-badge status-${test.status}">${test.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderServersSection(results) {
            if (!results || results.total === 0) return '';

            return `
                <div class="details-section">
                    <div class="section-header">
                        <div class="section-title">
                            <span>🖥️</span>
                            <span>Servers</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <span class="count-badge count-total">${results.total}</span>
                            <span class="count-badge count-pass">${results.passed}</span>
                            <span class="count-badge count-warning">${results.warning}</span>
                            <span class="count-badge count-fail">${results.failed}</span>
                        </div>
                    </div>
                    <table class="test-results-table">
                        <thead>
                            <tr>
                                <th>Server Name</th>
                                <th>URL</th>
                                <th>Type</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.tests.map(test => `
                                <tr>
                                    <td>${test.name}</td>
                                    <td><a href="${test.url}" target="_blank" style="color: #667eea;">${test.url}</a></td>
                                    <td>${test.type}</td>
                                    <td><span class="status-badge status-${test.status}">${test.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSslSection(results) {
            if (!results || results.total === 0) return '';

            return `
                <div class="details-section">
                    <div class="section-header">
                        <div class="section-title">
                            <span>🔒</span>
                            <span>SSL Certificates</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <span class="count-badge count-total">${results.total}</span>
                            <span class="count-badge count-pass">${results.passed}</span>
                            <span class="count-badge count-warning">${results.warning}</span>
                            <span class="count-badge count-fail">${results.failed}</span>
                        </div>
                    </div>
                    <table class="test-results-table">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>URL</th>
                                <th>Days Remaining</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.tests.map(test => `
                                <tr>
                                    <td>${test.name}</td>
                                    <td><a href="${test.url}" target="_blank" style="color: #667eea;">${test.url}</a></td>
                                    <td>${test.daysRemaining} days</td>
                                    <td><span class="status-badge status-${test.status}">${test.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderDomainsSection(results) {
            if (!results || results.total === 0) return '';

            return `
                <div class="details-section">
                    <div class="section-header">
                        <div class="section-title">
                            <span>🌐</span>
                            <span>Domains</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <span class="count-badge count-total">${results.total}</span>
                            <span class="count-badge count-pass">${results.passed}</span>
                            <span class="count-badge count-warning">${results.warning}</span>
                            <span class="count-badge count-fail">${results.failed}</span>
                        </div>
                    </div>
                    <table class="test-results-table">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>URL</th>
                                <th>Days Remaining</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.tests.map(test => `
                                <tr>
                                    <td>${test.name}</td>
                                    <td><a href="${test.url}" target="_blank" style="color: #667eea;">${test.url}</a></td>
                                    <td>${test.daysRemaining} days</td>
                                    <td><span class="status-badge status-${test.status}">${test.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderApisSection(results) {
            if (!results || results.total === 0) return '';

            return `
                <div class="details-section">
                    <div class="section-header">
                        <div class="section-title">
                            <span>⚡</span>
                            <span>API Endpoints</span>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <span class="count-badge count-total">${results.total}</span>
                            <span class="count-badge count-pass">${results.passed}</span>
                            <span class="count-badge count-warning">${results.warning}</span>
                            <span class="count-badge count-fail">${results.failed}</span>
                        </div>
                    </div>
                    <table class="test-results-table">
                        <thead>
                            <tr>
                                <th>API Name</th>
                                <th>Method</th>
                                <th>URL</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.tests.map(test => `
                                <tr>
                                    <td>${test.name}</td>
                                    <td><span style="background: #e0e7ff; color: #4338ca; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">${test.method}</span></td>
                                    <td><a href="${test.url}" target="_blank" style="color: #667eea;">${test.url}</a></td>
                                    <td><span class="status-badge status-${test.status}">${test.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function goBack() {
            window.location.href = '/project-dashboard.html';
        }
    </script>
</body>
</html>
