<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Cards — React UI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .hero { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #fff; padding: 48px 32px 40px; text-align: center; }
    .hero h1 { margin: 0 0 8px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
    .hero p  { margin: 0; font-size: 14px; color: #94a3b8; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
                     color: #94a3b8; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="hero">
  <h1>QA Project Workspace</h1>
  <p>Select a project to view test cases, production checklists, reports and more</p>
</div>

<div class="shell" id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ─── PILL style map ─────────────────────────────────────────────────── */
const PILL = {
  notest:   { bg:'#f1f5f9', text:'#64748b', border:'#e2e8f0', dot:'#94a3b8' },
  ready:    { bg:'#ecfdf5', text:'#065f46', border:'#a7f3d0', dot:'#10b981' },
  progress: { bg:'#eff6ff', text:'#1d4ed8', border:'#bfdbfe', dot:'#3b82f6' },
  failed:   { bg:'#fef2f2', text:'#b91c1c', border:'#fecaca', dot:'#ef4444' },
};

function pillStyle(status = '') {
  const s = status.toLowerCase();
  if (s.includes('ready'))    return PILL.ready;
  if (s.includes('progress')) return PILL.progress;
  if (s.includes('fail') || s.includes('✗')) return PILL.failed;
  return PILL.notest;
}

/* ─── ProjectCard ────────────────────────────────────────────────────── */
function ProjectCard({ name, description, logo, accentColor = '#6366f1', testStatus = '— No Tests', href = '#', onClick }) {
  const [hovered, setHovered] = useState(false);
  const ps = pillStyle(testStatus);

  const isFaviconUrl = typeof logo === 'string' && logo.startsWith('http');
  const emoji = isFaviconUrl ? '📁' : (logo || '📁');

  return (
    <a
      href={href}
      onClick={onClick ? (e) => { e.preventDefault(); onClick(); } : undefined}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: 'flex',
        flexDirection: 'column',
        background: '#fff',
        borderRadius: '16px',
        border: `1px solid ${hovered ? '#cbd5e1' : '#e2e8f0'}`,
        overflow: 'hidden',
        boxShadow: hovered
          ? '0 12px 32px rgba(15,23,42,.12), 0 2px 8px rgba(15,23,42,.06)'
          : '0 1px 4px rgba(15,23,42,.06)',
        transform: hovered ? 'translateY(-4px) scale(1.003)' : 'translateY(0) scale(1)',
        transition: 'all .22s cubic-bezier(.16,1,.3,1)',
        textDecoration: 'none',
        cursor: 'pointer',
      }}
    >
      {/* Colored top stripe */}
      <div style={{
        height: 4,
        flexShrink: 0,
        background: `linear-gradient(90deg, ${accentColor}, ${accentColor}99)`,
      }} />

      {/* Body */}
      <div style={{ padding: '20px 20px 18px', display: 'flex', flexDirection: 'column', flex: 1, gap: 0 }}>

        {/* Logo + name row */}
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 16 }}>
          {/* Avatar */}
          <div style={{
            width: 44, height: 44, borderRadius: 12, flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: `${accentColor}18`, border: `1.5px solid ${accentColor}33`,
            transform: hovered ? 'scale(1.07) rotate(-2deg)' : 'scale(1)',
            transition: 'transform .22s cubic-bezier(.16,1,.3,1)',
          }}>
            {isFaviconUrl ? (
              <img
                src={logo}
                alt={name}
                width={28} height={28}
                style={{ borderRadius: 6, objectFit: 'contain' }}
                onError={e => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }}
              />
            ) : null}
            <span style={{ fontSize: 22, display: isFaviconUrl ? 'none' : 'block' }}>{emoji}</span>
          </div>

          {/* Text */}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{
              fontSize: 15, fontWeight: 800, color: '#0f172a',
              letterSpacing: '-.3px', lineHeight: 1.2,
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            }}>
              {name}
            </div>
            {description && (
              <div style={{
                fontSize: 12, color: '#94a3b8', marginTop: 3, lineHeight: 1.45,
                display: '-webkit-box', WebkitLineClamp: 2,
                WebkitBoxOrient: 'vertical', overflow: 'hidden',
              }}>
                {description}
              </div>
            )}
          </div>
        </div>

        {/* Spacer */}
        <div style={{ flex: 1 }} />

        {/* Footer */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          paddingTop: 12, borderTop: '1px solid #f1f5f9',
        }}>
          {/* Status pill */}
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            padding: '4px 10px', borderRadius: 50,
            fontSize: 11, fontWeight: 600,
            background: ps.bg, color: ps.text,
            border: `1px solid ${ps.border}`,
          }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: ps.dot, flexShrink: 0 }} />
            {testStatus}
          </span>

          {/* Arrow */}
          <div style={{
            width: 28, height: 28, borderRadius: '50%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 13, fontWeight: 700,
            background: hovered ? accentColor : 'transparent',
            color: hovered ? '#fff' : '#94a3b8',
            border: `1px solid ${hovered ? 'transparent' : '#e2e8f0'}`,
            transition: 'all .2s ease',
          }}>
            →
          </div>
        </div>
      </div>
    </a>
  );
}

/* ─── ProjectGrid ────────────────────────────────────────────────────── */
function ProjectGrid({ projects }) {
  if (!projects.length) {
    return (
      <div style={{ textAlign:'center', padding: '60px 0', color: '#94a3b8' }}>
        <div style={{ fontSize: 40, marginBottom: 12 }}>📁</div>
        <div style={{ fontSize: 14, fontWeight: 600 }}>No projects yet</div>
      </div>
    );
  }

  return (
    <div style={{
      display: 'grid',
      gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))',
      gap: 16,
    }}>
      {projects.map(p => (
        <ProjectCard key={p.id} {...p} />
      ))}
    </div>
  );
}

  {

    href: '#',

/* ─── App shell ──────────────────────────────────────────────────────── */
function App() {
  return (
    <div>
      <div className="section-label">All Projects</div>
      <ProjectGrid projects={SAMPLE_PROJECTS} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
