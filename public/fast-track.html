<script>
// ── DECISION (S9) ──
const S9_QUESTIONS=[
  'All critical and high bugs are fixed and retested',
  'Smoke test fully passed',
  'Manual testing completion >= 90%',
  'API & data validation passed',
  'Regression pack >= 80% pass rate',
  'Dev self-test completed and signed off',
  'Risk check completed with documented risks',
  'No new critical issues found in last 24h',
  'Release notes / change log prepared',
  'Rollback plan is documented and tested',
];
function ftStageDecision(rel){
  const st=rel.stages?.s9||{};
  const data=st.data||{};
  const qa=data.qa||{};
  // Auto-calculate recommendation
  const critOpen=(rel.bugs||[]).filter(b=>b.severity==='Critical'&&b.status!=='Closed'&&b.status!=='Deferred').length;
  const smokeDone=rel.stages?.s4?.status==='Done';
  const manualPct=rel.stages?.s5?.pct||0;
  const regrPct=rel.stages?.s8?.pct||0;
  let rec='GO';
  let blockers=[];
  if(critOpen>0){rec='NO-GO';blockers.push(`${critOpen} critical bug(s) still open`);}
  if(!smokeDone){rec='NO-GO';blockers.push('Smoke test not fully passed');}
  if(manualPct<70){rec=rec==='NO-GO'?'NO-GO':'NO-GO';blockers.push(`Manual testing only ${manualPct}% complete`);}
  else if(manualPct<90&&rec!=='NO-GO'){rec='GO WITH RISK';blockers.push(`Manual testing ${manualPct}% (target >=90%)`);}
  if(regrPct<80&&rec!=='NO-GO'){rec=rec==='GO WITH RISK'?'GO WITH RISK':'GO WITH RISK';blockers.push(`Regression pack ${regrPct}% (target >=80%)`);}
  const recColor=rec==='GO'?'#10b981':rec==='GO WITH RISK'?'#d97706':'#ef4444';
  const recBadge=rec==='GO'?'go':rec==='GO WITH RISK'?'go-risk':'nogo';
  let qRows=S9_QUESTIONS.map((q,i)=>{
    const d=qa[i]||{};
    return `<div class="ft-check-row" style="flex-wrap:wrap;gap:6px" id="s9-row-${i}">
      <div class="ft-check-num">${i+1}</div>
      <div class="ft-check-label" style="font-weight:600">${ftEsc(q)}</div>
      <div class="ft-radio-grp">
        ${['Yes','No','NA'].map(v=>`<button class="ft-radio-btn ${(d.val||'')==v?'selected-'+(v==='Yes'?'yes':v==='No'?'no':'na'):''}" onclick="ftS9Set(${i},'${v}')">${v}</button>`).join('')}
      </div>
      <input placeholder="Owner" id="s9-owner-${i}" value="${ftEsc(d.owner||'')}" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;background:var(--card2);color:var(--txt);width:110px">
      <input placeholder="Notes" id="s9-notes-${i}" value="${ftEsc(d.notes||'')}" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;background:var(--card2);color:var(--txt);flex:1;min-width:150px">
    </div>`;
  }).join('');
  return `<div class="ft-card">
    <div class="ft-card-title">🚦 Stage 9: Release Decision</div>
    <div style="background:rgba(${rec==='GO'?'16,185,129':rec==='GO WITH RISK'?'245,158,11':'239,68,68'},.08);border:2px solid rgba(${rec==='GO'?'16,185,129':rec==='GO WITH RISK'?'245,158,11':'239,68,68'},.3);border-radius:12px;padding:16px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)">Auto Recommendation</div>
        <span class="ftbadge ${recBadge}" style="font-size:14px;padding:4px 16px">${rec}</span>
      </div>
      ${blockers.length>0?`<ul style="margin-top:10px;padding-left:18px">${blockers.map(b=>`<li style="font-size:12px;color:${recColor};margin-bottom:2px">${ftEsc(b)}</li>`).join('')}</ul>`:`<div style="font-size:12px;color:#10b981;margin-top:8px">✅ All criteria met for GO</div>`}
    </div>
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin-bottom:10px">Release Readiness Questions</div>
      ${qRows}
    </div>
    <div class="ft-form-row">
      <div class="ft-form-group"><label>QA Recommendation</label><select id="s9-qa-rec">${['Pending','GO','GO WITH RISK','NO-GO'].map(x=>`<option ${(data.qaRecommendation||rec)===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="ft-form-group"><label>PO Decision</label><select id="s9-po-dec">${['Pending','GO','GO WITH RISK','NO-GO'].map(x=>`<option ${(data.poDecision||'Pending')===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="ft-form-row">
      <div class="ft-form-group"><label>Management Decision</label><select id="s9-mgmt-dec">${['Pending','GO','GO WITH RISK','NO-GO'].map(x=>`<option ${(data.mgmtDecision||'Pending')===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="ft-form-group"><label>Approved By</label><input id="s9-approved-by" value="${ftEsc(data.approvedBy||'')}"></div>
    </div>
    <div class="ft-form-row">
      <div class="ft-form-group"><label>Approval Date</label><input type="date" id="s9-approval-date" value="${data.approvalDate||''}"></div>
      <div class="ft-form-group"><label>Risk Acceptance Owner (if GO WITH RISK)</label><input id="s9-risk-owner" value="${ftEsc(data.riskOwner||'')}"></div>
    </div>
    <div class="ft-form-group" style="margin-bottom:12px"><label>Final Notes / Conditions</label><textarea id="s9-final-notes">${ftEsc(data.finalNotes||'')}</textarea></div>
    <div style="display:flex;gap:8px">
      <button class="ftbtn primary" onclick="ftSaveS9()">Save Decision</button>
      <button class="ftbtn" onclick="ftUpdateStage('s9')">Update Stage Status</button>
    </div>
  </div>`;
}
function ftS9Set(idx,val){
  const row=document.getElementById('s9-row-'+idx);if(!row)return;
  row.querySelectorAll('.ft-radio-btn').forEach(b=>{b.className='ft-radio-btn';});
  const btns=row.querySelectorAll('.ft-radio-btn');
  const idx2=['Yes','No','NA'].indexOf(val);
  if(idx2>=0&&btns[idx2]){const cls=val==='Yes'?'selected-yes':val==='No'?'selected-no':'selected-na';btns[idx2].classList.add(cls);}
  row.dataset.val=val;
}
function ftSaveS9(){
  const rel=ftRelById(_ftSelectedRelease);if(!rel)return;
  if(!rel.stages) rel.stages={};
  if(!rel.stages.s9) rel.stages.s9={status:'Not Started',pct:0};
  const qa={};
  S9_QUESTIONS.forEach((_,i)=>{
    const row=document.getElementById('s9-row-'+i);
    const val=row?.dataset.val||(rel.stages.s9.data?.qa?.[i]?.val||'');
    qa[i]={val,owner:document.getElementById('s9-owner-'+i)?.value||'',notes:document.getElementById('s9-notes-'+i)?.value||''};
  });
  const qaRec=document.getElementById('s9-qa-rec').value;
  const poDec=document.getElementById('s9-po-dec').value;
  const mgmtDec=document.getElementById('s9-mgmt-dec').value;
  const finalDec=[qaRec,poDec,mgmtDec].includes('NO-GO')?'NO-GO':[qaRec,poDec,mgmtDec].includes('GO WITH RISK')?'GO WITH RISK':[qaRec,poDec,mgmtDec].every(d=>d==='GO')?'GO':'Pending';
  rel.stages.s9.data={qa,qaRecommendation:qaRec,poDecision:poDec,mgmtDecision:mgmtDec,approvedBy:document.getElementById('s9-approved-by').value,approvalDate:document.getElementById('s9-approval-date').value,riskOwner:document.getElementById('s9-risk-owner').value,finalNotes:document.getElementById('s9-final-notes').value};
  rel.decision=finalDec;
  rel.stages.s9.pct=finalDec!=='Pending'?100:50;
  rel.stages.s9.status=finalDec!=='Pending'?'Done':'In Progress';
  if(finalDec==='GO'||finalDec==='GO WITH RISK') rel.status='Ready for Release';
  if(finalDec==='NO-GO') rel.status='Blocked';
  ftAddHistory(rel,'Release Decision','—','—','Pending',finalDec,window._ftCurrentUser,'');
  ftSaveReleases();ftToast('Decision saved: '+finalDec, finalDec==='GO'?'success':finalDec==='NO-GO'?'error':'warning');
  ftRenderReleaseDetail();
}

// ── PRODUCTION SANITY (S10) ──
const S10_ITEMS=['Deployment completed successfully','Environment variables configured correctly','Database migrations ran without errors','Application starts and loads correctly','Core functionality verified in production','Monitoring/alerts active and responding','Error logs checked — no critical errors','External integrations verified','Performance baseline confirmed','Rollback tested and ready if needed'];
function ftStageProduction(rel){
  const st=rel.stages?.s10||{};
  const data=st.data?.items||{};
  const pass=S10_ITEMS.filter((_,i)=>data[i]?.status==='Pass').length;
  let rows=S10_ITEMS.map((item,i)=>{
    const d=data[i]||{};
    return `<div class="ft-check-row" style="flex-wrap:wrap;gap:6px">
      <div class="ft-check-num">${i+1}</div>
      <div class="ft-check-label">${ftEsc(item)}</div>
      <div class="ft-radio-grp">
        ${['Pass','Fail','NA','Not Run'].map(v=>`<button class="ft-radio-btn ${d.status===v?(v==='Pass'?'selected-pass':v==='Fail'?'selected-fail':'selected-na'):''}" onclick="ftS10Set(${i},'${v}')" id="s10-btn-${i}-${v}">${v}</button>`).join('')}
      </div>
      <input placeholder="Owner" id="s10-owner-${i}" value="${ftEsc(d.owner||'')}" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;background:var(--card2);color:var(--txt);width:100px">
      <input placeholder="Incident ID" id="s10-incident-${i}" value="${ftEsc(d.incidentId||'')}" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;background:var(--card2);color:var(--txt);width:90px">
      <input placeholder="Notes" id="s10-notes-${i}" value="${ftEsc(d.notes||'')}" style="border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;background:var(--card2);color:var(--txt);flex:1;min-width:140px">
    </div>`;
  }).join('');
  return `<div class="ft-card">
    <div style="background:rgba(245,158,11,.06);border:1.5px solid rgba(245,158,11,.3);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#d97706;font-weight:600">⚠ Warning: Do NOT run destructive tests on production. Verify only — do not create/delete production data.</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="ft-card-title" style="margin:0">🚀 Stage 10: Production Sanity (${pass}/${S10_ITEMS.length} Pass)</div>
      <button class="ftbtn sm primary" onclick="ftSaveS10()">Save</button>
    </div>
    ${rows}
  </div>`;
}
function ftS10Set(idx,val){
  const btns=document.querySelectorAll(`[id^="s10-btn-${idx}-"]`);
  btns.forEach(b=>{b.className='ft-radio-btn';});
  const btn=document.getElementById(`s10-btn-${idx}-${val}`);
  if(btn){const cls=val==='Pass'?'selected-pass':val==='Fail'?'selected-fail':'selected-na';btn.classList.add(cls);}
}
function ftSaveS10(){
  const rel=ftRelById(_ftSelectedRelease);if(!rel)return;
  if(!rel.stages) rel.stages={};
  if(!rel.stages.s10) rel.stages.s10={status:'Not Started',pct:0};
  const items={};
  S10_ITEMS.forEach((_,i)=>{
    const passBtn=document.getElementById(`s10-btn-${i}-Pass`);
    const failBtn=document.getElementById(`s10-btn-${i}-Fail`);
    const naBtn=document.getElementById(`s10-btn-${i}-NA`);
    let status='Not Run';
    if(passBtn?.classList.contains('selected-pass')) status='Pass';
    else if(failBtn?.classList.contains('selected-fail')) status='Fail';
    else if(naBtn?.classList.contains('selected-na')) status='NA';
    else{const stored=rel.stages.s10.data?.items?.[i];if(stored) status=stored.status||'Not Run';}
    items[i]={status,owner:document.getElementById('s10-owner-'+i)?.value||'',incidentId:document.getElementById('s10-incident-'+i)?.value||'',notes:document.getElementById('s10-notes-'+i)?.value||''};
  });
  rel.stages.s10.data={items};
  const pass=S10_ITEMS.filter((_,i)=>items[i].status==='Pass').length;
  const na=S10_ITEMS.filter((_,i)=>items[i].status==='NA').length;
  rel.stages.s10.pct=Math.round((pass+na)/S10_ITEMS.length*100);
  if(rel.stages.s10.pct===100){rel.stages.s10.status='Done';rel.status='Released';}
  else if(pass>0) rel.stages.s10.status='In Progress';
  ftSaveReleases();ftToast('Production sanity saved');ftRenderRelTab();
}

function ftAddAssignment(){
  ftOpenModal('Add Team Member',ftAssignFormHtml(null),`<button class="ftbtn" onclick="ftCloseModal()">Cancel</button><button class="ftbtn primary" onclick="ftSaveAssignment()">Add</button>`);
}
function ftEditAssignment(id){
  const rel=ftRelById(_ftSelectedRelease);if(!rel)return;
  const a=rel.teamAssignments.find(x=>x.id===id);if(!a)return;
  ftOpenModal('Edit Assignment',ftAssignFormHtml(a),`<button class="ftbtn" onclick="ftCloseModal()">Cancel</button><button class="ftbtn primary" onclick="ftSaveAssignment('${id}')">Save</button>`);
}
function ftSaveAssignment(existingId){
  const rel=ftRelById(_ftSelectedRelease);if(!rel)return;
  const member=document.getElementById('fa-member').value.trim();
  if(!member){ftToast('Member name required','error');return;}
  const data={member,role:document.getElementById('fa-role').value,module:document.getElementById('fa-module').value,testingType:document.getElementById('fa-type').value,status:document.getElementById('fa-status').value,leadStatus:document.getElementById('fa-lstatus').value,totalChecks:parseInt(document.getElementById('fa-total').value)||0,passed:parseInt(document.getElementById('fa-passed').value)||0,failed:parseInt(document.getElementById('fa-failed').value)||0,completedDate:document.getElementById('fa-completed').value,evidence:document.getElementById('fa-evidence').value,comments:document.getElementById('fa-comments').value};
  if(!rel.teamAssignments) rel.teamAssignments=[];
  if(existingId){const a=rel.teamAssignments.find(x=>x.id===existingId);if(a) Object.assign(a,data);}
  else rel.teamAssignments.push({id:ftUuid(),...data,assignedDate:new Date().toISOString()});
  ftSaveReleases();ftCloseModal();ftToast('Assignment saved');ftRenderRelTab();
}
function ftDeleteAssignment(id){
  const rel=ftRelById(_ftSelectedRelease);if(!rel)return;
  if(!confirm('Remove this assignment?'))return;
  rel.teamAssignments=rel.teamAssignments.filter(x=>x.id!==id);
  ftSaveReleases();ftToast('Assignment removed','warning');ftRenderRelTab();
}

function ftAddHistory(rel,stage,module,item,prevStatus,newStatus,by,comments){

// ══════════════════════════════════════════════════════
// TEAM WORKLOAD VIEW
// ══════════════════════════════════════════════════════
function ftRenderWorkload(){
  const el=document.getElementById('ft-view-workload');
  const memberMap={};
  _ftReleases.forEach(rel=>{
    if(rel.status==='Completed'||rel.status==='Cancelled') return;
    const proj=ftProjById(rel.projectId);
    (rel.teamAssignments||[]).forEach(a=>{
      if(!a.member) return;
      if(!memberMap[a.member]) memberMap[a.member]={name:a.member,assignments:[],activeCount:0,blockedCount:0,completedCount:0};
      const active=a.status!=='Verification Completed'&&a.status!=='Approved';
      memberMap[a.member].assignments.push({...a,projName:proj?.name||'—',relName:rel.name,relId:rel.id});
      if(active) memberMap[a.member].activeCount++;
      if(a.status==='Blocked'||a.status==='Waiting for Fix') memberMap[a.member].blockedCount++;
      if(a.status==='Verification Completed'||a.status==='Approved') memberMap[a.member].completedCount++;
    });
  });
  const members=Object.values(memberMap);
  if(members.length===0){el.innerHTML=`<div class="ft-section-hdr"><h2>👥 Team Workload</h2></div><div class="ft-empty"><div class="ft-empty-icon">👥</div><div class="ft-empty-text">No team members assigned</div><div class="ft-empty-sub">Add team members to releases to see workload.</div></div>`;return;}
  let cards='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">';
  members.forEach(m=>{
    const workloadStatus=m.blockedCount>0?'Blocked':m.activeCount>=4?'Overloaded':m.activeCount>=3?'Busy':m.activeCount>=1?'Normal':'Available';
    const wsColor={'Available':'#10b981','Normal':'#3b82f6','Busy':'#f59e0b','Overloaded':'#ef4444','Blocked':'#ef4444'}[workloadStatus];
    cards+=`<div class="ft-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:14px;font-weight:800">${ftEsc(m.name)}</div>
        <span style="padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:${wsColor}22;color:${wsColor};border:1px solid ${wsColor}44">${workloadStatus}</span>
      </div>
      <div style="display:flex;gap:12px;font-size:12px;color:var(--mut);margin-bottom:10px">
        <span>Active: <strong style="color:var(--txt)">${m.activeCount}</strong></span>
        <span>Blocked: <strong style="color:${m.blockedCount>0?'#ef4444':'var(--txt)'}">${m.blockedCount}</strong></span>
        <span>Done: <strong style="color:var(--txt)">${m.completedCount}</strong></span>
      </div>
      <div style="font-size:11px;color:var(--mut)">${m.assignments.slice(0,3).map(a=>`<div style="padding:3px 0;border-bottom:1px solid var(--border)">${ftEsc(a.projName)} · ${ftEsc(a.relName)} · ${ftEsc(a.module||'—')}</div>`).join('')}${m.assignments.length>3?`<div style="padding:3px 0;color:var(--accent)">+${m.assignments.length-3} more</div>`:''}</div>
    </div>`;
  });
  cards+='</div>';
  el.innerHTML=`<div class="ft-section-hdr"><h2>👥 Team Workload</h2></div>${cards}`;
}

  statusEntries.forEach(([s,c])=>{
    const h=Math.max(Math.round(c/maxStat*70),4);
    statusChart+=`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:11px;font-weight:700;color:var(--txt)">${c}</div>
      <div style="width:32px;height:${h}px;background:${statColors[s]||'#64748b'};border-radius:4px 4px 0 0;"></div>
      <div style="font-size:9px;color:var(--mut);text-align:center;max-width:40px;line-height:1.2">${s}</div>
    </div>`;
  });
  statusChart+='</div>';

  const bySev={Critical:0,High:0,Medium:0,Low:0};

  const maxBug=Math.max(...Object.values(bySev),1);
  const bugColors={Critical:'#ef4444',High:'#f59e0b',Medium:'#3b82f6',Low:'#10b981'};
  let bugChart='<div style="display:flex;align-items:flex-end;gap:12px;height:80px;padding:0 4px">';
  Object.entries(bySev).forEach(([s,c])=>{

      <div style="font-size:11px;font-weight:700;color:${bugColors[s]}">${c}</div>

      <div style="font-size:9px;color:var(--mut);text-align:center">${s}</div>
    </div>`;
  });
  bugChart+='</div>';

  el.innerHTML=`
  <div class="ft-section-hdr"><h2>👔 Management View (Read-Only)</h2></div>

    <div class="ft-card"><div class="ft-card-title">Open Bugs by Severity</div>${bugChart}</div>
  </div>
  <div class="ft-card">
    <div class="ft-card-title">All Releases</div>
    <div class="ft-tbl-wrap"><table class="ft-tbl">
      <thead><tr><th>Project</th><th>Release</th><th>Health</th><th>Risk</th><th>Status</th><th>Progress</th><th>Decision</th><th>Planned</th><th>Crit Bugs</th></tr></thead>
      <tbody>${relRows||`<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--mut)">No releases yet.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

// ══════════════════════════════════════════════════════

function ftGenerateReport(){

}
function ftDownloadReport(relId){
  const rel=ftRelById(relId);if(!rel){ftToast('Release not found','error');return;}
  const proj=ftProjById(rel.projectId);
  const pct=ftRelProgress(rel);
  const health=ftGetRelHealth(rel);
  const bugs=rel.bugs||[];
  const critB=bugs.filter(b=>b.severity==='Critical'&&b.status!=='Closed'&&b.status!=='Deferred').length;
  const today=new Date().toLocaleDateString('en-IN');
  const genDt=new Date().toLocaleString('en-IN');

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function badge(s,c){return `<span style="padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;background:${c}22;color:${c};border:1px solid ${c}44">${esc(s)}</span>`;}

    return `<tr><td>${esc(s.icon+' '+s.name)}</td><td>${esc(st.status||'Not Started')}</td><td>${esc(st.owner||'—')}</td><td>${esc(st.pct||0)}%</td><td>${esc(st.startDt?st.startDt.slice(0,10):'—')}</td><td>${esc(st.endDt?st.endDt.slice(0,10):'—')}</td></tr>`;
  }).join('');
  const bugRows=bugs.length===0?'<tr><td colspan="6">No bugs logged</td></tr>':bugs.map(b=>`<tr><td>${esc(b.module||'—')}</td><td>${esc(b.title)}</td><td>${esc(b.severity)}</td><td>${esc(b.priority)}</td><td>${esc(b.status)}</td><td>${esc(b.assignee||'—')}</td></tr>`).join('');
  const teamRows=(rel.teamAssignments||[]).length===0?'<tr><td colspan="5">No team assignments</td></tr>':(rel.teamAssignments||[]).map(t=>`<tr><td>${esc(t.member)}</td><td>${esc(t.role||'—')}</td><td>${esc(t.module||'—')}</td><td>${esc(t.status)}</td><td>${esc(t.leadStatus||'—')}</td></tr>`).join('');
  const decColor=decCol(rel.decision||'Pending');

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>QA Report — ${esc(proj?.name||'—')} ${esc(rel.name)}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;background:#f8fafc;padding:0}
.page{max-width:1100px;margin:0 auto;padding:32px 28px}

td{padding:7px 10px;border:1px solid #e2e8f0;vertical-align:top}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.meta-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px}
.meta-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;margin-bottom:2px}
.meta-val{font-size:13px;font-weight:700;color:#1e293b}

</div>
<div class="meta">

  <div class="meta-item"><div class="meta-lbl">Risk Level</div><div class="meta-val">${esc(rel.riskLevel||'—')}</div></div>
  <div class="meta-item"><div class="meta-lbl">Progress</div><div class="meta-val">${pct}%</div></div>
  <div class="meta-item"><div class="meta-lbl">Critical Bugs Open</div><div class="meta-val" style="color:#ef4444">${critB}</div></div>
  <div class="meta-item"><div class="meta-lbl">Planned Date</div><div class="meta-val">${esc(rel.plannedDate||'—')}</div></div>

<h2>Stage Progress</h2>
<table><thead><tr><th>Stage</th><th>Status</th><th>Owner</th><th>Progress</th><th>Start</th><th>End</th></tr></thead><tbody>${stageRows}</tbody></table>

${rel.clientNotes?`<h2>Client Notes</h2><p style="font-size:13px;padding:12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px">${esc(rel.clientNotes)}</p>`:''}
<div style="margin-top:30px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8">Report generated by Fast-Track QA Workflow · AdHash Technology · ${esc(genDt)}</div>
</div></body></html>`;

  const blob=new Blob([html],{type:'text/html'});

  ftToast('Report downloaded');
}
</script>
