body.dark .fb-status-badge.resolved{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.3)}
.fb-desc-list{list-style:none;padding:0;margin:0 0 8px 0}
.fb-desc-list li{font-size:13px;color:var(--mut);line-height:1.65;padding:2px 0 2px 18px;position:relative}
.fb-desc-list li::before{content:'•';position:absolute;left:4px;color:var(--grad-a);font-weight:700}
.fb-comment-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.fb-comment-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:4px}
.fb-comment-txt{font-size:13px;color:var(--txt);line-height:1.6;white-space:pre-wrap}
.fb-comment-count{font-size:10px;color:var(--mut);text-align:right;margin-top:2px}

.fb-priority-badge{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-left:4px}
.fb-priority-badge.low{background:rgba(16,185,129,.1);color:var(--pass)}
.fb-priority-badge.medium{background:rgba(245,158,11,.1);color:var(--blk)}
.fb-priority-badge.high{background:rgba(239,68,68,.1);color:var(--fail)}
.fb-priority-badge.critical{background:rgba(239,68,68,.2);color:var(--fail);animation:fb-pulse 1.5s infinite}
@keyframes fb-pulse{0%,100%{opacity:1}50%{opacity:.65}}

.fb-desc{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:8px}
.fb-footer{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.fb-footer-sep{opacity:.4}

.fb-subtabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:4px}
.fb-subtab{flex:1;padding:7px 12px;border-radius:8px;border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;text-align:center}
.fb-subtab.active{background:var(--card);color:var(--txt);box-shadow:0 2px 8px var(--shadow);border:1.5px solid var(--border)}
.fb-subtab .fb-sub-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:999px;background:rgba(59,130,246,.12);color:var(--inp);font-size:10px;font-weight:800;padding:0 4px;margin-left:5px;vertical-align:middle}
.fb-subtab .fb-sub-cnt.bug-cnt{background:rgba(239,68,68,.12);color:var(--fail)}
body.dark .fb-subtab .fb-sub-cnt{background:rgba(0,212,255,.12);color:var(--grad-a)}
body.dark .fb-subtab .fb-sub-cnt.bug-cnt{background:rgba(255,68,68,.12)}

.fb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.fb-stat{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center}
.fb-stat-num{font-size:22px;font-weight:800;line-height:1;margin-bottom:4px}
.fb-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
@media(max-width:700px){.fb-stats{grid-template-columns:repeat(2,1fr)}.fb-subtabs{flex-wrap:wrap}}

/* ── SSL / DOMAIN EXPIRY BADGES ── */
.ssl-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}
.ssl-ok{background:rgba(16,185,129,.1);color:var(--pass);border-color:rgba(16,185,129,.3)}
.ssl-warn{background:rgba(245,158,11,.1);color:var(--blk);border-color:rgba(245,158,11,.3)}
.ssl-expired{background:rgba(239,68,68,.1);color:var(--fail);border-color:rgba(239,68,68,.3)}
.ssl-na{background:var(--card2);color:var(--mut);border-color:var(--border)}
.pov-env-expiry-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* ── API TESTS ──────────────────────────────────────────────────────────── */
.api-wrap{padding:0}
.api-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.api-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.api-add-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;background:var(--grad-a);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(37,99,235,.2);font-family:inherit}
.api-add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.api-run-all-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(5,150,105,.25);font-family:inherit}
.api-run-all-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(5,150,105,.35)}
.api-run-all-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.api-stats-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.api-stat-chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:50px;font-size:12px;font-weight:700;border:1.5px solid}
.api-stat-pass{background:rgba(16,185,129,.08);color:var(--pass);border-color:rgba(16,185,129,.25)}
.api-stat-fail{background:rgba(239,68,68,.08);color:var(--fail);border-color:rgba(239,68,68,.25)}
.api-stat-pend{background:rgba(59,130,246,.08);color:var(--inp);border-color:rgba(59,130,246,.2)}
.api-stat-ns{background:var(--card2);color:var(--mut);border-color:var(--border)}
.api-list{display:flex;flex-direction:column;gap:12px}
.api-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;transition:all .2s}
.api-card:hover{border-color:var(--border2);box-shadow:0 8px 28px var(--shadow)}
.api-card-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.api-card-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.api-method{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.api-method.GET{background:rgba(16,185,129,.12);color:var(--pass);border:1px solid rgba(16,185,129,.3)}
.api-method.POST{background:rgba(59,130,246,.12);color:var(--inp);border:1px solid rgba(59,130,246,.3)}
.api-method.PUT{background:rgba(245,158,11,.12);color:var(--blk);border:1px solid rgba(245,158,11,.3)}
.api-method.PATCH{background:rgba(139,92,246,.12);color:#8b5cf6;border:1px solid rgba(139,92,246,.3)}
.api-method.DELETE{background:rgba(239,68,68,.12);color:var(--fail);border:1px solid rgba(239,68,68,.3)}
.api-method.HEAD,.api-method.OPTIONS{background:var(--card2);color:var(--mut);border:1px solid var(--border)}
.api-name{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.api-url{font-size:11px;color:var(--mut);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.api-status-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;flex-shrink:0;border:1px solid}
.api-status-badge.pass{background:rgba(16,185,129,.1);color:var(--pass);border-color:rgba(16,185,129,.3)}
.api-status-badge.fail{background:rgba(239,68,68,.1);color:var(--fail);border-color:rgba(239,68,68,.3)}
.api-status-badge.running{background:rgba(59,130,246,.1);color:var(--inp);border-color:rgba(59,130,246,.3)}
.api-status-badge.ns{background:var(--card2);color:var(--mut);border-color:var(--border)}
.api-card-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.api-run-btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.api-run-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.3)}
.api-run-btn:disabled{opacity:.55;pointer-events:none}
.api-edit-btn,.api-del-btn{background:none;border:1.5px solid var(--border);border-radius:8px;color:var(--mut);font-size:11px;cursor:pointer;padding:5px 10px;transition:all .15s;font-family:inherit;font-weight:600}
.api-edit-btn:hover{border-color:var(--inp);color:var(--inp)}
.api-del-btn:hover{border-color:var(--fail);color:var(--fail)}
.api-expand{transition:transform .2s;color:var(--mut);font-size:12px}
.api-expand.open{transform:rotate(180deg)}
.api-card-body{display:none;padding:0 18px 16px;border-top:1px solid var(--border)}
.api-card-body.open{display:block}
.api-body-tabs{display:flex;gap:4px;margin:12px 0 10px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:3px}
.api-body-tab{flex:1;padding:6px 10px;border-radius:7px;border:none;background:transparent;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit;text-align:center}
.api-body-tab.active{background:var(--card);color:var(--txt);box-shadow:0 2px 6px var(--shadow);border:1.5px solid var(--border)}
.api-response-wrap{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--font-mono);font-size:12px;color:var(--txt2);max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.api-response-status{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.api-res-code{padding:3px 10px;border-radius:8px;font-size:12px;font-weight:700;font-family:var(--font-mono)}
.api-res-code.ok{background:rgba(16,185,129,.12);color:var(--pass);border:1px solid rgba(16,185,129,.3)}
.api-res-code.redir{background:rgba(59,130,246,.12);color:var(--inp);border:1px solid rgba(59,130,246,.3)}
.api-res-code.err{background:rgba(239,68,68,.12);color:var(--fail);border:1px solid rgba(239,68,68,.3)}
.api-res-code.timeout{background:rgba(245,158,11,.12);color:var(--blk);border:1px solid rgba(245,158,11,.3)}
.api-res-time{font-size:11px;color:var(--mut);font-weight:600}
.api-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.api-detail-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 11px}
.api-detail-label{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.api-detail-val{font-size:12px;color:var(--txt2);font-weight:600;word-break:break-all;font-family:var(--font-mono)}
.api-empty{text-align:center;padding:56px 24px;color:var(--mut)}
.api-empty-icon{font-size:44px;margin-bottom:12px}
.api-empty-text{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--txt2)}
.api-empty-sub{font-size:12px}
.api-req-section{margin-bottom:10px}
.api-req-lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.api-kv-row{display:flex;gap:6px;margin-bottom:5px;align-items:center}
.api-kv-row input{flex:1;padding:6px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--card2);color:var(--txt);font-size:12px;outline:none;font-family:var(--font-mono);transition:border-color .2s}
.api-kv-row input:focus{border-color:var(--grad-a)}
.api-kv-rm{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:0 4px;line-height:1;transition:color .15s}
.api-kv-rm:hover{color:var(--fail)}
.api-kv-add{background:none;border:1.5px dashed var(--border);border-radius:7px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;padding:5px 12px;width:100%;transition:all .15s;font-family:inherit;margin-top:2px}
.api-kv-add:hover{border-color:var(--inp);color:var(--inp)}

/* ── DAILY TASK UPDATES ──────────────────────────────────────────────────── */
.dt-wrap{padding:0 0 40px}
.dt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.dt-title{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--grad-a) 0%,var(--grad-b) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dt-subtitle{font-size:12px;color:var(--mut);margin-top:3px}
.dt-header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-month-nav{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:5px 10px}
.dt-month-btn{background:none;border:none;color:var(--txt);font-size:16px;cursor:pointer;padding:2px 7px;border-radius:6px;line-height:1;transition:background .15s;font-family:inherit}
.dt-month-btn:hover{background:var(--card2)}
.dt-month-label{font-size:13px;font-weight:700;color:var(--txt);min-width:120px;text-align:center}
.dt-summary-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.dt-sum-chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:50px;font-size:12px;font-weight:700;border:1.5px solid}
.dt-sum-pass{background:rgba(16,185,129,.08);color:var(--pass);border-color:rgba(16,185,129,.25)}
.dt-sum-fail{background:rgba(239,68,68,.08);color:var(--fail);border-color:rgba(239,68,68,.25)}
.dt-sum-na{background:rgba(59,130,246,.08);color:var(--inp);border-color:rgba(59,130,246,.2)}
.dt-sum-blank{background:var(--card2);color:var(--mut);border-color:var(--border)}
/* week accordion */
.dt-week-block{margin-bottom:12px;border-radius:10px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--card-shadow);animation:fadeInUp .25s cubic-bezier(.16,1,.3,1)}
.dt-week-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card2);cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .12s}
.dt-week-hdr:hover{background:var(--card)}
.dt-week-title{font-size:13px;font-weight:800;color:var(--txt)}
.dt-week-range{font-size:11px;color:var(--mut);font-weight:600}
.dt-week-stats{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.dt-week-stat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid}
.dt-week-stat.pass{color:var(--pass);border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.07)}
.dt-week-stat.fail{color:var(--fail);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.07)}
.dt-week-chevron{font-size:13px;color:var(--mut);transition:transform .2s;margin-left:6px}
.dt-week-chevron.open{transform:rotate(180deg)}
.dt-week-body{display:block}
.dt-week-body.collapsed{display:none}
/* day section inside week */
.dt-day-group{border-bottom:1.5px solid var(--border)}
.dt-day-group:last-child{border-bottom:none}
.dt-day-hdr{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--border)}
.dt-today-hdr{background:rgba(37,99,235,.06)!important;border-left:3px solid var(--inp);border-bottom:1px solid rgba(37,99,235,.2)!important}
.dt-today-badge{display:inline-flex;align-items:center;background:var(--inp);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:50px;letter-spacing:.4px;margin-left:5px;vertical-align:middle}
.dt-day-label{font-size:12px;font-weight:800;color:var(--txt);min-width:80px}
.dt-day-date{font-size:11px;color:var(--mut);font-weight:600}
.dt-day-line{flex:1;height:1px;background:var(--border)}
.dt-day-count{font-size:10px;color:var(--mut);font-weight:700;background:var(--card2);border:1px solid var(--border);border-radius:50px;padding:1px 8px;white-space:nowrap}
.dt-day-add-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--grad-a);background:transparent;color:var(--grad-a);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.dt-day-add-btn:hover{background:var(--grad-a);color:#fff}
.dt-day-save-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:1.5px solid var(--pass);background:transparent;color:var(--pass);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.dt-day-save-btn:hover{background:var(--pass);color:#fff}
.dt-day-save-btn:disabled{opacity:.45;cursor:default}
/* table */
.dt-table-wrap{overflow-x:auto;background:var(--card)}
.dt-table{width:100%;border-collapse:collapse;background:var(--card);min-width:1000px}
.dt-table th{background:var(--card2);color:var(--mut);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.dt-table th:first-child,.dt-table th.col-project{text-align:left;border-right:1px solid var(--border);min-width:120px}
.dt-table th.col-assigned{text-align:left;min-width:110px}
.dt-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;text-align:center}
.dt-table td.col-project{text-align:left;border-right:1px solid var(--border);background:var(--card);position:sticky;left:0;z-index:1}
.dt-table td.col-assigned{text-align:left;font-size:11px;color:var(--txt2);font-weight:600}
.dt-table tr:last-child td{border-bottom:none}
.dt-table tr:hover td{background:var(--card2)}
.dt-table tr:hover td.col-project{background:var(--card2)}
.dt-proj-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.dt-proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dt-badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border:1px solid;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.dt-badge.pass{background:rgba(16,185,129,.12);color:var(--pass);border-color:rgba(16,185,129,.3)}
.dt-badge.fail{background:rgba(239,68,68,.1);color:var(--fail);border-color:rgba(239,68,68,.3)}
.dt-badge.na{background:rgba(59,130,246,.08);color:var(--inp);border-color:rgba(59,130,246,.2)}
.dt-badge.blank{background:var(--card2);color:var(--mut);border-color:var(--border)}
body.dark .dt-badge.pass{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.3)}
body.dark .dt-badge.fail{background:rgba(255,68,68,.1);border-color:rgba(255,68,68,.3)}
body.dark .dt-badge.na{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.2)}
.dt-row-actions{display:flex;gap:4px;align-items:center;justify-content:center}
.dt-act-btn{background:none;border:1.5px solid var(--border);border-radius:7px;color:var(--mut);font-size:11px;cursor:pointer;padding:3px 8px;transition:all .15s;font-family:inherit;line-height:1.4}
.dt-act-btn:hover{border-color:var(--inp);color:var(--inp)}
.dt-act-btn.del:hover{border-color:var(--fail);color:var(--fail)}
.dt-empty{text-align:center;padding:56px 24px;color:var(--mut)}
.dt-empty-icon{font-size:44px;margin-bottom:12px}
.dt-empty-text{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--txt2)}
.dt-empty-sub{font-size:12px;color:var(--mut)}
.dt-pj-btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.dt-pj-btn:hover,.dt-pj-btn.active{border-color:var(--border2);background:rgba(59,130,246,.07);color:var(--inp)}
.dt-filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.dt-filter-label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.dt-assigned-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(59,130,246,.08));color:#8b5cf6;border:1px solid rgba(139,92,246,.25)}
body.dark .dt-assigned-chip{background:rgba(139,92,246,.15);color:#a78bfa}
.dt-status-select{padding:5px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--txt);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:border-color .2s;outline:none;min-width:80px}
.dt-status-select:focus{border-color:var(--grad-a)}
.dt-status-select option[value="PASS"]{color:#10b981}
.dt-status-select option[value="FAIL"]{color:#ef4444}
.dt-status-select option[value="NA"]{color:#3b82f6}
/* inline edit cell select */
.dt-cell-select{border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;outline:none;background:var(--card2);color:var(--txt);transition:border-color .12s;width:100%}
.dt-cell-select:hover,.dt-cell-select:focus{border-color:var(--grad-a);background:var(--card2)}
.dt-cell-select.val-pass{color:var(--pass)}
.dt-cell-select.val-fail{color:var(--fail)}
.dt-cell-select.val-na{color:var(--inp)}
.dt-cell-select.val-blank{color:var(--mut)}
.dt-cell-select.val-assignee{font-weight:700}
.dt-assignee-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;display:inline-block;white-space:nowrap;border:1.5px solid}
.dt-day-nodata{font-size:11px;color:var(--mut);padding:12px 18px;font-style:italic}
.dt-assigned-day-sel{padding:4px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--txt);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;outline:none;transition:border-color .2s;min-width:130px}
.dt-assigned-day-sel:focus{border-color:var(--grad-a)}

/* ── TEAM TASK ASSIGNED ──────────────────────────────────────────────────── */
.tt-wrap{padding:22px 24px 48px}
.tt-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.tt-title{font-size:20px;font-weight:800;background:linear-gradient(135deg,#f97316 0%,#ef4444 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tt-subtitle{font-size:12px;color:var(--mut);margin-top:3px}
.tt-month-nav{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:5px 10px}
.tt-month-btn{background:none;border:none;color:var(--txt);font-size:16px;cursor:pointer;padding:2px 7px;border-radius:6px;line-height:1;transition:background .15s;font-family:inherit}
.tt-month-btn:hover{background:var(--card2)}
.tt-month-label{font-size:13px;font-weight:700;color:var(--txt);min-width:130px;text-align:center}
.tt-week-block{margin-bottom:12px;border-radius:10px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--card-shadow);animation:fadeInUp .25s cubic-bezier(.16,1,.3,1)}
.tt-week-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card2);cursor:pointer;user-select:none;border-bottom:1px solid var(--border);transition:background .12s}
.tt-week-hdr:hover{background:var(--card)}
.tt-week-title{font-size:13px;font-weight:800;color:var(--txt);min-width:60px}
.tt-week-range{font-size:11px;color:var(--mut);font-weight:600}
.tt-week-stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tt-week-stat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px}
.tt-week-stat.done{background:rgba(16,185,129,.12);color:#10b981}
.tt-week-stat.prog{background:rgba(59,130,246,.12);color:#3b82f6}
.tt-week-stat.todo{background:rgba(100,116,139,.1);color:var(--mut)}
.tt-week-chevron{font-size:14px;color:var(--mut);transition:transform .25s;display:inline-block}
.tt-week-chevron.open{transform:rotate(180deg)}
.tt-week-body{background:var(--card)}
.tt-week-body.collapsed{display:none}
.tt-day-group{border-bottom:1.5px solid var(--border)}
.tt-day-group:last-child{border-bottom:none}
.tt-day-hdr{display:flex;align-items:center;gap:10px;padding:9px 18px;background:var(--card);border-bottom:1px solid var(--border)}
.tt-day-label{font-size:13px;font-weight:800;color:var(--txt)}
.tt-day-date{font-size:11px;font-weight:600;color:var(--mut);background:var(--card2);padding:2px 10px;border-radius:20px;border:1px solid var(--border)}
.tt-day-line{flex:1;height:1px;background:var(--border);margin:0 4px}
.tt-day-count{font-size:11px;font-weight:700;color:var(--mut)}
.tt-day-add-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 13px;border-radius:20px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.tt-day-add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(249,115,22,.3)}
.tt-table-wrap{background:transparent}
.tt-task-cards{display:flex;flex-direction:column;gap:10px;padding:12px 0}

/* ── Task Card ── */
.tt-task-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,0.06),0 1px 2px rgba(15,23,42,0.04);border-left:4px solid transparent;transition:box-shadow .18s,transform .18s}
.tt-task-card:hover{box-shadow:0 6px 20px rgba(15,23,42,0.1),0 2px 6px rgba(15,23,42,0.06);transform:translateY(-1px)}
body.dark .tt-task-card{box-shadow:0 2px 12px rgba(0,0,0,0.35),0 0 0 1px rgba(255,255,255,0.03)}
body.dark .tt-task-card:hover{box-shadow:0 8px 28px rgba(0,0,0,0.5),0 0 0 1px rgba(126,179,255,0.1)}

.tt-task-card-body{padding:10px 14px}
.tt-task-card-line1{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.tt-task-card-line2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt-task-card-line2 .tt-sel{width:auto;min-width:110px;max-width:160px}
.tt-task-summary-txt{font-size:13px;font-weight:700;color:var(--txt);flex:1;min-width:160px}
.tt-task-card-actions{display:flex;gap:5px;margin-left:auto;flex-shrink:0}

/* Chips */
.tt-task-meta-chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.tt-task-meta-chip.hrs{color:var(--inp);font-weight:700;background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.2)}
.tt-task-meta-chip.date{color:var(--txt2);background:rgba(100,116,139,.06)}
.tt-env-chip.production{background:rgba(16,185,129,.1);color:var(--pass);border-color:rgba(16,185,129,.3);font-weight:700}
.tt-env-chip.staging{background:rgba(245,158,11,.1);color:var(--blk);border-color:rgba(245,158,11,.3);font-weight:700}
.tt-env-chip.dev{background:rgba(139,92,246,.1);color:#8b5cf6;border-color:rgba(139,92,246,.3);font-weight:700}

.tt-task-card-cmts{background:var(--card2);border-radius:7px;padding:6px 10px;font-size:11px;color:var(--txt2);margin-top:6px}
.tt-task-card-cmt-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:2px}
.pt-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--card-shadow);margin-bottom:10px}
.pt-card-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card2)}
.pt-card-title{font-weight:700;font-size:13px;color:var(--txt);flex:1}
.pt-card-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--border)}
.pt-card-body{padding:12px 14px}
.pt-field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.pt-field{display:flex;flex-direction:column;gap:3px}
.pt-field-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.pt-field-val{font-size:12px;color:var(--txt)}
.pt-cmt-box{background:var(--card2);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--txt2);margin-bottom:8px}
.pt-cmt-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:3px}
/* ── THIRD PARTY CARDS ── */
.tp-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px;transition:box-shadow .2s,border-color .2s}
.tp-card:hover{box-shadow:0 4px 24px rgba(0,0,0,.10);border-color:var(--border2)}
.tp-card-hdr{display:flex;align-items:center;gap:10px;padding:14px 18px 14px 18px;background:var(--card2);border-bottom:1.5px solid var(--border)}
.tp-card-name{font-weight:800;font-size:15px;color:var(--txt);flex:1;letter-spacing:-.2px}
.tp-card-body{padding:16px 18px}
.tp-field-row{display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px}
.tp-field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1;padding:10px 14px;border-right:1px solid var(--border);position:relative}
.tp-field:last-child{border-right:none}
.tp-field-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.tp-field-val{font-size:13px;color:var(--txt);font-weight:500;word-break:break-all}
.tp-field-url-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tp-pwd-wrap{display:flex;align-items:center;gap:6px}
.tp-pwd-toggle{background:none;border:none;padding:0;cursor:pointer;color:var(--mut);font-size:12px;line-height:1;transition:color .15s}
.tp-pwd-toggle:hover{color:var(--txt)}
.tp-env-badge{flex-shrink:0;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}
.tp-note-box{margin-top:2px;padding:10px 14px;background:var(--card2);border-radius:10px;border:1px solid var(--border);font-size:13px;color:var(--txt2);word-break:break-word;line-height:1.55}
.tp-note-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);display:block;margin-bottom:5px}
.tp-note-list{margin:0;padding-left:18px;list-style:disc}
.tp-note-list li{padding:2px 0;line-height:1.5}
.tp-apis-section{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--border)}
.apyhub-usage-card{margin-top:14px;padding:14px 16px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;border-top:3px solid #6366f1}
.firebase-otp-card{margin-top:14px;padding:14px 16px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;border-top:3px solid #f59e0b}
.messagemedia-card{margin-top:14px;padding:14px 16px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;border-top:3px solid #0ea5e9}
.tavus-card{margin-top:14px;padding:14px 16px;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;border-top:3px solid #8b5cf6}
.tp-apis-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tp-apis-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.tp-api-modal-row{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:6px}
.tp-api-run-btn{background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.3);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--pass);cursor:pointer;transition:background .15s}
.tp-api-run-btn:hover:not(:disabled){background:rgba(5,150,105,.18)}
.tp-api-run-btn:disabled{opacity:.5;cursor:not-allowed}
.tp-api-row{display:flex;align-items:stretch;gap:0;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.tp-api-row:last-child{border-bottom:none}
.tp-api-resp-panel{margin-top:2px}
.tp-resp-toggle{background:none;border:none;font-size:11px;font-weight:600;color:var(--inp);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.tp-resp-toggle:hover{color:var(--txt)}
.tp-api-modal-resp{margin-top:6px}
.tp-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.tp-hdr-actions{display:flex;align-items:center;gap:6px}
/* ── TASK CHECKLIST ── */
.tcl-wrap{padding:16px}
.tcl-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.tcl-hdr-left h3{font-size:18px;font-weight:800;color:var(--txt);margin:0}
.tcl-hdr-left p{font-size:12px;color:var(--mut);margin:3px 0 0}
.tcl-actions{display:flex;gap:8px;flex-wrap:wrap}
.tcl-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s}
.tcl-btn-primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;box-shadow:0 3px 10px rgba(59,130,246,.25)}
.tcl-btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(59,130,246,.35)}
.tcl-btn-dl{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 3px 10px rgba(16,185,129,.25)}
.tcl-btn-dl:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,.35)}
.tcl-btn-outline{background:var(--card);color:var(--mut);border:1.5px solid var(--border)}
.tcl-btn-outline:hover{border-color:var(--grad-a);color:var(--grad-a)}
body.dark .tcl-btn-outline{background:rgba(255,255,255,.04)}
.tcl-stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:18px}
.tcl-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;box-shadow:var(--card-shadow)}
.tcl-stat-val{font-size:22px;font-weight:800;line-height:1}
.tcl-stat-lbl{font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.tcl-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.tcl-table{width:100%;border-collapse:collapse;font-size:12px}
.tcl-table thead tr{background:var(--card2);border-bottom:1.5px solid var(--border)}
.tcl-table th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);white-space:nowrap}
.tcl-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--txt2)}
.tcl-table tr:last-child td{border-bottom:none}
.tcl-table tbody tr:hover{background:rgba(59,130,246,.03)}
body.dark .tcl-table tbody tr:hover{background:rgba(126,179,255,.04)}
.tcl-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid}
.tcl-badge-pass{color:#059669;background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.3)}
.tcl-badge-fail{color:#dc2626;background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2)}
.tcl-badge-na{color:#64748b;background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.25)}
.tcl-badge-pending{color:#d97706;background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.25)}
.tcl-badge-web{color:#3b82f6;background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.25)}
.tcl-badge-ios{color:#8b5cf6;background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.25)}
.tcl-badge-android{color:#10b981;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.25)}
.tcl-badge-staging{color:#f97316;background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.25)}
.tcl-badge-prod{color:#6366f1;background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.25)}
.tcl-inline-sel{background:var(--card2);border:1.5px solid var(--border);border-radius:7px;padding:4px 7px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;outline:none;transition:border-color .18s,color .18s;min-width:90px;color:var(--txt)}
.tcl-inline-sel:hover,.tcl-inline-sel:focus{border-color:var(--grad-a)}
.tcl-inline-pass{color:#059669;border-color:rgba(5,150,105,.4);background:rgba(5,150,105,.08)}
.tcl-inline-fail{color:#dc2626;border-color:rgba(220,38,38,.35);background:rgba(220,38,38,.07)}
.tcl-inline-na{color:#64748b;border-color:rgba(100,116,139,.35);background:rgba(100,116,139,.08)}
.tcl-inline-pending{color:#d97706;border-color:rgba(217,119,6,.35);background:rgba(217,119,6,.08)}
.tcl-inline-done{color:#059669;border-color:rgba(5,150,105,.4);background:rgba(5,150,105,.1)}
.tcl-inline-bugs-raised{color:#f97316;border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.09)}
.tcl-inline-bugs-closed{color:#6366f1;border-color:rgba(99,102,241,.4);background:rgba(99,102,241,.09)}
.tcl-inline-bugs-reopened{color:#ef4444;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.09)}
.tcl-inline-hold{color:#94a3b8;border-color:rgba(148,163,184,.4);background:rgba(148,163,184,.08)}
.tcl-inline-ready-prod{color:#8b5cf6;border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.09)}

// ── Deduplication utility ────────────────────────────────────────────────────
// Applied every time data enters STORE from the server to prevent any
// accumulated duplicates from surfacing in the UI.
const _PROJ_ARRAY_KEYS=['smoke','prod','feedback','thirdparty','taskchecklist',
  'pendingtasks','credentials','apitests','testdata','releaseNotes','reports','pending'];
// wfdocs excluded: they use serverId not id, are synced via syncWfDocsFromServer,
// and merging via SSE causes duplicates since entries have no stable id field.

function deduplicateById(arr,idField='id'){
  if(!Array.isArray(arr)||arr.length===0)return arr;
  const seen=new Map();
  // For reports (which have datetime but may lack id), use datetime as fallback key
  const nk=r=>r&&r.datetime?'dt:'+r.datetime:((r&&r.name)||'')+'|'+((r&&r.url)||'')+'|'+((r&&r.environment)||'');
  arr.forEach(r=>{
    if(r&&r[idField])seen.set(r[idField],r);
    else if(r){const k=nk(r);if(!seen.has('nk:'+k))seen.set('nk:'+k,r);}
  });
  return Array.from(seen.values());
}

function _deduplicateStoreProject(obj){
  if(!obj||typeof obj!=='object')return obj;
  _PROJ_ARRAY_KEYS.forEach(k=>{
    if(Array.isArray(obj[k]))obj[k]=deduplicateById(obj[k]);
  });
  if(obj.envDetails){
    if(Array.isArray(obj.envDetails.production))obj.envDetails.production=deduplicateById(obj.envDetails.production);
    if(Array.isArray(obj.envDetails.staging))obj.envDetails.staging=deduplicateById(obj.envDetails.staging);
  }
  // Dedup thirdparty.apis nested
  if(Array.isArray(obj.thirdparty)){
    obj.thirdparty.forEach(acct=>{if(Array.isArray(acct.apis))acct.apis=deduplicateById(acct.apis);});
  }
  return obj;
}

  errEl.classList.remove('show');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const d=await r.json();
    if(!r.ok||!d.success){throw new Error(d.error||d.message||'Invalid email or password');}
    _setToken(d.token||'');
    _session={id:d.user?.id||'u_sa',name:d.user?.name||'User',email:d.user?.email||email,role:d.user?.role||'member'};
    await _loadTeamMembersFromServer();
    document.getElementById('login-page').style.display='none';
    document.getElementById('dashboard').style.display='block';
    PROJECTS.forEach(p=>{curTab[p.id]=curTab[p.id]||'projoverview';});
    applyRolePermissions();
    renderTopBar();renderProjectGrid();
  }catch(e){
    errEl.textContent=e.message||'Invalid email or password.';
    errEl.classList.add('show');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Sign In →';}
  }
}

function doLogout(){
  if(!confirm('Sign out?'))return;
  _setToken('');
  _session=null;
  _teamMembersCache=[];
  fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});
  window.location.href='/landing';
}

// Apply role-based permissions — hide/show admin-only UI elements
// Silently refresh JWT every 6h so sessions never expire mid-workday
async function _silentTokenRefresh(){
  const token=_getToken();
  if(!token)return;
  try{
    const r=await fetch('/api/auth/refresh',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
    if(r.ok){const d=await r.json();if(d.token){_setToken(d.token);console.log('[auth] token refreshed silently');}}
  }catch(_){}
}

function applyRolePermissions(){

  // All delete buttons hidden for non-admins
  document.querySelectorAll('.btn-icon.del,[data-admin-only]').forEach(el=>{
    el.style.display=admin?'':'none';
  });
}

// ══ PROJECT GRID HOME ══
function renderProjectGrid(){
  const PROJ_ICONS={humee:'🤖',synctag:'🏷️',wavedin:'🌊',ddp:'📊',aisignpro:'✍️'};
  const PROJ_DESC={
    humee:'AI-powered digital twin platform for intelligent business conversations.',
    synctag:'Smart text expansion & productivity tag management system.',
    wavedin:'Professional networking and connection platform.',
    ddp:'Due diligence and deal pipeline management system.',
    aisignpro:'Electronic signature and CPA client management platform.'
  };
  // Deduplicate PROJECTS by id and sort alphabetically
  const _seenPids=new Set();
  const _sortedProjects=PROJECTS.filter(p=>{if(!p.id||_seenPids.has(p.id))return false;_seenPids.add(p.id);return true;}).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  // Today's date string for team task lookup
  const _todayStr=(()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`})();
  const cards=_sortedProjects.map(p=>{
    const s=calcStats(p.id);
    const pct=s.total?Math.round(s.pass/s.total*100):0;
    const ready=isReady(p.id);
    const hasStarted=(s.pass>0||s.fail>0||s.inp>0);
    const pillCls=s.total===0?'progress':ready?'ready':s.fail>0?'notready':hasStarted?'progress':'progress';
    const pillTxt=s.total===0?'— No Tests':ready?'✓ Release Ready':s.fail>0?`✗ ${s.fail} Failed`:hasStarted?`◌ ${pct}% In Progress`:'— Not Started';
    const pend=isAdmin()?(STORE[p.id]?.pending?.filter(x=>x.status==='pending')||[]).length:0;
    const iconBg=`${p.color}22`;
    // Prefer production URL from envDetails, fallback to env.website or project default
    const _prodEnvUrl=(STORE[p.id]?.envDetails?.production||[]).find(e=>e.url)?.url||'';
    const websiteUrl=_prodEnvUrl||STORE[p.id]?.env?.website||p.website||'';
    const faviconHtml=(()=>{
      if(!websiteUrl)return`<span style="font-size:22px">${PROJ_ICONS[p.id]||'📁'}</span>`;
      try{
        const domain=new URL(websiteUrl).hostname;
        const src=`https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
        return`<img src="${src}" width="32" height="32" style="border-radius:6px;object-fit:contain" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" alt=""><span style="font-size:22px;display:none">${PROJ_ICONS[p.id]||'📁'}</span>`;
      }catch(e){return`<span style="font-size:22px">${PROJ_ICONS[p.id]||'📁'}</span>`;}
    })();
    // Today's team tasks for this project
    const todayTasks=(TEAM_TASKS||[]).filter(t=>t.date===_todayStr&&t.projectId===p.id);
    const ttDone=todayTasks.filter(t=>t.currentStatus==='Done').length;
    const ttInProg=todayTasks.filter(t=>t.currentStatus==='In Progress'||t.currentStatus==='Partially Done').length;
    const ttTodo=todayTasks.filter(t=>t.currentStatus==='To Do').length;
    const ttHold=todayTasks.filter(t=>t.currentStatus==='Hold').length;
    const ttSkip=todayTasks.filter(t=>t.currentStatus==='Skipped').length;
    const hasTodayTasks=todayTasks.length>0;
    // Determine dominant status for card highlight color
    const taskHighlightColor=hasTodayTasks
      ?(ttDone===todayTasks.length?'#10b981':ttInProg>0?'#3b82f6':ttHold>0||ttSkip>0?'#f97316':'#f59e0b')
      :null;
    const todayTasksHtml=!hasTodayTasks
      ?`<div class="pj-today-none">No tasks assigned today</div>`
      :`<div class="pj-today-tasks-hdr"><div class="pj-today-count">${todayTasks.length}<span>task${todayTasks.length!==1?'s':''}</span></div></div>
        <div class="pj-today-chips">
          ${ttDone>0?`<span class="pj-today-chip done">✓ ${ttDone} Done</span>`:''}
          ${ttInProg>0?`<span class="pj-today-chip inprog">⟳ ${ttInProg} In Progress</span>`:''}
          ${ttTodo>0?`<span class="pj-today-chip todo">● ${ttTodo} To Do</span>`:''}
          ${ttHold>0?`<span class="pj-today-chip hold">⊘ ${ttHold} Hold</span>`:''}
          ${ttSkip>0?`<span class="pj-today-chip skip">↷ ${ttSkip} Skipped</span>`:''}
        </div>`;
    // ── Metrics ──────────────────────────────────────────────────────────────
    // Open bugs from the most recent team task entry for this project
    const _lastTaskWithBugs=(TEAM_TASKS||[]).filter(t=>t.projectId===p.id&&t.openBugs?.total).slice(-1)[0];
    const openBugs=_lastTaskWithBugs?.openBugs?.total||0;
    // Automation coverage: smoke tests pass rate (smoke = automated proxy)
    const smokeTests=STORE[p.id]?.smoke?.filter(r=>!r._pending)||[];
    const smokePass=smokeTests.filter(r=>r.status==='Pass').length;
    const autoCoverage=smokeTests.length?Math.round(smokePass/smokeTests.length*100):0;
    // Release readiness %: pass / total across smoke + prod
    const releaseReadiness=s.total?pct:0;
    // Progress bar color
    const rrColor=releaseReadiness>=80?'#10b981':releaseReadiness>=50?'#f97316':'#ef4444';
    // Status badge
    let sbCls,sbTxt,sbDot;
    if(s.total===0){sbCls='notest';sbTxt='No Tests';sbDot='none';}
    else if(ready){sbCls='ready';sbTxt='✓ Release Ready';sbDot='good';}
    else if(s.fail>0){sbCls='fail';sbTxt=`✗ ${s.fail} Failed`;sbDot='bad';}
    else if(hasTodayTasks){sbCls='active';sbTxt='Active';sbDot='good';}
    else if(hasStarted){sbCls='active';sbTxt=`${pct}% In Progress`;sbDot='warn';}
    else{sbCls='notest';sbTxt='Not Started';sbDot='none';}
    // Last updated — most recent team task date for this project, fallback today
    const _lastTask=(TEAM_TASKS||[]).filter(t=>t.projectId===p.id).slice(-1)[0];
    const _lastUpdRaw=_lastTask?.date||_todayStr;
    const _lastUpdLabel=(()=>{
      if(_lastUpdRaw===_todayStr)return'Today';
      try{return new Date(_lastUpdRaw).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}catch(e){return _lastUpdRaw;}
    })();
    // Card highlight styles when tasks exist today
    const cardHighlight=hasTodayTasks
      ?`border-color:${taskHighlightColor}55;box-shadow:0 0 0 1.5px ${taskHighlightColor}33,0 4px 20px ${taskHighlightColor}18`
      :'';
    return`<div class="pj-card${hasTodayTasks?' pj-card-active':''}" style="${cardHighlight}" onclick="switchProj('${p.id}')">
      <div class="pj-card-top" style="background:linear-gradient(90deg,${hasTodayTasks?taskHighlightColor:p.color},${hasTodayTasks?taskHighlightColor+'99':p.color+'88'});height:${hasTodayTasks?'5px':'4px'}"></div>
      <div class="pj-card-body">

        <!-- ① Header: logo + name + status badge -->
        <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">
          <div class="pj-icon" style="background:${iconBg};border:1.5px solid ${p.color}44">${faviconHtml}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
              <div class="pj-name" style="flex:1;min-width:0">${p.name}${pend>0?`<span style="display:inline-flex;margin-left:6px;padding:1px 7px;border-radius:50px;font-size:9px;font-weight:800;background:rgba(239,68,68,.12);color:var(--fail);border:1px solid rgba(239,68,68,.3)">${pend}</span>`:''}</div>
              <span class="pj-status-badge ${sbCls}">${sbTxt}</span>
            </div>
            <div class="pj-sub" style="margin-top:3px">${PROJ_DESC[p.id]||''}</div>
          </div>
        </div>

        <!-- ② Metrics grid: Today Tasks / Test Cases / Open Bugs / Auto % / Readiness % -->
        <div class="pj-metrics">
          <div class="pj-metric">
            <div class="pj-metric-icon">📅</div>
            <div class="pj-metric-val" style="${hasTodayTasks?'color:var(--inp)':''}">${todayTasks.length}</div>
            <div class="pj-metric-lbl">Today Tasks</div>
          </div>
          <div class="pj-metric">
            <div class="pj-metric-icon">🧪</div>
            <div class="pj-metric-val">${s.total}</div>
            <div class="pj-metric-lbl">Test Cases</div>
          </div>
          <div class="pj-metric">
            <div class="pj-metric-icon">🐛</div>
            <div class="pj-metric-val" style="${openBugs>0?'color:var(--fail)':''}">${openBugs}</div>
            <div class="pj-metric-lbl">Open Bugs</div>
          </div>
          <div class="pj-metric">
            <div class="pj-metric-icon">🤖</div>
            <div class="pj-metric-val" style="${autoCoverage>0?'color:var(--pass)':''}">${autoCoverage}%</div>
            <div class="pj-metric-lbl">Auto Cover</div>
          </div>
          <div class="pj-metric" style="grid-column:span 2">
            <div class="pj-metric-icon">🚀</div>
            <div class="pj-metric-val" style="color:${rrColor}">${releaseReadiness}%</div>
            <div class="pj-metric-lbl">Release Readiness</div>
          </div>
        </div>

        <!-- ③ Release readiness progress bar -->
        <div class="pj-readiness">
          <div class="pj-readiness-hdr">
            <span class="pj-readiness-lbl">Release Readiness</span>
            <span class="pj-readiness-pct" style="color:${rrColor}">${releaseReadiness}%</span>
          </div>
          <div class="pj-readiness-bar">
            <div class="pj-readiness-fill" style="width:${releaseReadiness}%;background:${rrColor}"></div>
          </div>
        </div>

        <!-- ④ Today's tasks section (kept compact, no label header) -->
        ${hasTodayTasks?`<div class="pj-today-tasks pj-today-tasks-active" style="margin-bottom:12px">
          <div class="pj-today-tasks-hdr">
            <div class="pj-today-tasks-label has-tasks">Today's Tasks</div>
            <div class="pj-today-count">${todayTasks.length}<span>task${todayTasks.length!==1?'s':''}</span></div>
          </div>
          <div class="pj-today-chips">
            ${ttDone>0?`<span class="pj-today-chip done">✓ ${ttDone}</span>`:''}
            ${ttInProg>0?`<span class="pj-today-chip inprog">⟳ ${ttInProg}</span>`:''}
            ${ttTodo>0?`<span class="pj-today-chip todo">● ${ttTodo}</span>`:''}
            ${ttHold>0?`<span class="pj-today-chip hold">⊘ ${ttHold}</span>`:''}
            ${ttSkip>0?`<span class="pj-today-chip skip">↷ ${ttSkip}</span>`:''}
          </div>
        </div>`:''}

        <!-- ⑤ Quick action buttons -->
        <div class="pj-actions" onclick="event.stopPropagation()">
          <button class="pj-act-btn" onclick="switchProj('${p.id}')">📊 Dashboard</button>

          <button class="pj-act-btn" onclick="switchProj('${p.id}');setTimeout(()=>switchTab('${p.id}','checklist'),80)">✅ Checklist</button>
          <button class="pj-act-btn" onclick="switchProj('${p.id}');setTimeout(()=>switchTab('${p.id}','reports'),80)">📈 Reports</button>
        </div>

        <!-- ⑥ Footer -->

          <div class="pj-last-updated">
            <span class="pj-health-dot ${sbDot}"></span>
            <span>Updated ${_lastUpdLabel}</span>
          </div>
          <div class="pj-arrow">→</div>
        </div>

      </div>
    </div>`;
  }).join('');
  const todayLabel=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('app').innerHTML=`
    <div class="proj-home">
      <div class="proj-home-hero">
        <div class="proj-home-hero-glow"></div>
        <h2>QA Project Workspace</h2>
        <p>Select a project to view test cases, production checklists, reports and more</p>
        <div class="proj-home-hero-date">📅 ${todayLabel}</div>
      </div>
      <div class="pj-grid-footer">
        <button class="pj-add-btn" onclick="showDailyTasks()">📅 Daily Task Updates</button>

        <button class="pj-add-btn" style="background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%);box-shadow:0 4px 16px rgba(139,92,246,.3)" onclick="showNextReleases()">📆 Next Releases</button>
        <button class="pj-add-btn" style="background:linear-gradient(135deg,#64748b 0%,#475569 100%);box-shadow:0 4px 16px rgba(100,116,139,.3)" onclick="showPastReleases()">📁 Past Releases</button>
        <button class="pj-add-btn" style="background:linear-gradient(135deg,#0ea5e9 0%,#6366f1 100%);box-shadow:0 4px 16px rgba(14,165,233,.3)" onclick="showStatusReports()">📊 Status Reports</button>
        ${isAdmin()?`<button class="pj-add-btn" onclick="openAddProject()">＋ New Project</button>`:''}
        ${isAdmin()?`<button class="pj-users-btn" onclick="showUsers()">👥 Manage Users</button>`:''}
      </div>
      <div class="proj-grid">${cards}</div>
    </div>`;
}

function switchProj(id){
  curProj=id;curView='project';
  if(!curTab[id])curTab[id]='projoverview';
  renderProject(id);
  // Scroll to top when entering a project page
  window.scrollTo({top:0,behavior:'instant'});
}
function switchTab(p,tab){curTab[p]=tab;renderProject(p);window.scrollTo({top:0,behavior:'instant'});}
function goHome(){curView='home';renderProjectGrid();window.scrollTo({top:0,behavior:'instant'});}

// ══ RENDER PROJECT ══
function renderProject(p){
  // Users is now a modal overlay — no page nav needed here
  if(curView==='dailytasks'){renderDailyTasksPage();return;}
  if(curView==='teamtasks'){renderTeamTasksPage();return;}
  if(curView==='todayreleases'){renderReleasesPage('today');return;}
  if(curView==='nextreleases'){renderReleasesPage('next');return;}
  if(curView==='pastreleases'){renderReleasesPage('past');return;}
  if(curView==='statusreports'){renderStatusReportsPage();return;}
  const proj=PROJECTS.find(x=>x.id===p);
  const pend=(STORE[p].pending||[]).filter(x=>x.status==='pending').length;
  const s=calcStats(p);
  const pct=s.total?Math.round(s.pass/s.total*100):0;
  const fbCount=(STORE[p].feedback||[]).length;
  const tabs=[
    {id:'projoverview', label:'Overview'},
    {id:'credentials',  label:'🔐 Credentials',     count:(STORE[p].credentials||[]).length||null},
    {id:'wfdocs',       label:'📁 Workflow Docs',    count:(()=>{const _s=new Set();return(STORE[p].wfdocs||[]).filter(d=>{const k=(d.name||'')+'__'+(d.size||0);return _s.has(k)?false:(_s.add(k),true);}).length||null;})()},
    {id:'smoke',        label:`🔥 Smoke Tests`,      count:STORE[p].smoke.filter(r=>!r._pending).length},
    {id:'prod',         label:`✅ Prod Checklist`,   count:STORE[p].prod.filter(r=>!r._pending).length},
    {id:'testdata',     label:'🧪 Test Data'},
    {id:'apitests',     label:'🌐 API Tests',         count:(STORE[p].apitests||[]).length||null},
    {id:'overview',     label:'📊 Test Report'},
    {id:'reports',      label:'💾 Saved Reports',    count:STORE[p].reports.length},
    {id:'releasenotes', label:'📝 Release Notes'},
    {id:'feedback',     label:'💬 Client Feedback',  count:fbCount||null},
    {id:'pendingtasks',label:'📋 Pending Tasks',count:(STORE[p].pendingtasks||[]).length},
    {id:'thirdparty',label:'🔗 Third Party',count:(STORE[p].thirdparty||[]).length},
    {id:'taskchecklist',label:'✔ Task Checklist',count:(STORE[p].taskchecklist||[]).length||null},
    {id:'swagger',label:'⚡ Swagger'},
    ...(isAdmin()&&pend>0?[{id:'approvals',label:`🔔 Approvals`,count:pend}]:[])
  ];
  const tab=curTab[p]||'projoverview';
  let content='';
  if(tab==='smoke')             content=renderTestTable(p,'smoke');
  else if(tab==='prod')         content=renderTestTable(p,'prod');
  else if(tab==='testdata')     content=renderTestDataTab(p);
  else if(tab==='releasenotes') content=renderReleaseNotes(p);
  else if(tab==='reports')      content=renderReports(p);
  else if(tab==='overview')     content=renderOverview(p);
  else if(tab==='projoverview') content=renderProjOverview(p);
  else if(tab==='pendingtasks') content=renderPendingTasksTab(p);
  else if(tab==='thirdparty')   content=renderThirdPartyTab(p);
  else if(tab==='taskchecklist')content=renderTaskChecklist(p);
  else if(tab==='feedback')     content=renderFeedback(p);
  else if(tab==='wfdocs')       content=renderWorkflowDocs(p);
  else if(tab==='credentials')  content=renderCredentials(p);
  else if(tab==='apitests')     content=renderApiTests(p);
  else if(tab==='swagger')      content=renderSwaggerTab(p);
  else if(tab==='approvals')    content=renderApprovals(p);

  const needsBar=tab==='smoke'||tab==='prod';
  const PROJ_ICONS={humee:'🤖',synctag:'🏷️',wavedin:'🌊',ddp:'📊',aisignpro:'✍️'};
  // Prefer production URL from envDetails for favicon (same logic as project cards)
  const _hdrProdUrl=(STORE[p]?.envDetails?.production||[]).find(e=>e.url)?.url||'';
  const _hdrWebsite=_hdrProdUrl||STORE[p]?.env?.website||proj?.website||'';
  const _hdrFavicon=(()=>{
    if(!_hdrWebsite)return`<span style="font-size:18px">${PROJ_ICONS[p]||'📁'}</span>`;
    try{
      const _dom=new URL(_hdrWebsite).hostname;
      const _src=`https://www.google.com/s2/favicons?domain=${_dom}&sz=64`;
      return`<img src="${_src}" width="22" height="22" style="border-radius:4px;object-fit:contain;vertical-align:middle;margin-right:2px" onerror="this.style.display='none'" alt="">`;
    }catch(e){return`<span style="font-size:18px">${PROJ_ICONS[p]||'📁'}</span>`;}
  })();
  document.getElementById('app').innerHTML=`
    <div class="proj-wrap">
      <div class="proj-detail-hdr">
        <button class="btn-back" onclick="goHome()">← All Projects</button>
        <span class="proj-detail-dot" style="background:${proj?.color||'var(--grad-a)'}"></span>
        <span class="proj-detail-name">${_hdrFavicon} ${proj?.name||p}</span>
        <div class="proj-detail-right">
          <span style="font-size:12px;font-weight:700;padding:3px 12px;border-radius:50px;background:${isReady(p)?'rgba(16,185,129,.1)':'rgba(59,130,246,.08)'};color:${isReady(p)?'var(--pass)':'var(--inp)'};border:1px solid ${isReady(p)?'rgba(16,185,129,.3)':'rgba(59,130,246,.25)'}">${pct}% Pass Rate</span>
          ${isAdmin()?`<button class="btn-icon" onclick="openEditProject('${p}')">✏ Edit</button>`:''}
          ${isAdmin()?`<button class="btn-icon del" onclick="deleteProject('${p}')">✕ Remove</button>`:''}
        </div>
      </div>
      <div class="itabs">
        <div class="itab itab-back" onclick="switchTab('${p}','projoverview')" title="Back to Overview">← Overview</div>
        ${tabs.filter(t=>t.id!=='projoverview').map(t=>`<div class="itab${t.id===tab?' active':''}" onclick="switchTab('${p}','${t.id}')">${t.label}${t.count!=null?`<span class="itab-count">${t.count}</span>`:''}</div>`).join('')}
      </div>
      <div class="tab-content" id="tab-content">${content}</div>
      ${needsBar?renderActionBar(p,tab):''}
    </div>`;
}

// ══ ACTION BAR ══
function renderActionBar(p,sec){
  const data=STORE[p][sec]||[];
  const shown=data.filter(r=>!r._pending).length;
  return`<div class="abar">
    <button class="btn btn-pass" onclick="markAllPass('${p}','${sec}')">✓ All Pass</button>
    <button class="btn btn-reset" onclick="resetSection('${p}','${sec}')">↺ Reset All</button>
    <button class="btn btn-save" onclick="saveAndReport('${p}')">💾 Save Report</button>
    <button class="btn btn-download" onclick="downloadReport('${p}')">⬇ Download Report</button>
    <button class="btn btn-secondary" onclick="openAddRow('${p}','${sec}')">＋ Add Test Case</button>
    <span class="abar-count" id="${p}-${sec}-shown">${shown} of ${shown} shown</span>
  </div>`;
}
function markAllPass(p,sec){
  if(!confirm(`Mark ALL ${sec==='smoke'?'Smoke Tests':'Production items'} as Pass?`))return;
  STORE[p][sec].forEach(r=>{if(!r._pending)r.status='Pass';});
  saveToLS(p);renderProject(p);toast('All marked as Pass ✓');
}
function resetSection(p,sec){
  if(!confirm(`Reset all ${sec==='smoke'?'Smoke Test':'Production'} statuses to Not Started?`))return;
  STORE[p][sec].forEach(r=>{if(!r._pending){r.status='Not Started';r.comment='';}});
  saveToLS(p);renderProject(p);toast('Statuses reset');
}
function saveAndReport(p){saveState(p);}

// ══ OVERVIEW ══
// ══ PROJECT OVERVIEW (Env Details Grid) ══
function renderProjOverview(p){
  const ed=STORE[p].envDetails||{production:[],staging:[]};
  const prodEnv=ed.production||[];
  const stagEnv=ed.staging||[];
  const isMobile=isMobileProject(p);
  const plat=getPlatform(p);
  // platform-filtered stats
  const allRows=[...platformRows(p,'smoke'),...platformRows(p,'prod')];
  const s={
    total:allRows.length,
    pass:allRows.filter(r=>r.status==='Pass').length,
    fail:allRows.filter(r=>r.status==='Fail').length,
    blocked:allRows.filter(r=>r.status==='Blocked').length,
    ns:allRows.filter(r=>r.status==='Not Started').length,
    inp:allRows.filter(r=>r.status==='In Progress').length
  };
  const pct=s.total?Math.round(s.pass/s.total*100):0;
  const critFail=platformRows(p,'smoke').some(r=>r.priority==='Critical'&&(r.status==='Fail'||r.status==='Blocked'));
  const prodIssue=platformRows(p,'prod').some(r=>r.status==='Fail'||r.status==='Blocked');
  const ready=!critFail&&!prodIssue&&s.total>0&&s.pass===s.total;
  const platLabel=isMobile?(plat==='android'?'Android':'iOS'):'';

  // ── Hero ──
  const hero=`
    <div class="pov-hero">
      <div class="pov-hero-left">
        ${isMobile?platformSwitcher(p,'projoverview'):''}
        <div class="pov-hero-label" style="margin-top:${isMobile?'10px':'0'}">${ready?'<span class="pov-ready-badge pov-badge-green">● Release Ready</span>':'<span class="pov-ready-badge pov-badge-red">● Not Ready</span>'}</div>
        <div class="pov-hero-pct">${pct}<span style="font-size:20px;font-weight:600;opacity:.7">%</span></div>
        <div class="pov-hero-sub">Pass Rate · ${s.pass} of ${s.total}${isMobile?` ${platLabel}`:''} test cases</div>
      </div>
      <div class="pov-hero-right">
        <div class="pov-stats">
          <div class="pov-stat-chip pov-chip-pass"><span class="pov-stat-n">${s.pass}</span><span class="pov-stat-l">Passed</span></div>
          <div class="pov-stat-chip pov-chip-fail"><span class="pov-stat-n">${s.fail}</span><span class="pov-stat-l">Failed</span></div>
          <div class="pov-stat-chip pov-chip-blk"><span class="pov-stat-n">${s.blocked}</span><span class="pov-stat-l">Blocked</span></div>
          <div class="pov-stat-chip pov-chip-ns"><span class="pov-stat-n">${s.ns}</span><span class="pov-stat-l">Not Started</span></div>
          <div class="pov-stat-chip pov-chip-total"><span class="pov-stat-n">${s.total}</span><span class="pov-stat-l">Total</span></div>
        </div>
        <div class="pov-pbar-wrap">
          <div class="pov-pbar-track">
            <div class="pov-pbar-pass" style="width:${s.total?Math.round(s.pass/s.total*100):0}%"></div>
            <div class="pov-pbar-fail" style="width:${s.total?Math.round(s.fail/s.total*100):0}%"></div>
            <div class="pov-pbar-blk"  style="width:${s.total?Math.round(s.blocked/s.total*100):0}%"></div>
          </div>
          <div class="pov-pbar-legend">
            <span class="pov-leg pov-leg-pass">Pass</span>
            <span class="pov-leg pov-leg-fail">Fail</span>
            <span class="pov-leg pov-leg-blk">Blocked</span>
          </div>
        </div>
      </div>
    </div>`;

  // ── Env section ──
  const envSection=(type,items)=>{
    const isProd=type==='production';
    const accentCls=isProd?'pov-env-prod':'pov-env-stage';
    const dotCls=isProd?'pov-env-dot-prod':'pov-env-dot-stage';
    const typeLabel=isProd?'Production':'Staging';
    const cards=items.map((item,i)=>`
      <div class="pov-env-card ${accentCls}">
        <div class="pov-env-card-hdr">
          <span class="pov-env-name-txt">${escH(item.name)}</span>
          ${isAdmin()?`<div class="pov-env-actions">
            <button class="pov-env-btn-icon" title="Edit" onclick="openEnvDetailModal('${p}','${type}',${i})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="pov-env-btn-icon pov-env-btn-del" title="Remove" onclick="deleteEnvDetail('${p}','${type}',${i})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>`:''}
        </div>
        ${item.url?`<a class="pov-env-url" href="${escH(item.url)}" target="_blank" rel="noopener">🔗 ${escH(item.url)}</a>`:''}
        ${item.domain?`<div class="pov-env-domain-row"><span class="pov-env-domain-lbl">Pointed Domain</span><span class="pov-env-domain-val">${escH(item.domain)}</span></div>`:''}
        ${(item.sslExpiry||item.domainExpiry)?`<div class="pov-env-expiry-row">${item.sslExpiry?expiryBadge('🔒 SSL',item.sslExpiry):''}${item.domainExpiry?expiryBadge('🌐 Domain',item.domainExpiry):''}</div>`:''}
      </div>`).join('');

    return`<div class="pov-env-section">
      <div class="pov-env-sec-hdr">
        <div class="pov-env-sec-title-wrap">
          <span class="pov-env-dot ${dotCls}"></span>
          <span class="pov-env-sec-title">${typeLabel}</span>
          <span class="pov-env-count-badge">${items.length}</span>
        </div>
        ${isAdmin()?`<button class="pov-add-btn" onclick="openEnvDetailModal('${p}','${type}')">＋ Add ${typeLabel}</button>`:''}
      </div>
      ${items.length
        ?`<div class="pov-env-grid">${cards}</div>`
        :`<div class="pov-env-empty">No ${typeLabel.toLowerCase()} environments added yet.${isAdmin()?` <button class="pov-add-btn" style="margin-left:10px" onclick="openEnvDetailModal('${p}','${type}')">＋ Add</button>`:''}</div>`}
    </div>`;
  };

  // ── Expiry badge helper ──
  function expiryBadge(label,dateStr){
    if(!dateStr)return'';
    const exp=new Date(dateStr);const now=new Date();
    const diffDays=Math.round((exp-now)/(1000*60*60*24));
    let cls,icon,txt;
    if(diffDays<0){cls='ssl-expired';icon='✕';txt=`${label} Expired`;}
    else if(diffDays<=30){cls='ssl-warn';icon='⚠';txt=`${label} ~${diffDays}d`;}
    else{cls='ssl-ok';icon='✓';txt=`${label} ${exp.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;}
    return`<span class="ssl-badge ${cls}">${icon} ${escH(txt)}</span>`;
  }

  // ── Section cards (home-page style) ──
  const smoke=platformRows(p,'smoke');
  const prod2=platformRows(p,'prod');
  const smokePass=smoke.filter(r=>r.status==='Pass').length;
  const smokeFail=smoke.filter(r=>r.status==='Fail').length;
  const smokePct=smoke.length?Math.round(smokePass/smoke.length*100):0;
  const prodPass=prod2.filter(r=>r.status==='Pass').length;
  const prodFail=prod2.filter(r=>r.status==='Fail').length;
  const prodPct=prod2.length?Math.round(prodPass/prod2.length*100):0;
  const smokeLabel=isMobile?`🔥 Smoke Tests (${plat==='android'?'Android':'iOS'})`:'🔥 Smoke Tests';
  const prodLabel=isMobile?`✅ Prod Checklist (${plat==='android'?'Android':'iOS'})`:'✅ Prod Checklist';
  const credsLen=(STORE[p].credentials||[]).length;
  const docsLen=(()=>{const _s=new Set();return(STORE[p].wfdocs||[]).filter(d=>{const k=(d.name||'')+'__'+(d.size||0);return _s.has(k)?false:(_s.add(k),true);}).length;})();
  const repsLen=(STORE[p].reports||[]).length;
  const tdLen=(STORE[p].testdata||[]).length;
  const rnLen=(STORE[p].releaseNotes||[]).length;
  const fbLen=(STORE[p].feedback||[]).length;
  const fbOpen=(STORE[p].feedback||[]).filter(f=>['open','inprogress','clarification','deferred'].includes(f.status)).length;
  const apiLen=(STORE[p].apitests||[]).length;
  const apiPass=(STORE[p].apitests||[]).filter(a=>a.lastStatus==='pass').length;
  const apiFail=(STORE[p].apitests||[]).filter(a=>a.lastStatus==='fail').length;
  const apiPct=apiLen?Math.round(apiPass/apiLen*100):0;
  // test report summary
  const allTestRows=[...smoke,...prod2];
  const trPct=allTestRows.length?Math.round(allTestRows.filter(r=>r.status==='Pass').length/allTestRows.length*100):0;
  const trFail=allTestRows.filter(r=>r.status==='Fail'||r.status==='Blocked').length;

  // Each card: color bar, icon, name, 3 stat rows (label left / value right), progress bar, status pill
  const mkCard=(tab,color,icon,name,stat1,stat2,stat3,barPct,pillCls,pillTxt)=>`
    <div class="pj-card" onclick="switchTab('${p}','${tab}')">
      <div class="pj-card-top" style="background:linear-gradient(90deg,${color},${color}88)"></div>
      <div class="pj-card-body">
        <div class="pj-name-row" style="margin-bottom:12px">
          <div class="pj-icon" style="background:${color}22;border:1.5px solid ${color}44;font-size:22px">${icon}</div>
          <div><div class="pj-name" style="font-size:15px">${name}</div></div>
        </div>
        <div class="pj-statlist">
          <div class="pj-statrow"><span class="pj-statrow-lbl">${stat1.l}</span><span class="pj-statrow-val" style="color:${stat1.c||'var(--txt)'}">${stat1.v}</span></div>
          <div class="pj-statrow"><span class="pj-statrow-lbl">${stat2.l}</span><span class="pj-statrow-val" style="color:${stat2.c||'var(--txt)'}">${stat2.v}</span></div>
          <div class="pj-statrow"><span class="pj-statrow-lbl">${stat3.l}</span><span class="pj-statrow-val" style="color:${stat3.c||'var(--txt)'}">${stat3.v}</span></div>
        </div>
        ${barPct!==null?`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);font-weight:600;margin-bottom:4px"><span>Progress</span><span style="font-weight:800;color:var(--txt)">${barPct}%</span></div><div class="pj-pbar"><div class="pj-pbar-fill" style="width:${barPct}%;background:linear-gradient(90deg,${color},${color}cc)"></div></div></div>`:''}
        <div class="pj-footer">
          <span class="pj-status-pill ${pillCls}">${pillTxt}</span>
          <div class="pj-arrow">→</div>
        </div>
      </div>
    </div>`;

  const sectionCards=[
    mkCard('credentials','#ec4899','🔐','Credentials',
      {v:credsLen,l:'Total',c:'var(--grad-a)'},
      {v:credsLen,l:'Entries',c:'var(--txt2)'},
      {v:'—',l:'Auth'},
      null,'progress',`● ${credsLen} Entr${credsLen!==1?'ies':'y'}`),
    mkCard('wfdocs','#f59e0b','📁','Workflow Docs',
      {v:docsLen,l:'Files',c:'var(--grad-a)'},
      {v:'PDF',l:'Format'},
      {v:'XLSX',l:'Format'},
      null,'progress',`● ${docsLen} File${docsLen!==1?'s':''}`),
    mkCard('smoke','#f97316','🔥',isMobile?`Smoke (${plat==='android'?'Android':'iOS'})`:'Smoke Tests',
      {v:smoke.length,l:'Total',c:'var(--grad-a)'},
      {v:smokePass,l:'Passed',c:'var(--pass)'},
      {v:smokeFail,l:'Failed',c:smokeFail>0?'var(--fail)':'var(--ns)'},
      smokePct,
      smokePct===100?'ready':smokePass>0?'progress':'notready',
      smokePct===100?'✓ All Pass':smokePass>0?`◌ ${smokePct}%`:'✗ Not Run'),
    mkCard('prod','#10b981','✅',isMobile?`Checklist (${plat==='android'?'Android':'iOS'})`:'Prod Checklist',
      {v:prod2.length,l:'Total',c:'var(--grad-a)'},
      {v:prodPass,l:'Passed',c:'var(--pass)'},
      {v:prodFail,l:'Failed',c:prodFail>0?'var(--fail)':'var(--ns)'},
      prodPct,
      prodPct===100?'ready':prodPass>0?'progress':'notready',
      prodPct===100?'✓ All Pass':prodPass>0?`◌ ${prodPct}%`:'✗ Not Run'),
    mkCard('testdata','#8b5cf6','🧪','Test Data',
      {v:tdLen,l:'Accounts',c:'var(--grad-a)'},
      {v:'Creds',l:'Type'},
      {v:'Users',l:'Type'},
      null,'progress',`● ${tdLen} Entr${tdLen!==1?'ies':'y'}`),
    mkCard('apitests','#0ea5e9','🌐','API Tests',
      {v:apiLen,l:'Total',c:'var(--grad-a)'},
      {v:apiPass,l:'Passed',c:'var(--pass)'},
      {v:apiFail,l:'Failed',c:apiFail>0?'var(--fail)':'var(--ns)'},
      apiLen?apiPct:null,
      apiLen===0?'notready':apiPct===100?'ready':'progress',
      apiLen===0?'● No APIs':apiPct===100?'✓ All Pass':`◌ ${apiPct}%`),
    mkCard('overview','#e879f9','📊','Test Report',
      {v:allTestRows.length,l:'Total',c:'var(--grad-a)'},
      {v:trPct+'%',l:'Pass Rate',c:trPct===100?'var(--pass)':trFail>0?'var(--fail)':'var(--txt)'},
      {v:trFail,l:'Issues',c:trFail>0?'var(--fail)':'var(--ns)'},
      trPct,
      trPct===100&&allTestRows.length>0?'ready':trFail>0?'notready':'progress',
      trPct===100&&allTestRows.length>0?'✓ Release Ready':trFail>0?`✗ ${trFail} Issue${trFail!==1?'s':''}`:'◌ In Progress'),
    mkCard('reports','#6366f1','💾','Saved Reports',
      {v:repsLen,l:'Snapshots',c:'var(--grad-a)'},
      {v:'HTML',l:'Format'},
      {v:'DL',l:'Export'},
      null,'progress',`● ${repsLen} Snapshot${repsLen!==1?'s':''}`),
    mkCard('releasenotes','#06b6d4','📝','Release Notes',
      {v:rnLen,l:'Entries',c:'var(--grad-a)'},
      {v:'Notes',l:'Type'},
      {v:'Vers.',l:'History'},
      null,'progress',`● ${rnLen} Note${rnLen!==1?'s':''}`),
    mkCard('feedback','#14b8a6','💬','Client Feedback',
      {v:fbLen,l:'Total',c:'var(--grad-a)'},
      {v:fbOpen,l:'Open',c:fbOpen>0?'var(--fail)':'var(--ns)'},
      {v:fbLen-fbOpen,l:'Resolved',c:'var(--pass)'},
      fbLen?Math.round((fbLen-fbOpen)/fbLen*100):0,
      fbOpen===0&&fbLen>0?'ready':fbLen>0?'progress':'notready',
      fbOpen===0&&fbLen>0?'✓ All Resolved':fbOpen>0?`◌ ${fbOpen} Open`:'● No Feedback'),
    mkCard('pendingtasks','#f97316','📋','Pending Tasks',
      {v:(STORE[p].pendingtasks||[]).length,l:'Total',c:'var(--grad-a)'},
      {v:(STORE[p].pendingtasks||[]).filter(t=>t.status==='In Progress').length,l:'In Progress',c:'var(--blk)'},
      {v:(STORE[p].pendingtasks||[]).filter(t=>t.status==='Done').length,l:'Done',c:'var(--pass)'},
      (STORE[p].pendingtasks||[]).length?Math.round((STORE[p].pendingtasks||[]).filter(t=>t.status==='Done').length/(STORE[p].pendingtasks||[]).length*100):null,
      (STORE[p].pendingtasks||[]).length===0?'notready':(STORE[p].pendingtasks||[]).every(t=>t.status==='Done')?'ready':'progress',
      (STORE[p].pendingtasks||[]).length===0?'● No Tasks':(STORE[p].pendingtasks||[]).every(t=>t.status==='Done')?'✓ All Done':`◌ ${(STORE[p].pendingtasks||[]).filter(t=>t.status!=='Done').length} Pending`),
    mkCard('thirdparty','#8b5cf6','🔗','Third Party Accounts',
      {v:(STORE[p].thirdparty||[]).length,l:'Total',c:'var(--grad-a)'},
      {v:(STORE[p].thirdparty||[]).filter(t=>t.apis&&t.apis.length>0).reduce((s,t)=>s+(t.apis||[]).length,0),l:'APIs',c:'var(--inp)'},
      {v:(STORE[p].thirdparty||[]).filter(t=>{if(!t.expiryDate)return false;const d=new Date(t.expiryDate);return(d-new Date())/(1000*60*60*24)<=30;}).length,l:'Expiring',c:'var(--blk)'},
      null,
      (STORE[p].thirdparty||[]).length===0?'notready':'progress',
      (STORE[p].thirdparty||[]).length===0?'● No Accounts':`● ${(STORE[p].thirdparty||[]).length} Account${(STORE[p].thirdparty||[]).length!==1?'s':''}`),
  ].join('');

  return`<div class="pov-wrap">
    ${hero}
    <div class="pov-env-wrap">
      ${envSection('production',prodEnv)}
      ${envSection('staging',stagEnv)}
    </div>
    <div class="pov-divider"><span>Sections</span></div>
    <div class="proj-grid">${sectionCards}</div>
  </div>`;
}
