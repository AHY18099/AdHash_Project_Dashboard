  const items=(STORE[p].envDetails||{})[type]||[];
  const existing=isEdit?items[editIdx]:null;
  const e=existing||{name:'',url:'',domain:'',sslExpiry:'',domainExpiry:''};
  const typeLabel=type==='production'?'Production':'Staging';
  const body=`
    <div style="margin-bottom:12px">
      <label class="flbl">Name *</label>
      <input class="finp" id="ped-name" value="${escH(e.name)}" placeholder="e.g. US Production" autocomplete="off" />
    </div>
    <div style="margin-bottom:12px">
      <label class="flbl">URL</label>
      <input class="finp" id="ped-url" value="${escH(e.url)}" placeholder="https://app.example.com" autocomplete="off" />
    </div>
    <div style="margin-bottom:12px">
      <label class="flbl">Pointed Domain (${typeLabel})</label>
      <input class="finp" id="ped-domain" value="${escH(e.domain)}" placeholder="e.g. app.example.com" autocomplete="off" />
    </div>
    <div class="fg-row" style="margin-bottom:4px">
      <div class="fg">
        <label class="flbl">🔒 SSL Certificate Expiry</label>
        <input type="date" class="finp" id="ped-ssl-expiry" value="${escH(e.sslExpiry||'')}" />
      </div>
      <div class="fg">
        <label class="flbl">🌐 Domain Expiry Date</label>
        <input type="date" class="finp" id="ped-domain-expiry" value="${escH(e.domainExpiry||'')}" />
      </div>
    </div>`;

  openModal(`${isEdit?'Edit':'Add'} ${typeLabel} Environment`, body, ()=>{
    const name=document.getElementById('ped-name')?.value.trim();
    if(!name){toast('Name is required','err');return;}
    const entry={
      id:isEdit?(existing.id||('env_'+Date.now()+'_'+Math.random().toString(36).slice(2,6))):('env_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),
      name,
      url:document.getElementById('ped-url')?.value.trim()||'',
      domain:document.getElementById('ped-domain')?.value.trim()||'',
      sslExpiry:document.getElementById('ped-ssl-expiry')?.value||'',
      domainExpiry:document.getElementById('ped-domain-expiry')?.value||''
    };
    if(!STORE[p].envDetails)STORE[p].envDetails={production:[],staging:[]};
    if(!STORE[p].envDetails[type])STORE[p].envDetails[type]=[];
    if(isEdit)STORE[p].envDetails[type][editIdx]=entry;
    else STORE[p].envDetails[type].push(entry);
    // Use _replaceArrays so server replaces envDetails entirely (not merge-by-id)
    // This guarantees the exact array the user sees is what gets saved to MongoDB
    STORE[p]._replaceArrays=['_envDetails'];
    saveToLS(p);delete STORE[p]._replaceArrays;
    closeModal();switchTab(p,'projoverview');
    toast(isEdit?'Environment updated':'Environment added');
  },{saveLabel:isEdit?'Update':'Add'});
}

function deleteEnvDetail(p,type,idx){
  const item=((STORE[p].envDetails||{})[type]||[])[idx];
  if(!item||!confirm(`Remove "${item.name}"?`))return;
  STORE[p].envDetails[type].splice(idx,1);
  // Send _replaceEnvDetails flag so server replaces envDetails object directly (not merge-by-id)
  STORE[p]._replaceArrays=['_envDetails'];
  saveToLS(p);delete STORE[p]._replaceArrays;
  switchTab(p,'projoverview');
  toast('Environment removed');
}

function renderOverview(p){
  const isMobile=isMobileProject(p);
  const plat=getPlatform(p);

  // ── per-section stats (platform-filtered for mobile) ──
  const smoke=platformRows(p,'smoke');
  const prod=platformRows(p,'prod');

  const secStats=(rows)=>({
    total:rows.length,
    pass:rows.filter(r=>r.status==='Pass').length,
    fail:rows.filter(r=>r.status==='Fail').length,
    blocked:rows.filter(r=>r.status==='Blocked').length,
    ns:rows.filter(r=>r.status==='Not Started').length,
    inp:rows.filter(r=>r.status==='In Progress').length
  });

  const ss=secStats(smoke);
  const ps=secStats(prod);
  const allFiltered=[...smoke,...prod];
  const s={total:allFiltered.length,pass:allFiltered.filter(r=>r.status==='Pass').length,fail:allFiltered.filter(r=>r.status==='Fail').length,blocked:allFiltered.filter(r=>r.status==='Blocked').length,ns:allFiltered.filter(r=>r.status==='Not Started').length,inp:allFiltered.filter(r=>r.status==='In Progress').length};
  const pct=s.total?Math.round(s.pass/s.total*100):0;
  const sPct=ss.total?Math.round(ss.pass/ss.total*100):0;
  const pPct=ps.total?Math.round(ps.pass/ps.total*100):0;

  const smokeCritFail=smoke.some(r=>r.priority==='Critical'&&(r.status==='Fail'||r.status==='Blocked'));
  const smokeOk=!smokeCritFail&&ss.total>0&&ss.pass===ss.total;
  const prodOk=ps.total>0&&ps.fail===0&&ps.blocked===0&&ps.pass===ps.total;
  const ready=!smokeCritFail&&!prodOk===false&&s.total>0&&s.pass===s.total;

  // status: pass / fail / warn / ns
  const smokeStatus=ss.total===0?'ns':smokeOk?'pass':ss.fail>0||ss.blocked>0||smokeCritFail?'fail':'warn';
  const prodStatus=ps.total===0?'ns':prodOk?'pass':ps.fail>0||ps.blocked>0?'fail':'warn';
  const overallStatus=(smokeOk&&prodOk)?'pass':s.fail>0||s.blocked>0?'fail':s.pass>0?'warn':'ns';
  const platLabel=isMobile?(plat==='android'?'Android':'iOS'):'';

  const statusLabel={pass:'✓ Pass',fail:'✗ Fail',warn:'◌ In Progress',ns:'— Not Started'};
  const statusColor={pass:'var(--pass)',fail:'var(--fail)',warn:'var(--blk)',ns:'var(--ns)'};
  const statusBg={
    pass:'rgba(16,185,129,.1)',fail:'rgba(239,68,68,.08)',
    warn:'rgba(245,158,11,.08)',ns:'rgba(148,163,184,.08)'
  };
  const statusBorder={
    pass:'rgba(16,185,129,.3)',fail:'rgba(239,68,68,.25)',
    warn:'rgba(245,158,11,.25)',ns:'rgba(148,163,184,.2)'
  };

  const pill=(status)=>`<span style="display:inline-flex;align-items:center;padding:3px 12px;border-radius:50px;font-size:12px;font-weight:700;background:${statusBg[status]};color:${statusColor[status]};border:1px solid ${statusBorder[status]}">${statusLabel[status]}</span>`;

  const miniBar=(val,total,color)=>{
    const w=total?Math.round(val/total*100):0;
    return`<div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${w}%;background:${color};border-radius:3px;transition:width .4s"></div></div>`;
  };

  const statBox=(v,label,color)=>`<div class="tr-stat-box"><div class="tr-stat-val" style="color:${color}">${v}</div><div class="tr-stat-lbl">${label}</div></div>`;

        ${statBox(rows.pass,'Pass','var(--pass)')}
        ${statBox(rows.fail,'Fail',rows.fail>0?'var(--fail)':'var(--ns)')}
        ${statBox(rows.blocked,'Blocked',rows.blocked>0?'var(--blk)':'var(--ns)')}
        ${statBox(rows.ns,'Not Started','var(--ns)')}
        ${statBox(rows.inp,'In Progress','var(--inp)')}
      </div>
      <div style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--mut);margin-bottom:4px">
          <span>Pass Rate</span><span style="color:var(--txt);font-weight:800">${pct2}%</span>
        </div>
        <div style="height:7px;background:var(--border);border-radius:4px;overflow:hidden;display:flex">
          <div style="height:100%;width:${rows.total?Math.round(rows.pass/rows.total*100):0}%;background:var(--pass);transition:width .5s"></div>
          <div style="height:100%;width:${rows.total?Math.round(rows.fail/rows.total*100):0}%;background:var(--fail);transition:width .5s"></div>
          <div style="height:100%;width:${rows.total?Math.round(rows.blocked/rows.total*100):0}%;background:var(--blk);transition:width .5s"></div>
        </div>
        <div style="display:flex;gap:12px;margin-top:5px">
          <span style="font-size:10px;color:var(--mut);display:flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--pass);display:inline-block"></span>Pass</span>
          <span style="font-size:10px;color:var(--mut);display:flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--fail);display:inline-block"></span>Fail</span>
          <span style="font-size:10px;color:var(--mut);display:flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--blk);display:inline-block"></span>Blocked</span>
        </div>
      </div>
      <div class="tr-section-footer">View details →</div>
    </div>`;

  // overall banner
  const overallBanner=`
    <div class="tr-overall-banner tr-overall-${overallStatus}">

        ${isMobile?platformSwitcher(p,'overview'):''}
        <div class="tr-overall-label" style="margin-top:${isMobile?'10px':'0'}">${overallStatus==='pass'?'🟢 Release Ready':overallStatus==='fail'?'🔴 Not Ready':overallStatus==='warn'?'🟡 In Progress':'⚪ Not Started'}</div>
        <div class="tr-overall-pct">${pct}<span style="font-size:18px;font-weight:600;opacity:.6">%</span></div>
        <div class="tr-overall-sub">${s.pass} of ${s.total}${isMobile?` ${platLabel}`:''} tests passed</div>
      </div>
      <div class="tr-overall-right">
        <div class="tr-overall-stats">
          ${statBox(s.total,'Total','var(--txt)')}
          ${statBox(s.pass,'Pass','var(--pass)')}
          ${statBox(s.fail,'Fail',s.fail>0?'var(--fail)':'var(--ns)')}
          ${statBox(s.blocked,'Blocked',s.blocked>0?'var(--blk)':'var(--ns)')}
          ${statBox(s.ns,'Not Started','var(--ns)')}
        </div>
        <div style="margin-top:12px">
          <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex">
            <div style="height:100%;width:${s.total?Math.round(s.pass/s.total*100):0}%;background:var(--pass);transition:width .5s"></div>
            <div style="height:100%;width:${s.total?Math.round(s.fail/s.total*100):0}%;background:var(--fail);transition:width .5s"></div>
            <div style="height:100%;width:${s.total?Math.round(s.blocked/s.total*100):0}%;background:var(--blk);transition:width .5s"></div>
          </div>
        </div>
      </div>
    </div>`;

  return`<div class="tr-wrap">
    ${overallBanner}
    <div class="tr-sections-grid">
      ${sectionCard(isMobile?`Smoke Tests — ${platLabel}`:'Smoke Tests','🔥',ss,smokeStatus,sPct,'smoke')}
      ${sectionCard(isMobile?`Prod Checklist — ${platLabel}`:'Prod Checklist','✅',ps,prodStatus,pPct,'prod')}
    </div>
    <div class="tr-details-grid">
      <div class="card"><div class="card-hdr"><span class="card-title">Environment Details</span>${isAdmin()?`<button class="btn-icon" onclick="openEnvModal('${p}')">✏ Edit</button>`:''}</div>${envTableHtml(p)}</div>
      <div class="card"><div class="card-hdr"><span class="card-title">Release Gate Criteria</span>${isAdmin()?`<button class="btn-icon" onclick="openAddGate('${p}')">＋ Add</button>`:''}</div>${gatesHtml(p)}</div>
    </div>
  </div>`;
}

// ══ CLIENT FEEDBACK ══
let _fbSubtab={};  // per-project: 'all'|'req'|'bug'
let _fbSearch={};

function renderFeedback(p){
  const all=(STORE[p].feedback||[]).slice().reverse();
  const sub=_fbSubtab[p]||'all';
  const q=(_fbSearch[p]||'').toLowerCase();
  const reqs=all.filter(f=>f.type==='req');
  const bugs=all.filter(f=>f.type==='bug');
  const view=sub==='req'?reqs:sub==='bug'?bugs:all;
  const filtered=q?view.filter(f=>(f.title+f.clientName+f.description+f.status).toLowerCase().includes(q)):view;

  // summary stats — active = open + inprogress + clarification + deferred
  const _activeStatuses=['open','inprogress','clarification','deferred'];
  const _doneStatuses2=['resolved','closed','wontfix'];
  const open=all.filter(f=>_activeStatuses.includes(f.status)).length;
  const inp=0; // merged into open above
  const res=all.filter(f=>_doneStatuses2.includes(f.status)).length;
  const crit=all.filter(f=>f.priority==='critical').length;

  const statsHtml=`<div class="fb-stats">
    <div class="fb-stat"><div class="fb-stat-num" style="color:var(--inp)">${all.length}</div><div class="fb-stat-label">Total</div></div>
    <div class="fb-stat"><div class="fb-stat-num" style="color:var(--blk)">${open+inp}</div><div class="fb-stat-label">Open / In Progress</div></div>
    <div class="fb-stat"><div class="fb-stat-num" style="color:var(--pass)">${res}</div><div class="fb-stat-label">Resolved</div></div>
    <div class="fb-stat"><div class="fb-stat-num" style="color:var(--fail)">${crit}</div><div class="fb-stat-label">Critical</div></div>
  </div>`;

  const subtabsHtml=`<div class="fb-subtabs">
    <button class="fb-subtab ${sub==='all'?'active':''}" onclick="_fbSubtab['${p}']='all';renderProject('${p}')">All<span class="fb-sub-cnt">${all.length}</span></button>
    <button class="fb-subtab ${sub==='req'?'active':''}" onclick="_fbSubtab['${p}']='req';renderProject('${p}')">📋 Requirements<span class="fb-sub-cnt">${reqs.length}</span></button>
    <button class="fb-subtab ${sub==='bug'?'active':''}" onclick="_fbSubtab['${p}']='bug';renderProject('${p}')">🐛 Bugs<span class="fb-sub-cnt bug-cnt">${bugs.length}</span></button>
  </div>`;

  const toolbarHtml=`<div class="fb-toolbar">
    <div class="fb-toolbar-left">
      <button class="fb-btn-new" onclick="openFeedbackModal('${p}','req')">＋ New Requirement</button>
      <button class="fb-btn-new fb-btn-bug" onclick="openFeedbackModal('${p}','bug')">🐛 Report Bug</button>
    </div>
    <input class="fb-search" placeholder="🔍 Search feedback..." value="${escH(_fbSearch[p]||'')}"
      oninput="_fbSearch['${p}']=this.value;renderProject('${p}')" />
  </div>`;

  const cardsHtml=filtered.length?filtered.map((f,i)=>feedbackCardHtml(p,f)).join('')
    :`<div class="fb-empty"><div class="fb-empty-icon">${sub==='bug'?'🐛':'💬'}</div><div>${q?'No results for "'+escH(q)+'"':sub==='req'?'No requirements logged yet.':sub==='bug'?'No bugs reported yet.':'No feedback yet.'}</div></div>`;

  return`${statsHtml}${subtabsHtml}${toolbarHtml}<div class="fb-list">${cardsHtml}</div>`;
}

function feedbackCardHtml(p,f){
  const idx=(STORE[p].feedback||[]).indexOf(f)<0?
    (STORE[p].feedback||[]).findIndex(x=>x.id===f.id):
    (STORE[p].feedback||[]).findIndex(x=>x.id===f.id);
  const statuses=['open','inprogress','clarification','resolved','closed','wontfix','deferred'];
  const statusLabels={open:'Open',inprogress:'In Progress',clarification:'Clarification Required',resolved:'Resolved',closed:'Closed',wontfix:"Won't Fix",deferred:'Deferred'};
  const priorityLabel={low:'Low',medium:'Medium',high:'High',critical:'🔴 Critical'};
  const statusOpts=statuses.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${statusLabels[s]}</option>`).join('');

  // Render description as bullet points — split by newlines or numbered lines
  const descHtml=(()=>{
    if(!f.description)return'';
    const lines=f.description.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length<=1)return`<div class="fb-desc">${escH(f.description)}</div>`;
    return`<ul class="fb-desc-list">${lines.map(l=>`<li>${escH(l.replace(/^[\d]+[.)]\s*/,''))}</li>`).join('')}</ul>`;
  })();

  return`<div class="fb-card">
    <div class="fb-card-head">
      <span class="fb-type-badge ${f.type}">${f.type==='req'?'📋 Requirement':'🐛 Bug'}</span>
      <span class="fb-priority-badge ${f.priority}">${priorityLabel[f.priority]||f.priority}</span>
      <span class="fb-title">${escH(f.title)}</span>
      <div class="fb-actions">
        ${isAdmin()?`<button class="btn-icon" onclick="openFeedbackModal('${p}','${f.type}','${f.id}')" title="Edit">✏</button>`:''}
        ${isAdmin()?`<button class="btn-icon del" onclick="deleteFeedback('${p}','${f.id}')" title="Delete">✕</button>`:''}
      </div>
    </div>
    <div class="fb-meta">
      ${f.clientName?`<span class="fb-chip"><span class="fb-chip-key">Client</span>&nbsp;<span class="fb-chip-val">${escH(f.clientName)}</span></span>`:''}
      ${f.reportedBy?`<span class="fb-chip"><span class="fb-chip-key">Reported by</span>&nbsp;<span class="fb-chip-val">${escH(f.reportedBy)}</span></span>`:''}
      ${f.assignedTo?`<span class="fb-chip"><span class="fb-chip-key">Assigned</span>&nbsp;<span class="fb-chip-val">${escH(f.assignedTo)}</span></span>`:''}
      ${f.reportedAt?`<span class="fb-chip">📅 ${escH(fmtDate(f.reportedAt))}</span>`:''}
      ${f.dueDate?`<span class="fb-chip">⏳ Due ${escH(fmtDate(f.dueDate))}</span>`:''}
      ${f.affectedVersion?`<span class="fb-chip"><span class="fb-chip-key">Version</span>&nbsp;<span class="fb-chip-val">${escH(f.affectedVersion)}</span></span>`:''}
      ${isAdmin()?`<select class="fb-status-badge ${f.status}" title="Change status"
        onchange="changeFbStatus('${p}','${f.id}',this.value)">${statusOpts}</select>`
        :`<span class="fb-status-badge ${f.status}">${statusLabels[f.status]||f.status}</span>`}
    </div>
    ${descHtml}
    ${f.stepsToRepro&&f.type==='bug'?`<div class="fb-desc" style="font-size:12px;background:var(--card2);border-radius:8px;padding:8px 12px;border:1px solid var(--border)"><b>Steps to reproduce:</b><br>${escH(f.stepsToRepro).replace(/\n/g,'<br>')}</div>`:''}
    ${f.comments?`<div class="fb-comment-box"><div class="fb-comment-lbl">💬 Comments</div><div class="fb-comment-txt">${escH(f.comments)}</div></div>`:''}
    <div class="fb-footer">
      <span>🆔 ${f.id.slice(-6).toUpperCase()}</span>
      <span class="fb-footer-sep">·</span>
      <span>Added ${escH(fmtDate(f.createdAt))}</span>
      ${f.resolvedAt?`<span class="fb-footer-sep">·</span><span style="color:var(--pass)">✓ Resolved ${escH(fmtDate(f.resolvedAt))}</span>`:''}
      ${f.comments?`<span class="fb-footer-sep">·</span><span style="color:var(--mut)">💬 Has comments</span>`:''}
    </div>
  </div>`;
}

function fmtDate(iso){
  if(!iso)return'—';
  try{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return iso;}
}

function changeFbStatus(p,id,status){
  const f=(STORE[p].feedback||[]).find(x=>x.id===id);
  if(!f)return;
  const oldStatus=f.status;
  f.status=status;
  if(status==='resolved'||status==='closed')f.resolvedAt=f.resolvedAt||new Date().toISOString();
  else if(status!=='resolved'&&status!=='closed')f.resolvedAt=null;
  saveToLS(p);renderProject(p);toast('Status updated');
  // Send notification on inline status change
  const projName=PROJECTS.find(x=>x.id===p)?.name||p;
  const fbType=f.type==='bug'?'feedback_bug':'feedback_req';
  const statusLabels={open:'Open',inprogress:'In Progress',clarification:'Clarification Required',resolved:'Resolved',closed:'Closed',wontfix:"Won't Fix",deferred:'Deferred'};
  notifyAssignment(fbType,[
    {label:'Action',value:'🔄 Status Updated'},
    {label:'Project',value:projName},
    {label:'Type',value:f.type==='bug'?'🐛 Bug':'📋 Requirement'},
    {label:'Title',value:f.title},
    {label:'Previous Status',value:statusLabels[oldStatus]||oldStatus},
    {label:'New Status',value:statusLabels[status]||status},
    {label:'Assigned To',value:f.assignedTo||'—'},
    {label:'Client / Source',value:f.clientName||'—'},
    {label:'Reported By',value:f.reportedBy||'—'},
  ],{projectId:p,assignedBy:_session?.name||f.reportedBy||'Dashboard',assignedTo:f.assignedTo||'',projectName:projName});
}

function deleteFeedback(p,id){
  if(!confirm('Delete this feedback item?'))return;
  STORE[p].feedback=(STORE[p].feedback||[]).filter(f=>f.id!==id);
  STORE[p]._replaceArrays=['feedback'];
  saveToLS(p);delete STORE[p]._replaceArrays;
  renderProject(p);toast('Deleted');
}

// ══ TEST TABLE (with inline stats) ══
function calcSectionStats(p,sec){
  const data=(STORE[p][sec]||[]).filter(r=>!r._pending);
  return{total:data.length,pass:data.filter(r=>r.status==='Pass').length,fail:data.filter(r=>r.status==='Fail').length,blocked:data.filter(r=>r.status==='Blocked').length,ns:data.filter(r=>r.status==='Not Started').length,inp:data.filter(r=>r.status==='In Progress').length};
}
function _sortById(arr){
  // Natural ascending sort: SMK-01 < SMK-02 < SMK-10 < PRD-01 etc.
  return [...arr].sort((a,b)=>{
    const pa=String(a.id||'').match(/^([A-Za-z_-]*)(\d*)$/)||[];
    const pb=String(b.id||'').match(/^([A-Za-z_-]*)(\d*)$/)||[];
    const pre=String(pa[1]||'').localeCompare(String(pb[1]||''));
    if(pre!==0)return pre;
    return(parseInt(pa[2]||'0',10))-(parseInt(pb[2]||'0',10));
  });
}
function renderTestTable(p,sec){
  const isMobile=isMobileProject(p);
  const plat=getPlatform(p);
  const allData=STORE[p][sec]||[];
  const unsorted=isMobile?allData.filter(r=>!r._pending&&(!r.platform||r.platform===plat)):allData;
  const data=_sortById(unsorted);
  const isSm=sec==='smoke';
  const s={total:data.length,pass:data.filter(r=>r.status==='Pass').length,fail:data.filter(r=>r.status==='Fail').length,blocked:data.filter(r=>r.status==='Blocked').length,ns:data.filter(r=>r.status==='Not Started').length,inp:data.filter(r=>r.status==='In Progress').length};
  const pct=s.total?Math.round(s.pass/s.total*100):0;
  let bannerCls,bannerTxt;
  if(s.fail>0){bannerCls='fail';bannerTxt=`✗ ${s.fail} test${s.fail!==1?'s':''} failed — review required`;}
  else if(s.blocked>0){bannerCls='blk';bannerTxt=`⊘ ${s.blocked} test${s.blocked!==1?'s':''} blocked — action needed`;}
  else if(s.ns>0||s.inp>0){bannerCls='prog';bannerTxt=`◌ Testing in progress — ${pct}% complete`;}
  else{bannerCls='pass';bannerTxt='✓ All tests passing — ready to proceed';}
  const pend=(STORE[p].pending||[]).filter(x=>x.section===sec&&x.status==='pending');
  const pendBanner=isAdmin()&&pend.length?`<div style="background:rgba(245,158,11,.07);border:1.5px solid rgba(245,158,11,.3);border-radius:12px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--blk)"><span>🔔 <b>${pend.length}</b> change${pend.length!==1?'s':''} awaiting approval</span><button class="btn btn-secondary" style="font-size:11px;padding:4px 13px" onclick="switchTab('${p}','approvals')">Review →</button></div>`:'';
  // Use the STORE index (not the sorted visual index) so edit/delete/status handlers
  // always operate on the correct row even when the list is sorted by ID.

  const rows=data.map(r=>rowHtml(p,sec,r,storeArr.indexOf(r),isSm)).join('');

  return`${platHeader}${pendBanner}
  <div class="sbanner ${bannerCls}">
    <span>${bannerTxt}</span>
    <div class="sbar-wrap"><div class="sbar"><div class="sbar-fill" style="width:${pct}%"></div></div></div>
    <span class="sbar-pct">${pct}%</span>
  </div>
  <div class="stats-grid">
    <div class="sc t"><div class="sl">Total</div><div class="sv" id="${p}-${sec}-total">${s.total}</div></div>
    <div class="sc p"><div class="sl">Pass</div><div class="sv" id="${p}-${sec}-pass">${s.pass}</div></div>
    <div class="sc f"><div class="sl">Fail</div><div class="sv" id="${p}-${sec}-fail">${s.fail}</div></div>
    <div class="sc b"><div class="sl">Blocked</div><div class="sv" id="${p}-${sec}-blocked">${s.blocked}</div></div>
    <div class="sc n"><div class="sl">Not Started</div><div class="sv" id="${p}-${sec}-ns">${s.ns}</div></div>
    <div class="sc pc"><div class="sl">Pass %</div><div class="sv" id="${p}-${sec}-pct">${pct}%</div></div>
  </div>
  <div class="fbar">
    ${['all','Pass','Fail','Blocked','Not Started','In Progress'].map((f,i)=>`<button class="fb${i===0?' active':''}" data-f="${f}" onclick="applyFlt('${p}','${sec}','${f}',this)">${f==='all'?`All ${s.total}`:f+' '+data.filter(r=>r.status===f).length}</button>`).join('')}

  </div>

    <thead><tr>

      <th>NOTES</th><th>ACTIONS</th>
    </tr></thead>
    <tbody id="${p}-${sec}-body">${rows}</tbody>

}

  const _suiteKey=isSm?'smoke':'prod';
  return`<tr data-idx="${i}" data-status="${r.status}" data-case-id="${r.id||''}" data-product="${p}" data-suite="${_suiteKey}" class="${isPend?'prow':''}">

}

      const total=s.total||0;
      const passClr=pct>=80?'#059669':pct>=50?'#d97706':'#dc2626';
      return`<div class="rep-card" style="border-left:4px solid #7c3aed">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px">
          <div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
              <span style="font-size:11px;font-weight:800;color:#7c3aed;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.25);padding:2px 8px;border-radius:8px">✔ CHECKLIST</span>

            <div style="font-size:11px;color:var(--mut)">🕐 ${rep.datetime} &nbsp;·&nbsp; ${total} item${total!==1?'s':''}</div>
          </div>
          ${isAdmin()?`<button class="btn-icon del" onclick="deleteReport('${p}',${idx})" title="Delete">✕</button>`:''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
          <span class="rcs p">✓ ${s.pass||0} Pass</span>
          ${(s.fail||0)?`<span class="rcs f">✗ ${s.fail} Fail</span>`:''}
          ${(s.pending||0)?`<span class="rcs b">⏳ ${s.pending} Pending</span>`:''}
          ${(s.na||0)?`<span class="rcs n">— ${s.na} N/A</span>`:''}
        </div>
        ${(s.high||s.medium||s.low)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
          ${s.high?`<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.25)">H:${s.high}</span>`:''}
          ${s.medium?`<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.25)">M:${s.medium}</span>`:''}
          ${s.low?`<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.25)">L:${s.low}</span>`:''}
        </div>`:''}
        <div class="rc-pbar" style="margin-bottom:8px"><div class="rc-pb-f" style="width:${pct}%;background:linear-gradient(90deg,#7c3aed,#5b21b6)"></div></div>
        <div style="font-size:11px;font-weight:700;margin-bottom:12px;color:${passClr}">${pct}% Pass Rate</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            ${platforms.length>1
              ?`<button class="btn btn-primary" style="font-size:11px;padding:5px 13px" onclick="downloadChecklistReport('${p}',${idx},'ALL')">⬇ All</button>${platforms.map(pl=>`<button class="btn btn-secondary" style="font-size:11px;padding:5px 11px" onclick="downloadChecklistReport('${p}',${idx},'${pl}')">${pl}</button>`).join('')}`
              :`<button class="btn btn-primary" style="font-size:11px;padding:5px 13px" onclick="downloadChecklistReport('${p}',${idx},'ALL')">⬇ Download</button>`}
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <button class="btn btn-secondary" style="font-size:11px;padding:5px 11px" onclick="previewChecklistReport('${p}',${idx},'ALL')">👁 Preview</button>
            ${isAdmin()?`<button class="btn btn-secondary" style="font-size:11px;padding:5px 11px" onclick="restoreChecklistReport('${p}',${idx})">↩ Restore</button>`:''}
          </div>
        </div>
      </div>`;
    }

    // ── Legacy smoke/prod report ──
    const s=rep.summary||{};const pct=s.total?Math.round(s.pass/s.total*100):0;
    const ready=s.fail===0&&s.blocked===0&&pct===100;
    return`<div class="rep-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div><div style="font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--grad-a) 0%,var(--grad-b) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${escH(proj?.name||p)}${rep.label?` — ${rep.label}`:''}</div>
        <div style="font-size:11px;color:var(--mut)">🕐 ${rep.datetime}</div></div>
        ${isAdmin()?`<button class="btn-icon del" onclick="deleteReport('${p}',${idx})">✕</button>`:''}
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin:9px 0">
        <span class="rcs p">✓ ${s.pass||0}</span>${s.fail?`<span class="rcs f">✗ ${s.fail}</span>`:''}${s.blocked?`<span class="rcs b">⊘ ${s.blocked}</span>`:''}<span class="rcs n">◌ ${s.ns||0}</span>
      </div>
      <div class="rc-pbar"><div class="rc-pb-f" style="width:${pct}%"></div></div>
      <div style="font-size:11px;font-weight:700;margin-bottom:12px;color:${ready?'var(--pass)':'var(--fail)'}">${ready?'🟢 Release Ready':'🔴 Not Ready'} — ${pct}%</div>
      <div class="acell">
        <button class="btn btn-primary" style="font-size:11px;padding:6px 16px" onclick="downloadSavedReport('${p}',${idx})">⬇ Download</button>
        <button class="btn btn-secondary" style="font-size:11px;padding:6px 14px" onclick="previewSavedReport('${p}',${idx})">👁 Preview</button>
      </div>
    </div>`;
  }).join('');

  const checklistCount=reps.filter(r=>r.type==='checklist').length;
  const smokeCount=reps.length-checklistCount;
  const typeInfo=checklistCount&&smokeCount?` (${checklistCount} checklist, ${smokeCount} test)`:checklistCount?` (checklist)`:'';
  return`<div class="sec-hdr"><h3>💾 Saved Reports</h3><span style="font-size:12px;color:var(--mut);background:rgba(0,212,255,.1);padding:3px 10px;border-radius:50px;border:1px solid rgba(0,212,255,.2)">${reps.length} saved${typeInfo}</span></div><div class="rep-grid">${cards}</div>`;
}

// ══ API TESTS ══
const API_METHODS=['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'];
let _apiExpanded={};

function renderApiTests(p){
  const apis=STORE[p].apitests||[];
  const pass=apis.filter(a=>a.lastStatus==='pass').length;
  const fail=apis.filter(a=>a.lastStatus==='fail').length;
  const ns=apis.filter(a=>!a.lastStatus).length;
  const statsHtml=`<div class="api-stats-row">
    <span class="api-stat-chip api-stat-pass">✓ ${pass} Pass</span>
    <span class="api-stat-chip api-stat-fail">✗ ${fail} Fail</span>
    <span class="api-stat-chip api-stat-ns">— ${ns} Not Run</span>
    <span style="margin-left:auto;font-size:12px;color:var(--mut);font-weight:600">${apis.length} API${apis.length!==1?'s':''} total</span>
  </div>`;

  const listHtml=apis.length===0?`<div class="api-empty">
    <div class="api-empty-icon">🌐</div>
    <div class="api-empty-text">No API tests yet</div>
    <div class="api-empty-sub">Click "＋ Add API" to create your first API test</div>
  </div>`:apis.map((api,i)=>{
    const isOpen=_apiExpanded[p+':'+i];
    const mCls=api.method||'GET';
    const stCls=api.lastStatus==='pass'?'pass':api.lastStatus==='fail'?'fail':api.lastRunning?'running':'ns';
    const stTxt=api.lastStatus==='pass'?`✓ ${api.lastCode}`:api.lastStatus==='fail'?`✗ ${api.lastCode||'Error'}`:api.lastRunning?'⟳ Running':'Not Run';
    const resHtml=api.lastStatus?`<div class="api-response-status">
      <span class="api-res-code ${api.lastCode>=200&&api.lastCode<300?'ok':api.lastCode>=300&&api.lastCode<400?'redir':api.lastCode?'err':'timeout'}">${api.lastCode||'—'}</span>
      ${api.lastTime?`<span class="api-res-time">⏱ ${api.lastTime}ms</span>`:''}
      ${api.lastStatus==='pass'?`<span style="color:var(--pass);font-size:11px;font-weight:700">● Pass</span>`:`<span style="color:var(--fail);font-size:11px;font-weight:700">● Fail</span>`}
    </div>
    <div class="api-response-wrap" id="api-res-${p}-${i}">${api.lastResponse?escH(api.lastResponse.slice(0,3000))+(api.lastResponse.length>3000?'\n\n[truncated...]':''):'No response'}</div>`:`<div style="color:var(--mut);font-size:12px;padding:8px 0">Not yet run. Click ▶ Run to execute.</div>`;
    const headersDisplay=api.headers&&api.headers.length?api.headers.filter(h=>h.k).map(h=>`<div style="font-size:11px;font-family:monospace;color:var(--txt2);padding:2px 0"><span style="color:var(--mut)">${escH(h.k)}:</span> ${escH(h.v)}</div>`).join(''):'<span style="font-size:11px;color:var(--mut)">None</span>';
    const bodyDisplay=api.body?`<div class="api-response-wrap" style="max-height:100px">${escH(api.body)}</div>`:'<span style="font-size:11px;color:var(--mut)">None</span>';
    return`<div class="api-card" id="api-card-${p}-${i}">
      <div class="api-card-head" onclick="apiToggleExpand('${p}',${i})">
        <div class="api-card-left">
          <span class="api-method ${mCls}">${mCls}</span>
          <div style="min-width:0">
            <div class="api-name">${escH(api.name||'Unnamed API')}</div>
            <div class="api-url">${escH(api.url||'—')}</div>
          </div>
        </div>
        <div class="api-card-actions" onclick="event.stopPropagation()">
          <span class="api-status-badge ${stCls}">${stTxt}</span>
          <button class="api-run-btn" id="api-run-btn-${p}-${i}" onclick="apiRun('${p}',${i})" ${api.lastRunning?'disabled':''}>
            ${api.lastRunning?`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>Running`:`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>Run`}
          </button>
          ${isAdmin()?`<button class="api-edit-btn" onclick="apiOpenEdit('${p}',${i})">✏ Edit</button>
          <button class="api-del-btn" onclick="apiDelete('${p}',${i})">✕</button>`:''}
        </div>
        <span class="api-expand ${isOpen?'open':''}">▼</span>
      </div>
      <div class="api-card-body ${isOpen?'open':''}" id="api-body-${p}-${i}">
        <div class="api-detail-grid">
          <div class="api-detail-item"><div class="api-detail-label">Auth / Headers</div><div class="api-detail-val">${headersDisplay}</div></div>
          <div class="api-detail-item"><div class="api-detail-label">Request Body</div><div class="api-detail-val">${bodyDisplay}</div></div>
        </div>
        <div style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">Last Response</div>
        ${resHtml}
      </div>
    </div>`;
  }).join('');

  return`<div class="api-wrap">
    <div class="api-toolbar">
      <div class="api-toolbar-left">
        <h3 style="font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">🌐 API Tests</h3>
        <span style="font-size:12px;color:var(--mut);background:var(--card2);border:1px solid var(--border);border-radius:50px;padding:2px 10px;font-weight:600">${apis.length} endpoint${apis.length!==1?'s':''}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${apis.length>0?`<button class="api-run-all-btn" id="api-run-all-btn-${p}" onclick="apiRunAll('${p}')">▶ Run All</button>`:''}
        ${isAdmin()?`<button class="api-add-btn" onclick="apiOpenAdd('${p}')">＋ Add API</button>`:''}
      </div>
    </div>
    ${apis.length>0?statsHtml:''}
    <div class="api-list">${listHtml}</div>
  </div>`;
}

function apiToggleExpand(p,i){
  const key=p+':'+i;
  _apiExpanded[key]=!_apiExpanded[key];
  const body=document.getElementById(`api-body-${p}-${i}`);
  const arr=document.querySelector(`#api-card-${p}-${i} .api-expand`);
  if(body){body.classList.toggle('open',_apiExpanded[key]);}
  if(arr){arr.classList.toggle('open',_apiExpanded[key]);}
}

function apiBuildModalBody(api){
  const methods=API_METHODS.map(m=>`<option value="${m}" ${(api?.method||'GET')===m?'selected':''}>${m}</option>`).join('');
  const headers=(api?.headers||[{k:'',v:''}]);
  const headersHtml=headers.map((h,i)=>`<div class="api-kv-row" id="api-hdr-row-${i}">
    <input placeholder="Key (e.g. Authorization)" value="${escH(h.k)}" id="api-hk-${i}">
    <input placeholder="Value (e.g. Bearer token)" value="${escH(h.v)}" id="api-hv-${i}">
    <button class="api-kv-rm" onclick="apiRemoveHeader(${i})">×</button>
  </div>`).join('');
  return`<div class="fg-row">
    <div class="fg" style="flex:2"><label class="flbl">API Name *</label><input class="finp" id="api-name" value="${escH(api?.name||'')}" placeholder="e.g. Get User Profile" autocomplete="off"></div>
    <div class="fg"><label class="flbl">Method</label><select class="finp" id="api-method">${methods}</select></div>
  </div>
  <div class="fg"><label class="flbl">URL *</label><input class="finp" id="api-url" value="${escH(api?.url||'')}" placeholder="https://api.example.com/endpoint" autocomplete="off"></div>
  <div class="api-req-section">
    <div class="api-req-lbl">Headers / Authorization</div>
    <div id="api-headers-list">${headersHtml}</div>
    <button class="api-kv-add" onclick="apiAddHeader()">＋ Add Header</button>
  </div>
  <div class="fg"><label class="flbl">Request Body (JSON / raw)</label><textarea class="finp" id="api-body" rows="4" placeholder='{"key":"value"}'>${escH(api?.body||'')}</textarea></div>`;
}
let _apiHdrCount=0;
function apiAddHeader(){
  const list=document.getElementById('api-headers-list');if(!list)return;
  const i=++_apiHdrCount+100;
  const div=document.createElement('div');div.className='api-kv-row';div.id=`api-hdr-row-${i}`;
  div.innerHTML=`<input placeholder="Key" id="api-hk-${i}"><input placeholder="Value" id="api-hv-${i}"><button class="api-kv-rm" onclick="apiRemoveHeader(${i})">×</button>`;
  list.appendChild(div);
}
function apiRemoveHeader(i){const r=document.getElementById(`api-hdr-row-${i}`);if(r)r.remove();}
function apiCollectHeaders(){
  const rows=[...document.querySelectorAll('[id^="api-hdr-row-"]')];
  return rows.map(r=>{
    const i=r.id.replace('api-hdr-row-','');
    return{k:(document.getElementById(`api-hk-${i}`)?.value||'').trim(),v:(document.getElementById(`api-hv-${i}`)?.value||'').trim()};
  }).filter(h=>h.k);
}
function apiSaveEntry(p,editIdx){
  const name=document.getElementById('api-name')?.value.trim();
  const url=document.getElementById('api-url')?.value.trim();
  if(!name){toast('API name is required','err');return;}
  if(!url){toast('URL is required','err');return;}
  const entry={id:editIdx!=null&&(STORE[p].apitests||[])[editIdx]?.id?STORE[p].apitests[editIdx].id:('api_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)),name,url,method:document.getElementById('api-method')?.value||'GET',headers:apiCollectHeaders(),body:document.getElementById('api-body')?.value||'',lastStatus:null,lastCode:null,lastResponse:null,lastTime:null};
  if(editIdx!=null){
    // preserve last run results on edit
    const prev=(STORE[p].apitests||[])[editIdx];
    if(prev){entry.lastStatus=prev.lastStatus;entry.lastCode=prev.lastCode;entry.lastResponse=prev.lastResponse;entry.lastTime=prev.lastTime;}
    STORE[p].apitests[editIdx]=entry;
  }else{
    if(!STORE[p].apitests)STORE[p].apitests=[];
    STORE[p].apitests.push(entry);
  }
  saveToLS(p);closeModal();switchTab(p,'apitests');
  toast(editIdx!=null?'API updated':'API added');
}
function apiOpenAdd(p){
  _apiHdrCount=0;
  openModal('Add API Test',apiBuildModalBody(null),()=>apiSaveEntry(p,null));
}
function apiOpenEdit(p,i){
  _apiHdrCount=0;
  const api=(STORE[p].apitests||[])[i];if(!api)return;
  openModal('Edit API Test',apiBuildModalBody(api),()=>apiSaveEntry(p,i));
}
function apiDelete(p,i){
  if(!confirm('Delete this API test?'))return;
  (STORE[p].apitests||[]).splice(i,1);
  STORE[p]._replaceArrays=['apitests'];saveToLS(p);delete STORE[p]._replaceArrays;
  switchTab(p,'apitests');toast('API deleted');
}

async function apiRun(p,i){
  const api=(STORE[p].apitests||[])[i];if(!api)return;
  api.lastRunning=true;
  const btn=document.getElementById(`api-run-btn-${p}-${i}`);
  if(btn){btn.disabled=true;btn.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg> Running`;}
  _apiExpanded[p+':'+i]=true;
  try{
    const hdrs={};
    (api.headers||[]).forEach(h=>{if(h.k)hdrs[h.k]=h.v;});
    const hasBody=api.method&&!['GET','HEAD','OPTIONS'].includes(api.method)&&api.body;
    // Route through server-side proxy to avoid CORS restrictions
    const proxyResp=await fetch('/api/qa-proxy',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},
      body:JSON.stringify({url:api.url,method:api.method||'GET',headers:hdrs,body:hasBody?api.body:undefined})
    });
    const data=await proxyResp.json();
    api.lastStatus=data.statusCode&&data.statusCode>=200&&data.statusCode<400?'pass':'fail';
    api.lastCode=data.statusCode;
    api.lastResponse=data.body||'(empty response)';
    api.lastTime=data.elapsed;
  }catch(err){
    api.lastStatus='fail';
    api.lastCode=null;
    api.lastResponse=`Error: ${err.message}`;
    api.lastTime=null;
  }
  api.lastRunning=false;
  saveToLS(p);
  switchTab(p,'apitests');
  toast(api.lastStatus==='pass'?`✓ ${api.lastCode} — Pass`:`✗ ${api.lastCode||'Error'} — Fail`,api.lastStatus==='pass'?'ok':'err');
}

async function apiRunAll(p){
  const apis=STORE[p].apitests||[];
  if(!apis.length)return;
  const btn=document.getElementById(`api-run-all-btn-${p}`);
  if(btn){btn.disabled=true;btn.textContent='⏳ Running…';}
  // Run all in parallel
  await Promise.all(apis.map((_,i)=>apiRun(p,i)));
  if(btn){btn.disabled=false;btn.textContent='▶ Run All';}
  const pass=apis.filter(a=>a.lastStatus==='pass').length;
  const fail=apis.filter(a=>a.lastStatus==='fail').length;
  toast(`Run All complete — ✓ ${pass} passed, ✗ ${fail} failed`,fail>0?'err':'ok');
}

// ══ WORKFLOW DOCUMENTS ══
function renderWorkflowDocs(p){
  // Deduplicate by name+size before rendering — safety net for any existing duplicates in STORE
  const _rawDocs=STORE[p].wfdocs||[];
  const _seen=new Set();
  const docs=_rawDocs.filter(d=>{const k=(d.name||'')+'__'+(d.size||0);if(_seen.has(k))return false;_seen.add(k);return true;});
  const iconFor=name=>{
    const ext=(name.split('.').pop()||'').toLowerCase();
    if(ext==='pdf')return'📄';
    if(['xls','xlsx'].includes(ext))return'📊';
    if(['doc','docx'].includes(ext))return'📝';
    if(ext==='txt')return'📃';
    return'📎';
  };
  const list=docs.length?[...docs].reverse().map((d,ri)=>{
    const idx=docs.length-1-ri;
    const sizeTxt=d.size<1024?d.size+' B':d.size<1048576?(d.size/1024).toFixed(1)+' KB':(d.size/1048576).toFixed(2)+' MB';
    return`<div class="wfd-row">
      <span class="wfd-icon">${iconFor(d.name)}</span>
      <div class="wfd-info">
        <div class="wfd-name">${d.name}</div>
        <div class="wfd-meta">${sizeTxt} &nbsp;·&nbsp; Uploaded ${d.uploadedAt}</div>
      </div>
      <div class="wfd-actions">
        ${d.unavailable
          ?`<span style="font-size:11px;color:var(--fail);font-weight:600" title="File was lost in a server redeploy — please re-upload">⚠ Re-upload needed</span>`
          :`<button class="btn btn-primary" style="font-size:11px;padding:5px 14px" onclick="downloadWfDoc('${p}',${idx})">⬇ Download</button>`}
        ${isAdmin()?`<button class="btn-icon del" title="Delete" onclick="deleteWfDoc('${p}',${idx})">✕</button>`:''}
      </div>
    </div>`;
  }).join(''):`<div class="empty"><div class="ico">📁</div>No documents uploaded yet.<div style="margin-top:6px;font-size:12px">Upload PDF, Excel, Word, or TXT files.</div></div>`;

  const uploadBtn=isAdmin()?`<label class="btn btn-primary wfd-upload-lbl" title="Upload document" id="wfd-upload-lbl-${p}">
    ＋ Upload Document
    <input type="file" accept=".pdf,.xls,.xlsx,.doc,.docx,.txt" style="display:none" onchange="handleWfDocUpload('${p}',this)">
  </label>`:'';

  return`<div class="sec-hdr">
    <div style="display:flex;align-items:center;gap:10px">
      <h3>📁 Workflow Documents</h3>
      <span style="font-size:12px;color:var(--mut);background:rgba(0,212,255,.1);padding:3px 10px;border-radius:50px;border:1px solid rgba(0,212,255,.2)">${docs.length} file${docs.length!==1?'s':''}</span>
    </div>
    ${uploadBtn}
  </div>
  <div class="wfd-list">${list}</div>`;
}

function handleWfDocUpload(p,input){
  const file=input.files[0];
  if(!file)return;
  const maxMB=100;
  if(file.size>maxMB*1024*1024){alert(`File too large. Max ${maxMB} MB allowed.`);input.value='';return;}
  const lbl=document.getElementById('wfd-upload-lbl-'+p);
  if(lbl)lbl.textContent='Uploading…';
  const reader=new FileReader();
  reader.onload=async e=>{
    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const uploadedAt=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    try{
      const resp=await fetch('/api/wfdocs/'+encodeURIComponent(p),{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},
        body:JSON.stringify({name:file.name,size:file.size,data:e.target.result})
      });
      const result=await resp.json();
      if(resp.status===409){toast(result.error||'File already exists','err');if(lbl)lbl.innerHTML='＋ Upload Document<input type="file" accept=".pdf,.xls,.xlsx,.doc,.docx,.txt" style="display:none" onchange="handleWfDocUpload(\''+p+'\',this)">';return;}
      if(!resp.ok||!result.success)throw new Error(result.error||'Upload failed');
      try{
        const r=await fetch('/api/wfdocs/'+encodeURIComponent(p),{cache:'no-store',headers:{Authorization:'Bearer '+_getToken()}});
        if(r.ok){
          const files=await r.json();
          if(!STORE[p])STORE[p]={};
          STORE[p].wfdocs=files.map(sf=>({name:sf.name,size:sf.size||0,uploadedAt:sf.uploadedAt||uploadedAt,serverId:sf.fileId||sf.serverId||null}));
        }
      }catch(_){}
      toast(`"${file.name}" uploaded`,'suc');
      switchTab(p,'wfdocs');
    }catch(err){
      toast('Upload failed: '+err.message,'err');
      if(lbl){lbl.innerHTML='＋ Upload Document<input type="file" accept=".pdf,.xls,.xlsx,.doc,.docx,.txt" style="display:none" onchange="handleWfDocUpload(\''+p+'\',this)">';}
    }

}

async function downloadWfDoc(p,idx){
  const doc=(STORE[p].wfdocs||[])[idx];
  if(!doc)return;
  if(doc.serverId){
    try{
      const r=await fetch('/api/wfdocs/'+encodeURIComponent(p)+'/'+encodeURIComponent(doc.serverId),{headers:{Authorization:'Bearer '+_getToken()}});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=doc.name;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){toast('Download failed: '+e.message,'err');}
  }else if(doc.data){
    const a=document.createElement('a');a.href=doc.data;a.download=doc.name;a.click();
  }
}

async function deleteWfDoc(p,idx){
  const doc=(STORE[p].wfdocs||[])[idx];
  if(!doc)return;
  if(!confirm(`Delete "${doc.name}"?`))return;
  // Remove from server storage first (disk + GitHub Release asset)
  if(doc.serverId){
    try{
      await fetch('/api/wfdocs/'+encodeURIComponent(p)+'/'+encodeURIComponent(doc.serverId),{method:'DELETE',headers:{Authorization:'Bearer '+_getToken()}});
    }catch(e){}
  }
  // Remove from local STORE
  (STORE[p].wfdocs||[]).splice(idx,1);
  // Use _replaceArrays flag so server replaces wfdocs array directly
  // instead of merging (merge would re-add the deleted entry from cache)
  const payload={...STORE[p],_replaceArrays:['wfdocs']};
  serverPost('qa3_'+p,payload);
  // Re-sync from server to confirm deletion took effect
  setTimeout(async()=>{
    try{
      const r=await fetch('/api/wfdocs/'+encodeURIComponent(p),{cache:'no-store',headers:{Authorization:'Bearer '+_getToken()}});
      if(r.ok){
        const files=await r.json();
        STORE[p].wfdocs=files.map(sf=>({name:sf.name,size:sf.size||0,uploadedAt:sf.uploadedAt||'',serverId:sf.fileId||sf.serverId||null}));
      }
    }catch(e){}
    switchTab(p,'wfdocs');
  },600);
}

  const all=[...STORE[p].smoke,...STORE[p].prod].filter(r=>!r._pending);

  const s=calcStats(p);const critFail=STORE[p].smoke.some(r=>!r._pending&&r.priority==='Critical'&&(r.status==='Fail'||r.status==='Blocked'));
  const prodIssue=STORE[p].prod.some(r=>!r._pending&&(r.status==='Fail'||r.status==='Blocked'));
  return !critFail&&!prodIssue&&s.total>0&&s.pass===s.total;
}

let _dtTodayStr=(()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`})();

function dtCurrentMonth(){
  if(_dtMonth)return _dtMonth;

function dtMonthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function dtPrevMonth(ym){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function dtNextMonth(ym){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

// Get all Mon-Fri dates in the given month grouped by week number (1-based)
function dtGetWeeks(ym){
  const [y,m]=ym.split('-').map(Number);
  const weeks=[];
  const d=new Date(y,m-1,1);
  let weekNum=1;
  let curWeek=[];
  // find first Monday on or before day 1
  // iterate all days in month, collect Mon-Fri
  const totalDays=new Date(y,m,0).getDate();
  for(let day=1;day<=totalDays;day++){
    const date=new Date(y,m-1,day);
    const dow=date.getDay(); // 0=Sun,1=Mon..5=Fri,6=Sat
    if(dow===1&&curWeek.length>0){weekNum++;curWeek=[];} // new week starts Monday
    if(dow>=1&&dow<=5){ // Mon-Fri
      const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      if(!curWeek.length){weeks.push({weekNum,days:curWeek});}
      curWeek.push(ds);
    }
  }
  // assign week numbers properly
  const result=[];
  let wn=1,prevDow=-1;
  const allDays=[];
  for(let day=1;day<=totalDays;day++){
    const date=new Date(y,m-1,day);
    const dow=date.getDay();
    if(dow>=1&&dow<=5){
      const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      allDays.push({ds,dow,day});
    }
  }
  const weekMap={};
  let cw=1;
  let lastDow=null;
  allDays.forEach(({ds,dow})=>{
    if(lastDow!==null&&dow<=lastDow){cw++;} // dow went backwards = new week
    if(!weekMap[cw])weekMap[cw]=[];
    weekMap[cw].push(ds);
    lastDow=dow;
  });
  return Object.entries(weekMap).map(([wn,days])=>({weekNum:Number(wn),days}));
}

function dtDayInfo(dateStr){
  try{
    const [y,m,d]=dateStr.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const day=dt.toLocaleDateString('en-US',{weekday:'long'});
    const date=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return{day,date};
  }catch(e){return{day:'',date:dateStr};}
}

// Ensure all projects have a row for the given date (auto-create if missing)
let _dtEnsureSaveTimer=null;
function dtEnsureProjectRows(dateStr){
  // Only create local UI rows — do NOT auto-save to server.
  // Auto-saving empty rows wipes existing data: mergeDailyTasks sees new rows
  // with _savedAt=now as newer than old saved rows and drops the real data.
  // Rows are saved to DB only when user makes an actual edit (dtInlineChange/dtAssignedChange).
  PROJECTS.forEach(p=>{
    const exists=DAILY_TASKS.find(t=>t.date===dateStr&&t.projectId===p.id);
    const defAssignee=p.defaultAssignee||'';
    if(!exists){
      const entry={id:'dt_'+Math.random().toString(36).slice(2,10),date:dateStr,projectId:p.id,assignedBy:defAssignee};
      DT_COLS.forEach(c=>{entry[c.key]='';});
      DAILY_TASKS.push(entry);
    } else if(!exists.assignedBy&&defAssignee){
      exists.assignedBy=defAssignee;
    }
  });
}

// Auto-ensure all dates in the current month have rows for all projects
function dtEnsureMonth(ym){
  const weeks=dtGetWeeks(ym);
  weeks.forEach(({days})=>days.forEach(ds=>dtEnsureProjectRows(ds)));
}

        else if(t[c.key]==='FAIL')wFail++;

    const firstDay=dtDayInfo(days[0]);

    const daysHtml=days.map(dateStr=>{

      </div>

  document.getElementById('app').innerHTML=`
    <div class="dt-wrap" style="padding:22px 24px 40px">
      <div class="dt-header">
        <div>
          <div class="dt-title">📅 Daily Task Updates</div>
          <div class="dt-subtitle">Week-wise testing status tracker — Mon to Fri per week</div>
        </div>

        </div>

        <span class="dt-sum-chip dt-sum-pass">✓ ${totalPass} Pass</span>
        <span class="dt-sum-chip dt-sum-fail">✗ ${totalFail} Fail</span>

function dtSaveEntry(editIdx){
  const date=document.getElementById('dt-date')?.value||'';
  const projectId=document.getElementById('dt-proj')?.value||'';
  if(!date){toast('Please select a date','err');return;}
  if(!projectId){toast('Please select a project','err');return;}
  const assignedBy=document.getElementById('dt-assigned')?.value||'';
  const entry={date,projectId,assignedBy};
  DT_COLS.forEach(c=>{entry[c.key]=document.getElementById('dt-col-'+c.key)?.value||'';});
  if(editIdx!=null&&editIdx>=0){
    // Preserve existing id so server mergeDailyTasks can match this record
    entry.id=DAILY_TASKS[editIdx]?.id||('dt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));
    DAILY_TASKS[editIdx]=entry;
  } else {
    // avoid duplicate project+date combo
    const dupIdx=DAILY_TASKS.findIndex(t=>t.date===date&&t.projectId===projectId);
    if(dupIdx>=0){
      entry.id=DAILY_TASKS[dupIdx]?.id||('dt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6));
      DAILY_TASKS[dupIdx]=entry;
    } else {
      entry.id='dt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      DAILY_TASKS.push(entry);
    }
  }
  saveDailyTasks();
  closeModal();
  _dtMonth=date.slice(0,7);
  renderDailyTasksPage();
  toast(editIdx!=null?'Row updated ✓':'Row added ✓');
}

function dtOpenEdit(idx){

function dtDelete(idx){
  if(!confirm('Delete this row?'))return;

  DAILY_TASKS.splice(idx,1);

  renderDailyTasksPage();
  toast('Deleted');
}

async function notifyAssignment(type, details, extra){
  try{
    const proj=extra?.projectId?PROJECTS.find(x=>x.id===extra.projectId):null;
    const projectName=proj?.name||extra?.projectName||'';
    const body={
      type,
      assignedBy:extra?.assignedBy||'',
      assignedTo:extra?.assignedTo||'',
      projectName,
      details,
      dashboardUrl:'https://adhashprojectdashboard-production.up.railway.app/'
    };
    const r=await fetch('/api/notify-assignment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.queued||j.sent) console.log('[notify] notification queued →',j.type,j.projectName||'');
    else console.log('[notify] notification NOT sent:',j.error||j.reason||JSON.stringify(j));
  }catch(e){console.warn('[notify] email failed:',e.message);}
}

function saveTeamTasks(){
  // Safety: never overwrite server data with an empty array if the server has tasks
  const serverHasTasks=(_serverData['qa3_team_tasks']||[]).length>0;
  if(TEAM_TASKS.length===0&&serverHasTasks){console.warn('[saveTeamTasks] blocked empty-array overwrite — server has tasks');return;}
  const now=Date.now();
  TEAM_TASKS.forEach(t=>{t._savedAt=now;});
  _serverData['qa3_team_tasks']=TEAM_TASKS;
  serverPost('qa3_team_tasks',TEAM_TASKS);
}
function loadTeamTasks(){
  const sv=_serverData['qa3_team_tasks'];
  // Only replace local if server has actual data, or local is empty
  if(sv&&(sv.length>0||TEAM_TASKS.length===0))TEAM_TASKS=sv;
}

function showTeamTasks(){
  curView='teamtasks';
  const n=new Date();
  _ttMonth=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
  _ttTodayStr=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  _ttWeekOpen={};
  const weeks=ttGetWeeks(_ttMonth);
  // Find the target date: today if weekday, otherwise most recent Friday
  let targetDate=_ttTodayStr;
  const dow=n.getDay(); // 0=Sun,6=Sat
  if(dow===0||dow===6){
    const friday=new Date(n);friday.setDate(n.getDate()-(dow===0?2:1));
    targetDate=`${friday.getFullYear()}-${String(friday.getMonth()+1).padStart(2,'0')}-${String(friday.getDate()).padStart(2,'0')}`;
  }
  weeks.forEach(({weekNum,days})=>{_ttWeekOpen[weekNum]=days.includes(targetDate);});
  renderTeamTasksPage();
  // Reset to top first, then scroll to today's date section
  window.scrollTo({top:0,behavior:'instant'});
  setTimeout(()=>{
    const el=document.getElementById(`tt-day-group-${targetDate}`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  },120);
}

function ttCurrentMonth(){
  if(_ttMonth)return _ttMonth;
  const n=new Date();
  return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
}
function ttMonthLabel(ym){
  const[y,m]=ym.split('-').map(Number);

function ttNextMonth(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m,1);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}

function ttCurrStatusClass(v){
  if(!v||v==='To Do')return'status-todo';
  if(v==='In Progress')return'status-inprog';
  if(v==='Partially Done')return'status-partial';
  if(v==='Done')return'status-done';
  if(v==='Skipped')return'status-skip';
  if(v==='Hold')return'status-hold';
  return'status-todo';
}
function ttTestStatusClass(v){
  if(!v||v==='To Do')return'tstatus-todo';
  if(v==='In Progress'||v==='Retesting In Progress'||v==='Regression In Progress')return'tstatus-inprog';
  if(v==='Bugs Raised'||v==='Bugs Noted'||v==='Bugs Reported')return'tstatus-bugs';
  if(v==='Done'||v==='Retesting Done'||v==='Regression Done'||v==='Ready for Production'||v==='Ready for Client')return'tstatus-ready';
  if(v==='Waiting for Dev Build'||v==='Waiting for Prod Build')return'tstatus-wait';
  return'tstatus-todo';
}

function ttGetWeeks(ym){
  const[y,m]=ym.split('-').map(Number);
  const totalDays=new Date(y,m,0).getDate();
  const allDays=[];
  for(let day=1;day<=totalDays;day++){
    const dt=new Date(y,m-1,day);
    const dow=dt.getDay();
    if(dow>=1&&dow<=5){
      const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      allDays.push({ds,dow});
    }
  }
  const weekMap={};let cw=1,lastDow=null;
  allDays.forEach(({ds,dow})=>{
    if(lastDow!==null&&dow<=lastDow)cw++;
    if(!weekMap[cw])weekMap[cw]=[];
    weekMap[cw].push(ds);
    lastDow=dow;
  });
  return Object.entries(weekMap).map(([wn,days])=>({weekNum:Number(wn),days}));
}

function ttDayInfo(dateStr){
  try{
    const[y,m,d]=dateStr.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const day=dt.toLocaleDateString('en-US',{weekday:'long'});
    const date=dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return{day,date};
  }catch(e){return{day:'',date:dateStr};}
}

function renderTeamTasksPage(){
  const ym=ttCurrentMonth();
  const weeks=ttGetWeeks(ym);
  const monthTasks=TEAM_TASKS.filter(t=>t.date&&t.date.startsWith(ym));
  const filtered=_ttProjFilter==='all'?monthTasks:monthTasks.filter(t=>t.projectId===_ttProjFilter);
  let totDone=0,totProg=0,totTodo=0,totHold=0;
  filtered.forEach(t=>{
    const s=t.currentStatus||'To Do';
    if(s==='Done')totDone++;
    else if(s==='In Progress'||s==='Partially Done')totProg++;
    else if(s==='Hold'||s==='Skipped')totHold++;
    else totTodo++;
  });

  const projPills=`<button class="dt-pj-btn${_ttProjFilter==='all'?' active':''}" onclick="window._ttSetFilter('all')">All Projects</button>`
    +PROJECTS.map(p=>`<button class="dt-pj-btn${_ttProjFilter===p.id?' active':''}" onclick="window._ttSetFilter('${p.id}')" style="${_ttProjFilter===p.id?`background:${p.color}18;border-color:${p.color}55;color:${p.color}`:''}">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${p.color};margin-right:4px;vertical-align:middle"></span>${escH(p.name)}
      </button>`).join('');

  const weeksHtml=weeks.map(({weekNum,days})=>{
    const isOpen=_ttWeekOpen[weekNum]!==false;
    const firstDay=ttDayInfo(days[0]);
    const lastDay=ttDayInfo(days[days.length-1]);
    const weekRange=`${firstDay.date} – ${lastDay.date}`;
    let wDone=0,wProg=0;
    days.forEach(ds=>{
      TEAM_TASKS.filter(t=>t.date===ds).forEach(t=>{
        if((t.currentStatus||'')===('Done'))wDone++;
        else if((t.currentStatus||'').includes('Progress')||(t.currentStatus||'')==='Partially Done')wProg++;
      });
    });

    const daysHtml=days.map(dateStr=>{
      const{day,date}=ttDayInfo(dateStr);
      const isToday=dateStr===_ttTodayStr;
      const cnt=TEAM_TASKS.filter(t=>t.date===dateStr&&(_ttProjFilter==='all'||t.projectId===_ttProjFilter)).length;
      const tableHtml=renderTTRowTable(dateStr);
      return`<div class="tt-day-group" id="tt-day-group-${dateStr}">
        <div class="tt-day-hdr${isToday?' dt-today-hdr':''}">
          <div class="tt-day-label">${escH(day)}${isToday?` <span class="dt-today-badge">Today</span>`:''}</div>
          <div class="tt-day-date">${escH(date)}</div>
          <div class="tt-day-line"></div>
          <div class="tt-day-count">${cnt} task${cnt!==1?'s':''}</div>
          <button class="tt-day-add-btn" onclick="ttOpenAdd('${dateStr}')">＋ Add Task</button>
        </div>
        <div id="tt-daybody-${dateStr}">${tableHtml}</div>
      </div>`;
    }).join('');

    return`<div class="tt-week-block" id="tt-week-${weekNum}">
      <div class="tt-week-hdr" onclick="ttToggleWeek(${weekNum})">
        <div class="tt-week-title">Week ${weekNum}</div>
        <div class="tt-week-range">${escH(weekRange)}</div>
        <div class="tt-week-stats">
          ${wDone>0?`<span class="tt-week-stat done">✓ ${wDone} Done</span>`:''}
          ${wProg>0?`<span class="tt-week-stat prog">↻ ${wProg} In Progress</span>`:''}
        </div>
        <div class="tt-week-chevron${isOpen?' open':''}">▾</div>
      </div>
      <div class="tt-week-body${isOpen?'':' collapsed'}" id="tt-week-body-${weekNum}">
        ${daysHtml}
      </div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="tt-wrap">
      <div class="tt-header">
        <div>
          <div class="tt-title">📋 Team Task Assigned</div>
          <div class="tt-subtitle">Daily task tracker — Month → Week → Day</div>
        </div>
        <div class="dt-header-right">
          <div class="tt-month-nav">
            <button class="tt-month-btn" onclick="window._ttNavMonth(-1)">‹</button>
            <div class="tt-month-label">${ttMonthLabel(ym)}</div>
            <button class="tt-month-btn" onclick="window._ttNavMonth(1)">›</button>
          </div>
          <button class="btn btn-secondary" onclick="goHome()">← Projects</button>
        </div>
      </div>
      <div class="tt-summary-bar">
        <span class="tt-sum-chip done">✓ ${totDone} Done</span>
        <span class="tt-sum-chip prog">↻ ${totProg} In Progress</span>
        <span class="tt-sum-chip todo">— ${totTodo} To Do</span>
        <span class="tt-sum-chip hold">⏸ ${totHold} Hold / Skipped</span>
        <span style="margin-left:auto;font-size:12px;color:var(--mut);font-weight:600">${filtered.length} tasks this month</span>
      </div>
      <div class="dt-filter-row">
        <span class="dt-filter-label">Filter:</span>
        ${projPills}
      </div>
      <div id="tt-weeks-container">${weeksHtml}</div>
    </div>`;

  window._ttNavMonth=function(dir){
    const cur=ttCurrentMonth();
    _ttMonth=dir<0?ttPrevMonth(cur):ttNextMonth(cur);
    _ttWeekOpen={};
    renderTeamTasksPage();
  };
  window._ttSetFilter=function(pid){
    _ttProjFilter=pid;
    renderTeamTasksPage();
  };
}

function ttToggleWeek(weekNum){
  _ttWeekOpen[weekNum]=!(_ttWeekOpen[weekNum]!==false);
  const body=document.getElementById('tt-week-body-'+weekNum);
  const chevron=document.querySelector(`#tt-week-${weekNum} .tt-week-chevron`);
  if(body)body.classList.toggle('collapsed',!_ttWeekOpen[weekNum]);
  if(chevron)chevron.classList.toggle('open',_ttWeekOpen[weekNum]);
}

  // saveTeamTasks stamps _savedAt on all rows — server drops deleted row (not in incoming)
  saveTeamTasks();
  renderTeamTasksPage();
  toast('Task deleted');
}

function ttSaveEntry(editIdx){
  const date=document.getElementById('tt-date')?.value||'';
  const projectId=document.getElementById('tt-project')?.value||'';
  if(!date){toast('Please select a date','err');return;}
  if(!projectId){toast('Please select a project','err');return;}
  const g=id=>document.getElementById(id)?.value||'';
  const gi=id=>parseInt(document.getElementById(id)?.value||'0',10)||0;
  const entry={
    date,projectId,
    projectType:g('tt-ptype'),
    projectUrl:g('tt-url'),
    platform:g('tt-platform'),
    envType:g('tt-env'),
    taskSummary:g('tt-summary'),
    taskDescription:g('tt-desc'),
    jiraUrl:g('tt-jira'),
    estimationHrs:g('tt-est'),
    completionDate:g('tt-completion'),
    assignedBy:g('tt-assigned'),
    currentStatus:g('tt-cstatus'),
    testingStatus:g('tt-tstatus'),
    openBugs:{total:gi('ob-total'),high:gi('ob-high'),medium:gi('ob-medium'),low:gi('ob-low'),assigned:gi('ob-assigned'),inprogress:gi('ob-inprogress')},
    reopenBugs:{total:gi('rb-total'),high:gi('rb-high'),medium:gi('rb-medium'),low:gi('rb-low'),assigned:gi('rb-assigned'),inprogress:gi('rb-inprogress'),reopened:gi('rb-reopened')},
    assigneeComments:g('tt-assignee-cmts'),
    assignerComments:g('tt-assigner-cmts'),
  };
  const isNew=editIdx==null||editIdx<0;
  if(!isNew){
    // Preserve the existing id so server mergeTeamTasks matches by id (not natural key)
    entry.id=TEAM_TASKS[editIdx]?.id||(entry.id||('tt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)));
    TEAM_TASKS[editIdx]=entry;
  } else {
    entry.id='tt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    TEAM_TASKS.push(entry);
  }
  saveTeamTasks();
  closeModal();
  _ttMonth=date.slice(0,7);
  renderTeamTasksPage();
  toast(isNew?'Task added ✓':'Task updated ✓');
  // Send notification on both Save (new) and Update (edit)
  if(entry.assignedBy){
    const proj=PROJECTS.find(x=>x.id===projectId);
    notifyAssignment('teamtask',[
      {label:'Action',value:isNew?'🆕 New Task Added':'✏️ Task Updated'},
      {label:'Project',value:proj?.name||projectId},
      {label:'Task Summary',value:entry.taskSummary},
      {label:'Date',value:entry.date},
      {label:'Assigned To',value:entry.assignedBy},
      {label:'Environment',value:entry.envType},
      {label:'Estimation',value:entry.estimationHrs},
      {label:'Status',value:entry.currentStatus},
      {label:'Jira',value:entry.jiraUrl?`<a href="${entry.jiraUrl}" style="color:#6366f1">${entry.jiraUrl}</a>`:'—'},
    ],{projectId,assignedBy:_session?.name||entry.assignedBy,assignedTo:entry.assignedBy});
  }
}

// ── Auto-transition notifications ──────────────────────────────────────────
// Called on startup and every minute. Detects when a release moves category
// (next→today, today→past, next→past) and fires email+Slack exactly once.
// Uses r._notifiedAs to track last notified category — stored in RELEASES data.
function rlCheckAutoTransitions(){
  let anyChanged=false;
  RELEASES.forEach(r=>{
    const current=rlClassify(r);
    const prev=r._notifiedAs||'next'; // default assumption: started as 'next'
    if(current===prev)return; // no change

    // Transition detected
    r._notifiedAs=current;
    anyChanged=true;

    const proj=PROJECTS.find(x=>x.id===r.projectId);
    const projName=proj?.name||r.projectId||'Unknown';
    const rdFormatted=r.releaseDate?new Date(r.releaseDate).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';

    if(current==='today' && prev==='next'){
      // Next release → Today (date matched today)
      notifyAssignment('release_today',[
        {label:'Action',value:'🚀 Auto-Moved to Today Releases'},
        {label:'Project',value:projName},
        {label:'Release Date',value:rdFormatted},
        {label:'Summary',value:r.releaseSummary||'—'},
        {label:'Environment',value:r.envType||'—'},
        {label:'Platform',value:r.platform||'—'},
        {label:'Assigned To',value:r.assignedBy||'—'},
        {label:'Current Status',value:r.currentStatus||'To Do'},
      ],{projectId:r.projectId,assignedBy:_session?.name||'Dashboard',assignedTo:r.assignedBy||'',projectName:projName});

    } else if(current==='past' && (prev==='today'||prev==='next')){
      // Any → Past (date passed or Ready for Client)
      const reason=r.testingStatus==='Ready for Client'?'Testing Status: Ready for Client':'Release date has passed';
      notifyAssignment('release_past',[
        {label:'Action',value:'📁 Auto-Moved to Past Releases'},
        {label:'Reason',value:reason},
        {label:'Project',value:projName},
        {label:'Release Date',value:rdFormatted},
        {label:'Summary',value:r.releaseSummary||'—'},
        {label:'Environment',value:r.envType||'—'},
        {label:'Testing Status',value:r.testingStatus||'—'},
        {label:'Assigned To',value:r.assignedBy||'—'},
      ],{projectId:r.projectId,assignedBy:_session?.name||'Dashboard',assignedTo:r.assignedBy||'',projectName:projName});
    }
  });

  if(anyChanged){
    saveReleases(); // persist _notifiedAs flags so we don't re-notify on refresh
  }
}

// Count today's releases for the badge (excludes past/ready-for-client)
function rlTodayCount(){
  const todayStr=rlTodayStr();
  return RELEASES.filter(r=>{
    if(!r.releaseDate)return false;
    const rd=r.releaseDate.slice(0,10);
    const isPast=(rd<todayStr)||(r.testingStatus==='Ready for Client');
    return !isPast && rd===todayStr;
  }).length;
}

// Classify a release: 'past' | 'today' | 'next'
function rlClassify(r){
  const todayStr=rlTodayStr();
  if(!r.releaseDate)return'next';
  const rd=r.releaseDate.slice(0,10);
  if(r.testingStatus==='Ready for Client')return'past';
  if(rd<todayStr)return'past';
  if(rd===todayStr)return'today';
  return'next';
}

      const csOpts=RL_CURR_STATUS.map(v=>`<option value="${v}" ${r.currentStatus===v?'selected':''}>${v}</option>`).join('');

      const assignedOpts=`<option value="">— Select —</option>`+getTeamMembers().map(n=>`<option value="${escH(n)}" ${r.assignedBy===n?'selected':''}>${escH(n)}</option>`).join('');
      const ptOpts=RL_PROJ_TYPES.map(v=>`<option value="${v}" ${r.projectType===v?'selected':''}>${v}</option>`).join('');
      const platOpts=RL_PLATFORMS.map(v=>`<option value="${v}" ${r.platform===v?'selected':''}>${v}</option>`).join('');

        `:`

function rlToggleCard(id){
  _rlCardOpen[id]=!(_rlCardOpen[id]!==false);
  const body=document.getElementById('rl-body-'+id);
  const chevron=document.querySelector(`#rl-card-${id} .rl-card-chevron`);
  if(body)body.classList.toggle('collapsed',!_rlCardOpen[id]);
  if(chevron)chevron.classList.toggle('open',_rlCardOpen[id]);
}

function rlInline(idx,field,el){
  if(idx<0||idx>=RELEASES.length)return;
  RELEASES[idx][field]=el.value;
  saveReleases();
  // After status change, re-classify — may have moved to Past
  const r=RELEASES[idx];
  const newMode=rlClassify(r); // 'today' | 'next' | 'past'
  const viewMode=curView==='pastreleases'?'past':curView==='todayreleases'?'today':'next';
  const autoMovedToPast=newMode==='past' && viewMode!=='past';
  if(autoMovedToPast){
    toast('✅ Moved to Past Releases');
    curView='pastreleases';
    renderReleasesPage('past');
  } else {
    renderReleasesPage(viewMode);
  }
  // Notify when testingStatus changes, or when release auto-moved to past tab
  if(field==='testingStatus'){
    const proj=PROJECTS.find(x=>x.id===r.projectId);
    if(autoMovedToPast){
      // Status change triggered auto-move — send a single "moved to past" notification
      notifyAssignment('release_past',[
        {label:'Action',value:'📁 Moved to Past Releases'},
        {label:'Reason',value:'Testing Status: '+el.value},
        {label:'Project',value:proj?.name||r.projectId},
        {label:'Release Date',value:r.releaseDate||'—'},
        {label:'Summary',value:r.releaseSummary||'—'},
        {label:'Assigned To',value:r.assignedBy||'—'},
        {label:'Testing Status',value:el.value},
      ],{projectId:r.projectId,assignedBy:_session?.name||'Dashboard',assignedTo:r.assignedBy||'',projectName:proj?.name||r.projectId});
    } else {
      const rlType=viewMode==='past'?'release_past':viewMode==='today'?'release_today':'release_next';
      notifyAssignment(rlType,[
        {label:'Action',value:'🔄 Testing Status Changed'},
        {label:'Project',value:proj?.name||r.projectId},
        {label:'Release Date',value:r.releaseDate||'—'},
        {label:'Summary',value:r.releaseSummary||'—'},
        {label:'Assigned To',value:r.assignedBy||'—'},
        {label:'New Testing Status',value:el.value},
      ],{projectId:r.projectId,assignedBy:_session?.name||'Dashboard',assignedTo:r.assignedBy||'',projectName:proj?.name||r.projectId});
    }
  }
}
function rlInlineVal(idx,field,val){
  if(idx<0||idx>=RELEASES.length)return;
  RELEASES[idx][field]=val;
  saveReleases();
}

function rlDelete(idx){
  if(!confirm('Delete this release?'))return;
  RELEASES.splice(idx,1);
  saveReleases();
  const mode=curView==='pastreleases'?'past':curView==='todayreleases'?'today':'next';
  renderReleasesPage(mode);
  toast('Release deleted');
}
function rlDeleteAllPast(){
  const pastList=RELEASES.filter(r=>rlClassify(r)==='past');
  if(!pastList.length)return;
  if(!confirm(`Delete all ${pastList.length} past release${pastList.length!==1?'s':''}? This cannot be undone.`))return;
  RELEASES=RELEASES.filter(r=>rlClassify(r)!=='past');
  saveReleases();
  renderReleasesPage('past');
  toast(`Deleted ${pastList.length} past release${pastList.length!==1?'s':''}`);
}

function rlSaveEntry(editIdx,mode){
  const g=id=>document.getElementById(id)?.value||'';
  const gi=id=>parseInt(document.getElementById(id)?.value||'0',10)||0;
  const projectId=g('rl-project');
  if(!projectId){toast('Please select a project','err');return;}
  const entry={
    id:editIdx!=null&&RELEASES[editIdx]?RELEASES[editIdx].id:('rl_'+Date.now()),
    projectId,
    projectType:g('rl-ptype'),
    projectUrl:g('rl-url'),
    envType:g('rl-env'),
    platform:g('rl-platform'),
    releaseDate:g('rl-date'),
    releaseSummary:g('rl-summary'),
    releaseNotes:g('rl-notes'),
    assignedBy:g('rl-assigned'),
    currentStatus:g('rl-cstatus'),
    testingStatus:g('rl-tstatus'),
    openBugs:{total:gi('ob-total'),high:gi('ob-high'),medium:gi('ob-medium'),low:gi('ob-low'),assigned:gi('ob-assigned'),inprogress:gi('ob-inprogress')},
    reopenBugs:{total:gi('rb-total'),high:gi('rb-high'),medium:gi('rb-medium'),low:gi('rb-low'),assigned:gi('rb-assigned'),inprogress:gi('rb-inprogress'),reopened:gi('rb-reopened')},
    assigneeComments:g('rl-assignee-cmts'),
    assignerComments:g('rl-assigner-cmts'),
  };
  const isNewRl=editIdx==null||editIdx<0;
  const oldTestingStatus=!isNewRl&&RELEASES[editIdx]?RELEASES[editIdx].testingStatus:null;
  // Pre-stamp _notifiedAs so rlCheckAutoTransitions doesn't fire a duplicate on the same event
  entry._notifiedAs=rlClassify(entry);
  if(!isNewRl){RELEASES[editIdx]=entry;}
  else{RELEASES.push(entry);_rlCardOpen[entry.id]=true;}
  saveReleases();
  closeModal();
  renderReleasesPage(mode);
  toast(isNewRl?'Release added ✓':'Release updated ✓');
  // Notify only for new releases OR when testingStatus actually changed
  if(isNewRl||entry.testingStatus!==oldTestingStatus){
    const rlType=mode==='past'?'release_past':mode==='today'?'release_today':'release_next';
    const rlProj=PROJECTS.find(x=>x.id===entry.projectId);
    notifyAssignment(rlType,[
      {label:'Action',value:isNewRl?'🆕 New Release Added':'🔄 Testing Status Changed'},
      {label:'Project',value:rlProj?.name||entry.projectId},
      {label:'Release Date',value:entry.releaseDate},
      {label:'Summary',value:entry.releaseSummary},
      {label:'Environment',value:entry.envType},
      {label:'Platform',value:entry.platform},
      {label:'Project URL',value:entry.projectUrl?`<a href="${entry.projectUrl}" style="color:#6366f1">${entry.projectUrl}</a>`:'—'},
      {label:'Assigned To',value:entry.assignedBy||'—'},
      {label:'Current Status',value:entry.currentStatus||'—'},
      {label:'Testing Status',value:isNewRl?entry.testingStatus||'—':`${oldTestingStatus||'—'} → ${entry.testingStatus||'—'}`},
    ],{projectId:entry.projectId,assignedBy:_session?.name||'Dashboard',assignedTo:entry.assignedBy||'',projectName:rlProj?.name||entry.projectId});
  }
}

function rlOpenAdd(mode){

function rlOpenEdit(idx){
  const entry=RELEASES[idx];
  if(!entry)return;
  const mode=curView==='pastreleases'?'past':curView==='todayreleases'?'today':'next';
  openModal('Edit Release',rlBuildModalBody(entry,mode),()=>rlSaveEntry(idx,mode));
}

// ── _apiCall: authenticated fetch helper ─────────────────────────────────────
async function _apiCall(url,opts={}){
  const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken(),...(opts.headers||{})}});
  if(r.status===401){doLogout();return null;}
  return r;
}

  const rows=_usersCache.map((u,i)=>{
    const initials=u.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);

      <td><div style="display:flex;align-items:center;gap:9px"><div style="width:32px;height:32px;border-radius:50%;background:${avaBg};color:${ava};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${initials}</div><div><div style="font-weight:700;font-size:13px">${escH(u.name)} ${statusBadge}</div><div style="font-size:11px;color:var(--mut)">${escH(u.email)}</div></div></div></td>
      <td><span class="role-badge ${u.role}">${u.role==='super_admin'?'👑 Super Admin':'👤 Member'}</span></td>
      <td class="act-cell">
        <button class="btn-icon" onclick="openEditUser(${i})">✏ Edit</button>
        <button class="btn-icon" onclick="resetUserPassword('${u.id}','${escH(u.name)}')" title="Reset Password">🔑 Reset Pwd</button>
        ${u.id!=='u_sa'&&u.id!==_session?.id?`<button class="btn-icon del" onclick="deleteUser(${i})" title="${u.isActive===false?'Activate':'Deactivate'}">${u.isActive===false?'✓ Activate':'✕ Deactivate'}</button>`:'<span style="font-size:10px;color:var(--mut)">You</span>'}
