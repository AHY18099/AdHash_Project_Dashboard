  }).join('');
  inner.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)">
      <div><h2 style="font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--grad-a) 0%,var(--grad-b) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">👥 User Management</h2><div style="font-size:12px;color:var(--mut);margin-top:2px">${_usersCache.length} user${_usersCache.length!==1?'s':''} in workspace</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" style="font-size:12px;padding:6px 14px" onclick="openAddUser()">＋ Add User</button>
        <button class="btn-icon" onclick="closeUsersModal()" title="Close" style="font-size:18px;color:var(--mut)">✕</button>
      </div>
    </div>
    <div style="padding:0 24px 24px;max-height:70vh;overflow-y:auto"><div class="user-list"><table class="utbl" style="margin-top:16px">
      <thead><tr><th>User</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

function openAddUser(){
  if(!isAdmin()){toast('Admin access required','err');return;}
  openModal('Add New User',`
    <div class="fg-row">
      <div class="fg"><label>Full Name *</label><input id="u-name" placeholder="e.g. John Smith" autocomplete="off"></div>
      <div class="fg"><label>Role</label><select id="u-role"><option value="member">Team Member</option><option value="super_admin">Super Admin</option></select></div>
    </div>
    <div class="fg"><label>Email Address *</label><input type="email" id="u-email" placeholder="user@company.com" autocomplete="off"></div>
    <div class="fg-row">
      <div class="fg"><label>Password *</label><input type="password" id="u-pwd" placeholder="Min 6 characters" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"></div>
      <div class="fg"><label>Confirm Password</label><input type="password" id="u-pwd2" placeholder="Repeat password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"></div>
    </div>`,async()=>{
    const name=document.getElementById('u-name').value.trim();
    const email=document.getElementById('u-email').value.trim().toLowerCase();
    const pwd=document.getElementById('u-pwd').value;
    const pwd2=document.getElementById('u-pwd2').value;
    const role=document.getElementById('u-role').value;
    if(!name||!email||!pwd){toast('All fields are required','err');return false;}
    if(pwd.length<6){toast('Password must be at least 6 characters','err');return false;}
    if(pwd!==pwd2){toast('Passwords do not match','err');return false;}
    try{
      const r=await _apiCall('/api/users',{method:'POST',body:JSON.stringify({name,email,password:pwd,role})});
      if(!r)return false;
      const d=await r.json();
      if(!r.ok){toast(d.error||'Failed to add user','err');return false;}
      // Also add to local qa_users cache for getTeamMembers() fallback
      const users=getUsers();users.push({id:d.id,name,email,role,isActive:true});saveUsers(users);
      await _loadTeamMembersFromServer();
      closeModal();renderUsersModal();toast('User added ✓');
    }catch(e){toast('Failed to add user','err');return false;}
  });
}

function openEditUser(i){
  const u=_usersCache[i]||getUsers()[i];if(!u)return;
  openModal('Edit User',`
    <div class="fg-row">
      <div class="fg"><label>Full Name</label><input id="eu-name" value="${escH(u.name)}" autocomplete="off"></div>
      <div class="fg"><label>Role</label><select id="eu-role"><option value="member"${u.role==='member'?' selected':''}>Team Member</option><option value="super_admin"${u.role==='super_admin'?' selected':''}>Super Admin</option></select></div>
    </div>
    <div class="fg"><label>Email Address</label><input type="email" id="eu-email" value="${escH(u.email)}" autocomplete="off" ${u.id==='u_sa'?'readonly':''}></div>
    <div class="fg-row">
      <div class="fg"><label>New Password <span style="color:var(--mut)">(leave blank to keep)</span></label><input type="password" id="eu-pwd" placeholder="New password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"></div>
      <div class="fg"><label>Confirm New Password</label><input type="password" id="eu-pwd2" placeholder="Repeat" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"></div>
    </div>`,async()=>{
    const name=document.getElementById('eu-name').value.trim();
    const email=document.getElementById('eu-email').value.trim().toLowerCase();
    const role=document.getElementById('eu-role').value;
    const pwd=document.getElementById('eu-pwd').value;
    const pwd2=document.getElementById('eu-pwd2').value;
    if(!name||!email){toast('Name and email are required','err');return false;}
    if(pwd&&pwd.length<6){toast('Password must be at least 6 characters','err');return false;}
    if(pwd&&pwd!==pwd2){toast('Passwords do not match','err');return false;}
    const body={name,email,role};if(pwd)body.password=pwd;
    try{
      const r=await _apiCall('/api/users/'+encodeURIComponent(u.id),{method:'PUT',body:JSON.stringify(body)});
      if(!r)return false;
      const d=await r.json();
      if(!r.ok){toast(d.error||'Failed to update user','err');return false;}
      // Update local cache
      const users=getUsers();const idx=users.findIndex(x=>x.id===u.id);
      if(idx>=0){users[idx]={...users[idx],name,email,role};saveUsers(users);}
      if(_session&&_session.id===u.id){_session.name=name;_session.email=email;_session.role=role;renderTopBar();}
      await _loadTeamMembersFromServer();
      closeModal();renderUsersModal();toast('User updated ✓');
    }catch(e){toast('Failed to update user','err');return false;}
  });
}

async function deleteUser(i){
  const u=_usersCache[i]||getUsers()[i];if(!u)return;
  if(u.id==='u_sa'||u.id===_session?.id){toast('Cannot deactivate this account','err');return;}
  const action=u.isActive===false?'Activate':'Deactivate';
  if(!confirm(`${action} user "${u.name}" (${u.email})?`))return;
  try{
    if(u.isActive===false){
      // Re-activate
      const r=await _apiCall('/api/users/'+encodeURIComponent(u.id),{method:'PUT',body:JSON.stringify({isActive:true})});
      if(r&&r.ok){toast('User activated ✓');}
    } else {
      const r=await _apiCall('/api/users/'+encodeURIComponent(u.id),{method:'DELETE'});
      if(r&&r.ok){toast('User deactivated ✓');}
    }
    await _loadTeamMembersFromServer();
    renderUsersModal();
  }catch(e){toast('Failed','err');}
}
async function resetUserPassword(userId, userName){
  const newPwd=prompt(`Set new password for ${userName}:\n(minimum 6 characters)`);
  if(!newPwd||newPwd.length<6){if(newPwd!==null)toast('Password must be at least 6 characters','err');return;}
  if(!confirm(`Reset password for ${userName}?`))return;
  try{
    const r=await _apiCall('/api/users/'+encodeURIComponent(userId)+'/reset-password',{method:'PUT',body:JSON.stringify({password:newPwd})});
    if(!r)return;
    const d=await r.json();
    if(!r.ok){toast(d.error||'Failed to reset password','err');return;}
    toast(`Password reset for ${userName} ✓`);
  }catch(e){toast('Failed to reset password','err');}
}

async function _tpRunApi(i){
  const a=_tpApiRows[i];
  const badge=document.getElementById(`tp-run-badge-${i}`);
  const row=document.getElementById(`tp-api-row-${i}`);
  if(!a.url){if(badge){badge.style.display='inline';badge.textContent='⚠ No URL';badge.style.cssText='display:inline;background:rgba(217,119,6,.12);color:var(--blk);border:1px solid rgba(217,119,6,.3);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600';}return;}
  if(badge){badge.style.cssText='display:inline;background:rgba(59,130,246,.1);color:var(--inp);border:1px solid rgba(59,130,246,.25);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600';badge.textContent='⏳ Running…';}
  try{
    const proxyPayload={url:a.url,method:a.method==='OTHER'?'GET':a.method};
    if(a.headers&&Object.keys(a.headers).length)proxyPayload.headers=a.headers;
    if(a.body!=null&&['POST','PUT','PATCH'].includes(a.method))proxyPayload.body=typeof a.body==='string'?a.body:JSON.stringify(a.body);
    const resp=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},body:JSON.stringify(proxyPayload)});
    const data=await resp.json();
    const ok=data.status>=200&&data.status<300;
    const statusOk=data.status>0&&!data.error;
    if(badge){
      badge.textContent=statusOk?(ok?`✓ ${data.status} OK`:`✕ ${data.status}`):(data.error?.includes('timed out')?'✕ Timeout':'✕ Unreachable');
      badge.style.cssText=`display:inline;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;border:1px solid;${(statusOk&&ok)?'background:rgba(5,150,105,.12);color:var(--pass);border-color:rgba(5,150,105,.3)':'background:rgba(220,38,38,.1);color:var(--fail);border-color:rgba(220,38,38,.25)'}`;
    }
    _tpApiRows[i].lastRun={status:statusOk&&ok?'reachable':'unreachable',response:data,ts:new Date().toISOString()};
    // Show expandable response panel inside modal row
    if(row){
      let panel=row.querySelector('.tp-api-modal-resp');
      if(!panel){panel=document.createElement('div');panel.className='tp-api-modal-resp';row.appendChild(panel);}
      panel.style.display='block';
      panel.innerHTML=`<button type="button" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.textContent=this.textContent.startsWith('▼')?'▲ Hide Response':'▼ View Response'" class="tp-resp-toggle">▼ View Response</button><div style="display:none">${_tpFmtResp(data)}</div>`;
    }
  }catch(e){
    if(badge){badge.style.cssText='display:inline;background:rgba(220,38,38,.1);color:var(--fail);border:1px solid rgba(220,38,38,.25);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600';badge.textContent='✕ Error';}
    _tpApiRows[i].lastRun={status:'unreachable',response:{status:0,statusText:'Error',body:'',timing:0,error:e.message},ts:new Date().toISOString()};
  }
}

const TCL_STATUSES=['Pending','Pass','Fail','NA','Bugs Raised','Bugs Closed','Bugs Re-Opened','Done','Hold','Ready for Prod','Ready for Demo'];
const TCL_PLATFORMS=['Web','iOS','Android'];
const TCL_ENVS=['Staging','Production'];

function tclStats(items){
  const total=items.length;
  const pass=items.filter(r=>r.status==='Pass'||r.status==='Done').length;
  const fail=items.filter(r=>r.status==='Fail').length;
  const na=items.filter(r=>r.status==='NA').length;
  const pending=items.filter(r=>!r.status||r.status==='Pending').length;
  const bugsRaised=items.filter(r=>r.status==='Bugs Raised').length;
  const bugsClosed=items.filter(r=>r.status==='Bugs Closed').length;
  const bugsReopened=items.filter(r=>r.status==='Bugs Re-Opened').length;
  const hold=items.filter(r=>r.status==='Hold').length;
  const readyProd=items.filter(r=>r.status==='Ready for Prod').length;
  const readyDemo=items.filter(r=>r.status==='Ready for Demo').length;
  const high=items.reduce((a,r)=>a+(r.priorityHigh||0),0);
  const medium=items.reduce((a,r)=>a+(r.priorityMedium||0),0);
  const low=items.reduce((a,r)=>a+(r.priorityLow||0),0);
  return{total,pass,fail,na,pending,bugsRaised,bugsClosed,bugsReopened,hold,readyProd,readyDemo,high,medium,low};
}

// track inline edit dirty state per project
const _tclDirty={};

function tclInlineChange(p){
  _tclDirty[p]=true;
  // enable Save Report button
  const btn=document.getElementById('tcl-save-btn-'+p);
  if(btn){btn.disabled=false;btn.style.opacity='1';}
}

function tclInlineSave(p,i,field,val){
  if(!STORE[p].taskchecklist[i])return;
  STORE[p].taskchecklist[i][field]=val;
  STORE[p].taskchecklist[i]._savedAt=Date.now();
  _tclDirty[p]=true;
  const btn=document.getElementById('tcl-save-btn-'+p);
  if(btn){btn.disabled=false;btn.style.opacity='1';}
  saveToLS(p);
}

function tclSaveReport(p){
  const items=STORE[p].taskchecklist||[];
  const proj=PROJECTS.find(x=>x.id===p);
  const rns=STORE[p].releaseNotes||[];
  const s=tclStats(items);
  const passRate=s.total?Math.round((s.pass/s.total)*100):0;
  const now=new Date();
  // Deep-copy items into snapshot BEFORE resetting
  const snap={
    id:'rpt_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    type:'checklist',
    datetime:now.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})+' '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    label:`Task Checklist — ${proj?.name||p}`,
    passRate,stats:s,
    items:JSON.parse(JSON.stringify(items)),
    releaseNotes:JSON.parse(JSON.stringify(rns))
  };
  if(!STORE[p].reports)STORE[p].reports=[];
  STORE[p].reports.push(snap);
  // Reset status + bug counts only — keep all checklist items intact, never delete them
  STORE[p].taskchecklist=STORE[p].taskchecklist.map(r=>({
    ...r,
    status:'Pending',
    bugsCount:0,
    priorityHigh:0,
    priorityMedium:0,
    priorityLow:0,
    comments:''
  }));
  _tclDirty[p]=false;
  // Snapshot the reset version before async server re-fetch can overwrite it
  const _tclResetSnap=JSON.parse(JSON.stringify(STORE[p].taskchecklist));
  saveToLS(p);
  // Re-apply reset after save completes in case async server re-fetch overwrites with stale data
  setTimeout(()=>{
    STORE[p].taskchecklist=_tclResetSnap;
    curTab[p]='taskchecklist';
    renderProject(p);
  },1200);
  curTab[p]='taskchecklist';
  renderProject(p);
  toast(`✓ Report #${STORE[p].reports.length} saved — statuses reset, checklist items preserved`);
}

function tclResetAll(p){
  if(!confirm('Reset all rows? This will clear the testing status, bugs, and comments for all rows. The row items will NOT be deleted.'))return;
  STORE[p].taskchecklist=(STORE[p].taskchecklist||[]).map(r=>({
    ...r,
    status:'Pending',
    testedBy:'',
    bugsCount:0,
    priorityHigh:0,
    priorityMedium:0,
    priorityLow:0,
    jiraLinks:'',
    comments:''
  }));
  _tclDirty[p]=false;
  saveToLS(p);
  curTab[p]='taskchecklist';
  renderProject(p);
  toast('All rows have been reset');
}

    ${s.bugsReopened?`<div class="tcl-stat"><div class="tcl-stat-val" style="color:#ef4444">${s.bugsReopened}</div><div class="tcl-stat-lbl">Re-Opened</div></div>`:''}
    ${s.bugsClosed?`<div class="tcl-stat"><div class="tcl-stat-val" style="color:#6366f1">${s.bugsClosed}</div><div class="tcl-stat-lbl">Bugs Closed</div></div>`:''}
    ${s.hold?`<div class="tcl-stat"><div class="tcl-stat-val" style="color:#94a3b8">${s.hold}</div><div class="tcl-stat-lbl">Hold</div></div>`:''}
    ${s.readyProd?`<div class="tcl-stat"><div class="tcl-stat-val" style="color:#8b5cf6">${s.readyProd}</div><div class="tcl-stat-lbl">Ready/Prod</div></div>`:''}
    ${s.readyDemo?`<div class="tcl-stat"><div class="tcl-stat-val" style="color:#3b82f6">${s.readyDemo}</div><div class="tcl-stat-lbl">Ready/Demo</div></div>`:''}

    <div class="tcl-stat"><div class="tcl-stat-val" style="color:#f97316">${s.medium}</div><div class="tcl-stat-lbl">🟠 Medium</div></div>

function tclOpenEdit(p,i){

function tclShowDownloadPicker(p){
  const allItems=STORE[p].taskchecklist||[];
  const platforms=[...new Set(allItems.map(r=>r.platform).filter(Boolean))].sort();
  const platColor={Web:'#3b82f6',iOS:'#8b5cf6',Android:'#10b981'};
  const platIcon={Web:'🌐',iOS:'🍎',Android:'🤖'};

  // mini donut for a set of items
  function miniDonut(items,platClr){
    const s=tclStats(items);
    const passRate=s.total?Math.round((s.pass/s.total)*100):0;
    const r=36,cx=44,cy=44,sw=12,C=2*Math.PI*r;
    const segs=[{v:s.pass,c:'#059669'},{v:s.fail,c:'#dc2626'},{v:s.pending,c:'#d97706'},{v:s.na,c:'#94a3b8'}].filter(x=>x.v>0);
    if(!segs.length)return`<svg width="88" height="88"><circle cx="44" cy="44" r="36" fill="none" stroke="#e2e8f0" stroke-width="12"/><text x="44" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8">0%</text></svg>`;
    let offset=0;
    const arcs=segs.map(sg=>{const dash=(sg.v/s.total)*C;const arc=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;offset+=dash;return arc;}).join('');
    return`<svg width="88" height="88">${arcs}<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="14" font-weight="800" fill="${platClr||'#1e293b'}">${passRate}%</text></svg>`;
  }

  // card for each platform option
  function platCard(plat,items,isAll){
    const s=tclStats(items);
    const clr=isAll?'#6366f1':(platColor[plat]||'#64748b');
    const icon=isAll?'📊':(platIcon[plat]||'📱');
    const label=isAll?'All Combined':plat;
    const passRate=s.total?Math.round((s.pass/s.total)*100):0;
    return`<div class="tcl-dl-card" onclick="tclDownloadReport('${p}','${isAll?'ALL':plat}');closeModal()" style="border-color:${clr}22">
      <div class="tcl-dl-card-top" style="background:${clr}10">
        <div style="font-size:28px;line-height:1">${icon}</div>
        ${miniDonut(items,clr)}
      </div>
      <div class="tcl-dl-card-body">
        <div class="tcl-dl-card-name" style="color:${clr}">${label}</div>
        <div class="tcl-dl-card-meta">${s.total} items &nbsp;·&nbsp; ${passRate}% pass</div>
        <div class="tcl-dl-card-pills">
          <span style="color:#059669">✓ ${s.pass}</span>
          <span style="color:#dc2626">✗ ${s.fail}</span>
          <span style="color:#d97706">⏳ ${s.pending}</span>
          <span style="color:#64748b">— ${s.na}</span>
        </div>
      </div>
    </div>`;
  }

  let cards=platforms.map(pl=>platCard(pl,allItems.filter(r=>r.platform===pl),false));
  if(platforms.length>1||platforms.length===0){
    cards=[platCard('ALL',allItems,true),...cards];
  }

  openModal('⬇ Download Report',`
    <p style="font-size:12px;color:var(--mut);margin:0 0 16px">Choose which platform report to download</p>
    <div class="tcl-dl-grid">${cards.join('')}</div>
  `,null,{noSave:true});
}

function tclDownloadReport(p,platformFilter){
  const proj=PROJECTS.find(x=>x.id===p);
  const allItems=STORE[p].taskchecklist||[];
  const items=(platformFilter&&platformFilter!=='ALL')?allItems.filter(r=>r.platform===platformFilter):allItems;
  const rns=STORE[p].releaseNotes||[];
  const s=tclStats(items);
  const passRate=s.total?Math.round((s.pass/s.total)*100):0;
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const platLabel=(platformFilter&&platformFilter!=='ALL')?` — ${platformFilter}`:'';
  const platColor={Web:'#3b82f6',iOS:'#8b5cf6',Android:'#10b981'};

  const statusColor={Pass:'#059669',Fail:'#dc2626',NA:'#64748b',Pending:'#d97706',Done:'#059669','Bugs Raised':'#f97316','Bugs Closed':'#6366f1','Bugs Re-Opened':'#ef4444',Hold:'#94a3b8','Ready for Prod':'#8b5cf6','Ready for Demo':'#3b82f6'};
  const envColor={Staging:'#f97316',Production:'#6366f1'};

  // full donut for the report
  const donutSvg=(()=>{
    const r=70,cx=90,cy=90,sw=22,C=2*Math.PI*r;
    const segs=[{v:s.pass,c:'#059669'},{v:s.fail,c:'#dc2626'},{v:s.pending,c:'#d97706'},{v:s.na,c:'#94a3b8'}].filter(x=>x.v>0);
    if(!segs.length)return`<svg width="180" height="180"><circle cx="90" cy="90" r="70" fill="none" stroke="#e2e8f0" stroke-width="22"/><text x="90" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#64748b">0%</text></svg>`;
    let offset=0;
    const arcs=segs.map(sg=>{const dash=(sg.v/s.total)*C;const arc=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;offset+=dash;return arc;}).join('');
    return`<svg width="180" height="180">${arcs}<text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="24" font-weight="800" fill="#1e293b">${passRate}%</text><text x="${cx}" y="${cy+24}" text-anchor="middle" font-size="11" fill="#64748b">Pass Rate</text></svg>`;

    <td>${escH(r.testedBy||'—')}</td>
    <td style="text-align:center;font-weight:700;color:${r.bugsCount>0?'#dc2626':'#059669'}">${r.bugsCount||0}</td>
    <td>${[r.priorityHigh?`<span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3)">H:${r.priorityHigh}</span>`:'',r.priorityMedium?`<span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.3)">M:${r.priorityMedium}</span>`:'',r.priorityLow?`<span style="padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.3)">L:${r.priorityLow}</span>`:''].filter(Boolean).join(' ')||'—'}</td>

    <td style="color:#64748b;font-size:11px">${escH(r.comments||'—')}</td>
  </tr>`).join('');

  const rnSection=rns.length?`<div style="margin-top:40px">
    <h2 style="font-size:18px;font-weight:800;color:#1e293b;margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid #e2e8f0">📝 Release Notes — Modules Covered</h2>
    ${[...rns].reverse().map(rn=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:15px;font-weight:800;color:#1e293b">v${escH(rn.version||'')}</span>
        <span style="padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;background:${rn.status==='Published'?'rgba(5,150,105,.12)':'rgba(100,116,139,.12)'};color:${rn.status==='Published'?'#059669':'#64748b'}">${rn.status||'Draft'}</span>
        <span style="font-size:12px;color:#64748b">${rn.releaseDate||''}</span>
      </div>
      ${rn.summary?`<div style="font-size:13px;color:#334155;margin-bottom:8px">${escH(rn.summary)}</div>`:''}
      ${(rn.changes||[]).length?`<ul style="margin:0;padding-left:18px">${rn.changes.map(c=>`<li style="font-size:12px;color:#475569;margin-bottom:4px">${escH(c)}</li>`).join('')}</ul>`:''}
    </div>`).join('')}
  </div>`:'';

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Task Checklist${platLabel} — ${escH(proj?.name||p)}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;padding:32px}
  .report-wrap{max-width:1100px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(100,116,139,.12);overflow:hidden}
  .report-hdr{background:linear-gradient(135deg,${platAccent} 0%,#0f172a 100%);padding:32px 36px;color:#fff}
  .report-hdr h1{font-size:24px;font-weight:800;margin-bottom:6px}

  .plat-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);margin-top:10px}

  .stat-card .val{font-size:26px;font-weight:800;line-height:1}
  .stat-card .lbl{font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  h2{font-size:16px;font-weight:700;margin:0 0 14px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead tr{background:#f8fafc;border-bottom:2px solid #e2e8f0}
  th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;color:#334155}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f8fafc}
  .report-footer{padding:16px 36px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;text-align:center}
  @media print{body{background:#fff;padding:0}.report-wrap{box-shadow:none;border-radius:0}}
  </style></head><body>
  <div class="report-wrap">
    <div class="report-hdr">
      <h1>✔ Task Checklist Report${platLabel}</h1>
      <p>Project: ${escH(proj?.name||p)} &nbsp;·&nbsp; Generated: ${dateStr} &nbsp;·&nbsp; Total Items: ${s.total}</p>
      ${platLabel?`<div class="plat-badge">${platLabel.trim()} Platform</div>`:''}

          <div class="stat-card"><div class="val" style="color:#f97316">${s.medium}</div><div class="lbl">Med Bugs</div></div>

  const blob=new Blob([html],{type:'text/html'});

function _tpApiModalHtml(api){
  // Shared HTML for Add/Edit API modal — headers + body
  const method=api?.method||'GET';

function _tpaMethodChange(){
  const m=document.getElementById('tpa-method')?.value||'GET';

function _tpaAddHdrRow(){
  const cont=document.getElementById('tpa-hdr-rows');if(!cont)return;
  const row=document.createElement('div');row.className='tpa-hdr-row';
  row.style.cssText='display:flex;gap:6px;margin-bottom:4px;align-items:center';
  row.innerHTML=`<input class="finp tpa-hdr-key" placeholder="Header name (e.g. apy-token)" style="flex:1;padding:5px 8px;font-size:12px" autocomplete="off"><input class="finp tpa-hdr-val" placeholder="Value" style="flex:1;padding:5px 8px;font-size:12px" autocomplete="off"><button type="button" onclick="this.closest('.tpa-hdr-row').remove()" style="background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);border-radius:5px;padding:2px 7px;font-size:12px;color:var(--fail);cursor:pointer;flex-shrink:0">✕</button>`;
  cont.appendChild(row);
}
function _tpaReadApiFields(existingApi){
  const name=document.getElementById('tpa-name')?.value.trim();
  const method=document.getElementById('tpa-method')?.value||'GET';
  const url=document.getElementById('tpa-url')?.value.trim()||'';
  const status=document.getElementById('tpa-status')?.value||'Active';
  const description=document.getElementById('tpa-desc')?.value.trim()||'';
  const headers={};
  document.querySelectorAll('.tpa-hdr-row').forEach(row=>{
    const k=row.querySelector('.tpa-hdr-key')?.value.trim();
    const v=row.querySelector('.tpa-hdr-val')?.value.trim();
    if(k&&v)headers[k]=v;
  });
  let body=null;
  if(['POST','PUT','PATCH'].includes(method)){
    const bv=document.getElementById('tpa-body')?.value.trim();
    if(bv){try{body=JSON.parse(bv);}catch(_){body=bv;}}
  }
  return{id:existingApi?.id||('tpa_'+Math.random().toString(36).slice(2,10)),name,method,url,status,description,headers,body};
}
function tpOpenAddApi(p,acctIdx){
  if(!isAdmin()){toast('Only admin can add APIs','err');return;}

    STORE[p].thirdparty[acctIdx].apis.push(api);saveToLS(p);closeModal();renderProject(p);toast('API added');
  },{saveLabel:'Add API'});
}
function tpDeleteApi(p,acctIdx,apiIdx){if(!isAdmin()){toast('Only admin can delete APIs','err');return;}if(!confirm('Delete this API?'))return;STORE[p].thirdparty[acctIdx].apis.splice(apiIdx,1);STORE[p]._replaceArrays=['thirdparty'];saveToLS(p);delete STORE[p]._replaceArrays;renderProject(p);toast('API deleted');}
function tpEditApi(p,acctIdx,apiIdx){

// Format API response for display
function _tpFmtResp(r){
  if(!r)return'';
  const sc=r.status||0;
  const scColor=sc>=200&&sc<300?'var(--pass)':sc>=400?'var(--fail)':'var(--blk)';
  const scBadge=`<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:${sc>=200&&sc<300?'rgba(5,150,105,.12)':sc>=400?'rgba(220,38,38,.1)':'rgba(217,119,6,.1)'};color:${scColor};border:1px solid currentColor">${sc||'ERR'} ${escH(r.statusText||'')}</span>`;
  const timeBadge=r.timing?`<span style="font-size:10px;color:var(--mut);margin-left:8px">⏱ ${r.timing}ms</span>`:'';
  let bodyHtml='';
  if(r.error){bodyHtml=`<div style="color:var(--fail);font-size:12px;margin-top:6px">⚠ ${escH(r.error)}</div>`;}
  else if(r.body){
    let pretty=r.body;
    try{pretty=JSON.stringify(JSON.parse(r.body),null,2);}catch(_){}
    bodyHtml=`<pre style="margin:6px 0 0 0;padding:10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--font-mono);color:var(--txt);overflow-x:auto;max-height:300px;white-space:pre-wrap;word-break:break-all">${escH(pretty)}</pre>`;
  }else{bodyHtml=`<div style="color:var(--mut);font-size:12px;margin-top:6px;font-style:italic">No response body</div>`;}
  return`<div style="padding:8px 0 2px">${scBadge}${timeBadge}${bodyHtml}</div>`;
}
function tpToggleResp(acctIdx,apiIdx){
  const panel=document.getElementById(`tp-resp-${acctIdx}-${apiIdx}`);
  const bodyEl=document.getElementById(`tp-resp-body-${acctIdx}-${apiIdx}`);
  if(!panel||!bodyEl)return;
  const isOpen=panel.dataset.open==='1';
  if(isOpen){bodyEl.style.display='none';panel.dataset.open='0';panel.querySelector('.tp-resp-toggle').textContent='▼ View Response';}
  else{bodyEl.style.display='block';panel.dataset.open='1';panel.querySelector('.tp-resp-toggle').textContent='▲ Hide Response';}
}
// Run a single API from the tab view (not modal)
async function tpRunApiFromTab(p,acctIdx,apiIdx,btnEl){
  const api=STORE[p].thirdparty[acctIdx].apis[apiIdx];
  if(!api?.url){toast('No endpoint URL set for this API','err');return;}
  btnEl.disabled=true;btnEl.textContent='⏳';
  const badge=document.getElementById(`tp-tab-badge-${acctIdx}-${apiIdx}`);
  const respPanel=document.getElementById(`tp-resp-${acctIdx}-${apiIdx}`);
  if(badge){badge.style.display='inline';badge.textContent='⏳ Running…';badge.style.cssText='font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid;color:var(--inp);background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)';}
  try{
    const tabPayload={url:api.url,method:api.method==='OTHER'?'GET':api.method};
    if(api.headers&&Object.keys(api.headers).length)tabPayload.headers=api.headers;
    if(api.body!=null&&['POST','PUT','PATCH'].includes(api.method))tabPayload.body=typeof api.body==='string'?api.body:JSON.stringify(api.body);
    const resp=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},body:JSON.stringify(tabPayload)});
    const data=await resp.json();
    const ok=data.status>=200&&data.status<300;
    const statusOk=data.status>0&&!data.error;
    if(badge){
      badge.textContent=statusOk?(ok?`✓ ${data.status} OK`:`✕ ${data.status}`):(data.error?.includes('timed out')?'✕ Timeout':'✕ Unreachable');
      badge.style.cssText=`font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid;${(statusOk&&ok)?'color:var(--pass);background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.3)':'color:var(--fail);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2)'}`;
    }
    STORE[p].thirdparty[acctIdx].apis[apiIdx].lastRun={status:statusOk&&ok?'reachable':'unreachable',response:data,ts:new Date().toISOString()};
    saveToLS(p);
    // Update expandable panel
    if(respPanel){
      respPanel.style.display='block';
      respPanel.dataset.open='0';
      respPanel.innerHTML=`<button type="button" onclick="tpToggleResp('${acctIdx}','${apiIdx}')" class="tp-resp-toggle">▼ View Response</button><div id="tp-resp-body-${acctIdx}-${apiIdx}" style="display:none">${_tpFmtResp(data)}</div>`;
    }
  }catch(e){
    if(badge){badge.textContent='✕ Error';badge.style.cssText='font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid;color:var(--fail);background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.2)';}
    STORE[p].thirdparty[acctIdx].apis[apiIdx].lastRun={status:'unreachable',response:{status:0,statusText:'Error',body:'',timing:0,error:e.message},ts:new Date().toISOString()};
    saveToLS(p);
  }
  btnEl.disabled=false;btnEl.textContent='▶ Run';
}
// Run all APIs for an account from the tab view
async function tpRunAllFromTab(p,acctIdx,btnEl){
  btnEl.disabled=true;btnEl.textContent='⏳ Running…';
  const apis=STORE[p].thirdparty[acctIdx].apis||[];
  await Promise.all(apis.map((_,apiIdx)=>{
    const btn=document.getElementById(`tp-tab-run-${acctIdx}-${apiIdx}`);
    return tpRunApiFromTab(p,acctIdx,apiIdx,btn||btnEl);
  }));
  btnEl.disabled=false;btnEl.textContent='▶ Run All';
}

      bodyEl.innerHTML=`<div style="padding:10px 0">
        <div style="color:var(--fail);font-size:12px;font-weight:600;margin-bottom:6px">✕ ${escH(json.message||json.error||'Failed to load')}</div>
        ${json.fix?`<div style="padding:8px 12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:8px;font-size:11px;color:var(--txt);line-height:1.6">
          <strong style="color:#f59e0b">How to fix:</strong> ${escH(json.fix)}<br>
          Required: <code style="background:var(--card2);padding:1px 5px;border-radius:4px">GOOGLE_APPLICATION_CREDENTIALS_JSON</code>
          <code style="background:var(--card2);padding:1px 5px;border-radius:4px">FIREBASE_PROJECT_ID</code>
          <code style="background:var(--card2);padding:1px 5px;border-radius:4px">FIREBASE_PROJECT_NUMBER</code>
        </div>`:''}
      </div>`;
      return;
    }
    const d=json.data;
    const pq=d.primaryQuota||{};
    const sq=d.secondaryQuota||{};
    const statusKey=(d.status||'Normal').toLowerCase();
    const barColor=statusKey==='blocked'?'#ef4444':statusKey==='critical'?'#f97316':statusKey==='warning'?'#f59e0b':'#10b981';
    const mkBadge=(s)=>({
      normal:`<span style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✓ Normal</span>`,
      warning:`<span style="background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">⚠ Warning</span>`,
      critical:`<span style="background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">🔴 Critical</span>`,
      blocked:`<span style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✕ Blocked</span>`,
    })[(s||'normal').toLowerCase()]||`<span style="font-size:11px;color:var(--mut)">${escH(s)}</span>`;
    const fmt=n=>typeof n==='number'?n.toLocaleString():String(n??'—');
    const fmtK=n=>{if(typeof n!=='number')return'—';return n>=1000?(n/1000).toFixed(2)+'K':String(n);};
    const fmtDate=s=>{if(!s)return'—';try{return new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e2){return s;}};
    // Billing status chip
    const billingColor=d.billingStatus==='Active'?'#10b981':d.billingStatus==='Inactive'?'#ef4444':'var(--mut)';
    const billingBg=d.billingStatus==='Active'?'rgba(16,185,129,.1)':d.billingStatus==='Inactive'?'rgba(239,68,68,.08)':'rgba(99,102,241,.08)';
    const billingBorder=d.billingStatus==='Active'?'rgba(16,185,129,.3)':d.billingStatus==='Inactive'?'rgba(239,68,68,.3)':'rgba(99,102,241,.2)';
    const billingErrorNote=d.billingError?`<div style="font-size:10px;color:var(--mut);margin-top:3px;max-width:320px;word-break:break-word">Billing check failed: ${escH(d.billingError)}</div>`:'';
    const billingChip=`<div style="display:flex;flex-direction:column;align-items:flex-start"><span style="background:${billingBg};color:${billingColor};border:1px solid ${billingBorder};border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">${d.billingStatus==='Active'?'✓':'✕'} Billing: ${escH(d.billingStatus||'Unknown')}</span>${billingErrorNote}</div>`;
    // Phone auth chip
    const phoneColor=d.phoneAuthEnabled===true?'#10b981':d.phoneAuthEnabled===false?'#ef4444':'var(--mut)';
    const phoneBg=d.phoneAuthEnabled===true?'rgba(16,185,129,.1)':d.phoneAuthEnabled===false?'rgba(239,68,68,.08)':'rgba(99,102,241,.08)';
    const phoneBorder=d.phoneAuthEnabled===true?'rgba(16,185,129,.3)':d.phoneAuthEnabled===false?'rgba(239,68,68,.3)':'rgba(99,102,241,.2)';
    const phoneLabel=d.phoneAuthEnabled===true?'✓ Phone Auth: Enabled':d.phoneAuthEnabled===false?'✕ Phone Auth: Disabled':'? Phone Auth: Unknown';
    const phoneChip=`<span style="background:${phoneBg};color:${phoneColor};border:1px solid ${phoneBorder};border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">${phoneLabel}</span>`;
    // Quota bar helper
    const mkBar=(quota)=>{
      const pct=quota.usagePercentage||0;
      const bc=((quota.status||'').toLowerCase()==='blocked')?'#ef4444':((quota.status||'').toLowerCase()==='critical')?'#f97316':((quota.status||'').toLowerCase()==='warning')?'#f59e0b':'#10b981';
      return`<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:4px">
          <span style="font-weight:600;color:var(--txt)">${escH(quota.quotaName||'—')}</span>
          <span style="font-weight:700;color:${bc}">${pct.toFixed(2)}%</span>
        </div>
        <div style="height:8px;background:var(--card);border-radius:4px;overflow:hidden;border:1px solid var(--border)">
          <div style="height:100%;width:${Math.min(pct,100).toFixed(2)}%;background:${bc};border-radius:4px;transition:width .5s ease"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:3px">
          <span>Used: <strong style="color:var(--txt)">${fmtK(quota.currentUsage)}</strong> / ${fmtK(quota.dailyLimit)}</span>
          <span>Remaining: <strong style="color:var(--txt)">${fmtK(quota.remainingQuota)}</strong></span>
        </div>
        <div style="margin-top:3px">${mkBadge(quota.status)}</div>
      </div>`;
    };
    bodyEl.innerHTML=`
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${mkBadge(d.status)}
        ${billingChip}
        ${phoneChip}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px;margin-bottom:12px">
        <div><span style="color:var(--mut)">Project ID:</span> <strong style="color:var(--txt)">${escH(d.projectId||'—')}</strong></div>
        <div><span style="color:var(--mut)">Service:</span> <span style="color:var(--txt);font-size:10px">${escH(d.serviceName||'—')}</span></div>
        <div><span style="color:var(--mut)">Warning at:</span> <span style="color:#f59e0b;font-weight:700">${d.warningThreshold||75}%</span></div>
        <div><span style="color:var(--mut)">Critical at:</span> <span style="color:#f97316;font-weight:700">${d.criticalThreshold||90}%</span></div>
        <div style="grid-column:1/-1"><span style="color:var(--mut)">Last Checked:</span> <span style="color:var(--txt)">${fmtDate(d.lastCheckedTime)}</span></div>
      </div>
      <div style="padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px">Primary Quota</div>
        ${mkBar(pq)}
      </div>
      <div style="padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px">Secondary Quota</div>
        ${mkBar(sq)}
      </div>
      ${d.lastErrorCode?`
      <div style="padding:8px 12px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;margin-bottom:8px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#ef4444;margin-bottom:5px">Last OTP Error</div>
        <div style="font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
          <div><span style="color:var(--mut)">Code:</span> <code style="color:#ef4444;font-size:11px">${escH(d.lastErrorCode)}</code></div>
          <div><span style="color:var(--mut)">Time:</span> <span style="color:var(--txt)">${fmtDate(d.lastErrorTime)}</span></div>
          ${d.lastErrorMessage?`<div style="grid-column:1/-1"><span style="color:var(--mut)">Message:</span> <span style="color:var(--txt)">${escH(d.lastErrorMessage)}</span></div>`:''}
        </div>
      </div>`:'<div style="font-size:11px;color:var(--mut);margin-bottom:8px">No OTP errors recorded since last deploy.</div>'}
      <div style="padding:7px 10px;background:${statusKey==='blocked'?'rgba(239,68,68,.08)':statusKey==='critical'?'rgba(249,115,22,.08)':statusKey==='warning'?'rgba(245,158,11,.06)':'rgba(16,185,129,.06)'};border-radius:7px;border-left:3px solid ${barColor}">
        <span style="font-size:11px;color:var(--txt)">${escH(d.message||'')}</span>
      </div>`;
  }catch(e){
    bodyEl.innerHTML=`<div style="color:var(--fail);font-size:12px;padding:8px 0">✕ Error: ${escH(e.message)}</div>`;
  }
}

function _mmRenderCard(d,bodyEl){
  const statusKey=(d.status||'Normal').toLowerCase();
  const barColor=statusKey==='blocked'?'#ef4444':statusKey==='critical'?'#f97316':statusKey==='warning'?'#f59e0b':'#10b981';
  const mkBadge=(s)=>({
    normal:`<span style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✓ Normal</span>`,
    warning:`<span style="background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">⚠ Warning</span>`,
    critical:`<span style="background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">🔴 Critical</span>`,
    blocked:`<span style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✕ Blocked</span>`,
  })[(s||'normal').toLowerCase()]||`<span style="font-size:11px;color:var(--mut)">${escH(s)}</span>`;
  const mkHealthBadge=(s)=>{
    const sl=(s||'').toLowerCase();
    if(sl==='success')return`<span style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✓ Success</span>`;
    if(sl==='failed')return`<span style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✕ Failed</span>`;
    if(sl==='skipped')return`<span style="background:rgba(99,102,241,.08);color:var(--mut);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:2px 8px;font-size:11px">— Disabled</span>`;
    return`<span style="background:rgba(99,102,241,.08);color:var(--mut);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:2px 8px;font-size:11px">— Not Run</span>`;
  };
  const mkAvailBadge=(s)=>{
    const sl=(s||'').toLowerCase();
    if(sl==='available')return`<span style="color:#10b981;font-weight:700">✓ Available</span>`;
    if(sl==='not applicable')return`<span style="color:var(--mut)">— Not Applicable</span>`;
    if(sl.startsWith('available in'))return`<span style="color:#6366f1;font-weight:600">↗ ${escH(s)}</span>`;
    return`<span style="color:var(--mut)">— Not Available</span>`;
  };
  const fmtDate=s=>{if(!s)return'—';try{return new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e2){return s;}};
  // Credential chip
  const credColor=d.credentialStatus==='Valid'?'#10b981':d.credentialStatus==='Invalid'?'#ef4444':'var(--mut)';
  const credBg=d.credentialStatus==='Valid'?'rgba(16,185,129,.1)':d.credentialStatus==='Invalid'?'rgba(239,68,68,.08)':'rgba(99,102,241,.08)';
  const credBorder=d.credentialStatus==='Valid'?'rgba(16,185,129,.3)':d.credentialStatus==='Invalid'?'rgba(239,68,68,.3)':'rgba(99,102,241,.2)';
  const credErrorNote=d.credentialError?`<div style="font-size:10px;color:var(--mut);margin-top:3px;max-width:320px;word-break:break-word">Credential check failed: ${escH(d.credentialError)}</div>`:'';
  const credChip=`<div style="display:flex;flex-direction:column;align-items:flex-start"><span style="background:${credBg};color:${credColor};border:1px solid ${credBorder};border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">${d.credentialStatus==='Valid'?'✓':'✕'} Credentials: ${escH(d.credentialStatus||'Unknown')}</span>${credErrorNote}</div>`;
  // Billing type chip
  const btColor=d.billingType==='Prepaid'?'#6366f1':'var(--mut)';
  const btBg=d.billingType==='Prepaid'?'rgba(99,102,241,.1)':'rgba(99,102,241,.06)';
  const btBorder=d.billingType==='Prepaid'?'rgba(99,102,241,.3)':'rgba(99,102,241,.18)';
  const billingTypeChip=`<span style="background:${btBg};color:${btColor};border:1px solid ${btBorder};border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">💳 ${escH(d.billingType||'Unknown')}</span>`;
  // Credit balance block (prepaid only)
  const creditBlock=d.creditStatus==='Available'&&typeof d.creditBalance==='number'?`
    <div style="padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px">Credit Balance</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
        <span style="font-size:24px;font-weight:800;color:${barColor}">${d.creditBalance.toLocaleString()}</span>
        <span style="font-size:11px;color:var(--mut)">credits remaining</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--mut)">
        <span>⚠ Warning below: <strong style="color:#f59e0b">${d.warningCredits}</strong></span>
        <span>🔴 Critical below: <strong style="color:#f97316">${d.criticalCredits}</strong></span>
      </div>
    </div>`:'';
  // Health check section
  const hcStatus=d.smsApiHealth||'Not Run';
  const hcBlock=`
    <div style="padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:8px">SMS API Health Check</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${mkHealthBadge(hcStatus)}
        ${d.lastHealthCheckTime?`<span style="font-size:11px;color:var(--mut)">Last run: ${fmtDate(d.lastHealthCheckTime)}</span>`:'<span style="font-size:11px;color:var(--mut)">Not run yet — click 📤 Health Check button above</span>'}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px">
        <div><span style="color:var(--mut)">SMS API Health:</span> <strong style="color:var(--txt)">${escH(hcStatus)}</strong></div>
        <div><span style="color:var(--mut)">Message ID:</span> <span style="color:var(--txt);font-family:monospace;font-size:10px">${d.lastHealthCheckMessageId?escH(d.lastHealthCheckMessageId):'—'}</span></div>
        ${d.lastHealthCheckErrorCode?`<div style="grid-column:1/-1"><span style="color:var(--mut)">Error:</span> <code style="color:#ef4444;font-size:11px">${escH(d.lastHealthCheckErrorCode)}</code>${d.lastHealthCheckErrorMessage?` — <span style="color:var(--txt)">${escH(d.lastHealthCheckErrorMessage)}</span>`:''}</div>`:''}
      </div>
      ${!d.healthCheckEnabled?'<div style="margin-top:6px;font-size:11px;color:var(--mut)">Health check is disabled. Set MESSAGEMEDIA_HEALTH_CHECK_ENABLED=true in Railway to enable.</div>':''}
      ${d.healthCheckEnabled&&!d.healthCheckToNumber?'<div style="margin-top:6px;font-size:11px;color:#f59e0b">⚠ MESSAGEMEDIA_HEALTH_CHECK_TO_NUMBER is not set. Add a test phone number in Railway to enable health checks.</div>':''}
    </div>`;
  bodyEl.innerHTML=`
    <div style="display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${mkBadge(d.status)}
      ${credChip}
      ${billingTypeChip}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px;margin-bottom:12px">
      <div><span style="color:var(--mut)">Provider:</span> <strong style="color:var(--txt)">${escH(d.provider||'—')}</strong></div>
      <div><span style="color:var(--mut)">Portal:</span> <a href="${escH(d.portal||'#')}" target="_blank" style="color:var(--link);font-size:11px">${escH((d.portal||'').replace(/^https?:\/\//,''))}</a></div>
      <div><span style="color:var(--mut)">Source Number:</span> <strong style="color:var(--txt)">${escH(d.sourceNumber||'—')}</strong></div>
      <div><span style="color:var(--mut)">Source Status:</span> <span style="color:${d.sourceNumberStatus==='Configured'?'#10b981':'#ef4444'}">${escH(d.sourceNumberStatus||'—')}</span></div>
      <div><span style="color:var(--mut)">Credit Balance:</span> ${typeof d.creditBalance==='number'?`<strong style="color:var(--txt)">${d.creditBalance.toLocaleString()}</strong>`:mkAvailBadge(d.creditStatus)}</div>
      <div><span style="color:var(--mut)">Credit Expiry:</span> ${d.creditExpiryDate?`<strong style="color:var(--txt)">${escH(fmtDate(d.creditExpiryDate))}</strong>`:mkAvailBadge(d.creditExpiryStatus)}</div>
      <div><span style="color:var(--mut)">Next Payment:</span> ${d.nextPaymentDate?`<strong style="color:var(--txt)">${escH(fmtDate(d.nextPaymentDate))}</strong>`:mkAvailBadge(d.nextPaymentStatus)}</div>
      <div><span style="color:var(--mut)">Payment Check:</span> <span style="color:var(--mut);font-size:10px">Manual in Hub Billing</span></div>
      <div style="grid-column:1/-1"><span style="color:var(--mut)">Last Checked:</span> <span style="color:var(--txt)">${fmtDate(d.lastCheckedTime)}</span></div>
    </div>
    ${creditBlock}
    ${hcBlock}
    <div style="padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:7px;font-size:11px;color:var(--mut);margin-bottom:10px;line-height:1.5">
      <strong style="color:var(--txt)">Billing:</strong> ${escH(d.billingMessage||'—')}
    </div>
    ${d.lastErrorCode?`
    <div style="padding:8px 12px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#ef4444;margin-bottom:5px">Last SMS Error</div>
      <div style="font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
        <div><span style="color:var(--mut)">Code:</span> <code style="color:#ef4444;font-size:11px">${escH(d.lastErrorCode)}</code></div>
        <div><span style="color:var(--mut)">Time:</span> <span style="color:var(--txt)">${fmtDate(d.lastErrorTime)}</span></div>
        ${d.lastErrorMessage?`<div style="grid-column:1/-1"><span style="color:var(--mut)">Message:</span> <span style="color:var(--txt)">${escH(d.lastErrorMessage)}</span></div>`:''}
      </div>
    </div>`:'<div style="font-size:11px;color:var(--mut);margin-bottom:8px">No SMS errors recorded since last deploy.</div>'}
    <div style="padding:7px 10px;background:${statusKey==='blocked'?'rgba(239,68,68,.08)':statusKey==='critical'?'rgba(249,115,22,.08)':statusKey==='warning'?'rgba(245,158,11,.06)':'rgba(16,185,129,.06)'};border-radius:7px;border-left:3px solid ${barColor}">
      <span style="font-size:11px;color:var(--txt)">${escH(d.message||'')}</span>
    </div>`;
}

async function tpRefreshMessageMedia(p,acctIdx){
  const bodyEl=document.getElementById(`messagemedia-body-${p}-${acctIdx}`);
  if(!bodyEl)return;
  bodyEl.innerHTML='<div style="color:var(--mut);font-size:12px">⏳ Loading MessageMedia SMS status…</div>';
  try{
    const resp=await fetch('/api/messagemedia/status',{headers:{'Authorization':'Bearer '+_getToken()}});
    const json=await resp.json();
    if(!json.success){
      bodyEl.innerHTML=`<div style="padding:10px 0">
        <div style="color:var(--fail);font-size:12px;font-weight:600;margin-bottom:6px">✕ ${escH(json.message||json.error||'Failed to load')}</div>
        ${json.fix?`<div style="padding:8px 12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:8px;font-size:11px;color:var(--txt);line-height:1.6">
          <strong style="color:#f59e0b">How to fix:</strong> ${escH(json.fix)}<br>
          Required: <code style="background:var(--card2);padding:1px 5px;border-radius:4px">MESSAGEMEDIA_API_KEY</code>
          <code style="background:var(--card2);padding:1px 5px;border-radius:4px">MESSAGEMEDIA_API_SECRET</code>
          <code style="background:var(--card2);padding:1px 5px;border-radius:4px">MESSAGEMEDIA_SOURCE_NUMBER</code>
        </div>`:''}
      </div>`;
      return;
    }
    _mmRenderCard(json.data,bodyEl);
  }catch(e){
    bodyEl.innerHTML=`<div style="color:var(--fail);font-size:12px;padding:8px 0">✕ Error: ${escH(e.message)}</div>`;
  }
}

async function tpRunMessageMediaHealthCheck(p,acctIdx){
  const btn=document.getElementById(`mm-hc-btn-${p}-${acctIdx}`);
  const bodyEl=document.getElementById(`messagemedia-body-${p}-${acctIdx}`);
  if(btn){btn.disabled=true;btn.textContent='⏳ Sending…';}
  try{
    const resp=await fetch('/api/messagemedia/health-check',{method:'POST',headers:{'Authorization':'Bearer '+_getToken(),'Content-Type':'application/json'}});
    const json=await resp.json();
    if(resp.status===429){
      toast(json.message||'Health check rate limited — please wait before retrying.','warn');
      if(btn){btn.disabled=false;btn.textContent='📤 Health Check';}
      return;
    }
    if(!json.success){
      toast('Health check failed: '+(json.message||json.error||'Unknown error'),'err');
      if(btn){btn.disabled=false;btn.textContent='📤 Health Check';}
      // Still refresh the main card so the updated error state is visible
      tpRefreshMessageMedia(p,acctIdx);
      return;
    }
    toast('Health check SMS sent successfully!','ok');
    if(btn){btn.disabled=false;btn.textContent='📤 Health Check';}
    // Refresh card to show the new health check result
    tpRefreshMessageMedia(p,acctIdx);
  }catch(e){
    toast('Health check error: '+e.message,'err');
    if(btn){btn.disabled=false;btn.textContent='📤 Health Check';}
  }
}

async function tpRefreshTavus(p,acctIdx){
  const bodyEl=document.getElementById(`tavus-body-${p}-${acctIdx}`);
  if(!bodyEl)return;
  bodyEl.innerHTML='<div style="color:var(--mut);font-size:12px">⏳ Loading Tavus status…</div>';
  try{
    const resp=await fetch('/api/tavus/status',{headers:{'Authorization':'Bearer '+_getToken()}});
    const json=await resp.json();
    if(!json.success){
      bodyEl.innerHTML=`<div style="padding:10px 0">
        <div style="color:var(--fail);font-size:12px;font-weight:600;margin-bottom:6px">✕ ${escH(json.message||json.error||'Failed to load')}</div>
        ${json.fix?`<div style="padding:8px 12px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:8px;font-size:11px;color:var(--txt);line-height:1.6">
          <strong style="color:#f59e0b">How to fix:</strong> ${escH(json.fix)}<br>
          Required: <code style="background:var(--card2);padding:1px 5px;border-radius:4px">TAVUS_API_KEY</code>
        </div>`:''}
      </div>`;
      return;
    }
    const d=json.data;
    const statusKey=(d.status||'Normal').toLowerCase();
    const barColor=statusKey==='blocked'?'#ef4444':statusKey==='critical'?'#f97316':statusKey==='warning'?'#f59e0b':'#10b981';
    const mkBadge=(s)=>({
      normal:`<span style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✓ Normal</span>`,
      warning:`<span style="background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">⚠ Warning</span>`,
      critical:`<span style="background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">🔴 Critical</span>`,
      blocked:`<span style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✕ Blocked</span>`,
    })[(s||'normal').toLowerCase()]||`<span style="font-size:11px;color:var(--mut)">${escH(s)}</span>`;
    const mkHealthBadge=(s)=>{
      const sl=(s||'').toLowerCase();
      if(sl==='healthy'||sl==='success')return`<span style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✓ Healthy</span>`;
      if(sl==='rate limited')return`<span style="background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">⚡ Rate Limited</span>`;
      if(sl==='failed'||sl==='auth failed')return`<span style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">✕ ${escH(s)}</span>`;
      return`<span style="background:rgba(99,102,241,.08);color:var(--mut);border:1px solid rgba(99,102,241,.2);border-radius:10px;padding:2px 8px;font-size:11px">— ${escH(s||'Unknown')}</span>`;
    };
    const fmtDate=s=>{if(!s)return'—';try{return new Date(s).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e2){return s;}};
    const fmtNum=n=>typeof n==='number'?n.toLocaleString():'—';
    const warnPct=d.warningPercentage||75;
    const critPct=d.criticalPercentage||90;
    // Credential chip
    const credColor=d.credentialStatus==='Valid'?'#10b981':d.credentialStatus==='Invalid'?'#ef4444':'var(--mut)';
    const credBg=d.credentialStatus==='Valid'?'rgba(16,185,129,.1)':d.credentialStatus==='Invalid'?'rgba(239,68,68,.08)':'rgba(99,102,241,.08)';
    const credBorder=d.credentialStatus==='Valid'?'rgba(16,185,129,.3)':d.credentialStatus==='Invalid'?'rgba(239,68,68,.3)':'rgba(99,102,241,.2)';
    const apiErrNote=d.apiError?`<div style="font-size:10px;color:var(--mut);margin-top:3px;max-width:320px;word-break:break-word">API error: ${escH(d.apiError)}</div>`:'';
    const credChip=`<div style="display:flex;flex-direction:column;align-items:flex-start"><span style="background:${credBg};color:${credColor};border:1px solid ${credBorder};border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">${d.credentialStatus==='Valid'?'✓':'✕'} API Key: ${escH(d.credentialStatus||'Unknown')}</span>${apiErrNote}</div>`;
    const enterpriseBadge=d.enterprisePlan?`<span style="background:rgba(139,92,246,.12);color:#8b5cf6;border:1px solid rgba(139,92,246,.35);border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700">★ Enterprise</span>`:'';
    const hasUsage=d.usageStatus==='Available';
    // Render a single quota row — progress bar only for finite limits
    const mkQuotaRow=(item,unit)=>{
      if(!item||typeof item!=='object')return'';
      const label=item.label||'';
      const used=item.currentUsage;
      const limitVal=item.usageLimit; // 'Unlimited' or number
      const pct=item.usagePercentage; // null for Unlimited
      const notAllowed=item.isAllowed===false;
      const usedStr=typeof used==='number'?used.toLocaleString():'—';
      const limitStr=limitVal==='Unlimited'?'<span style="color:#8b5cf6;font-weight:700">Unlimited</span>'
        :(typeof limitVal==='number'?limitVal.toLocaleString()+(unit?` ${unit}`:'')
        :(limitVal!==null&&limitVal!==undefined?escH(String(limitVal)):'—'));
      const notAllowedNote=notAllowed?`<span style="margin-left:6px;color:#ef4444;font-size:10px;font-weight:700">✕ Not Allowed</span>`:'';
      if(pct!==null&&typeof pct==='number'){
        const bc=pct>=100?'#ef4444':pct>=critPct?'#f97316':pct>=warnPct?'#f59e0b':'#10b981';
        const barW=Math.min(100,pct);
        return`<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px">
            <span style="font-weight:600;color:var(--txt)">${escH(label)}${notAllowedNote}</span>
            <span style="font-weight:700;color:${bc}">${pct.toFixed(1)}%</span>
          </div>
          <div style="height:7px;background:var(--card);border-radius:4px;overflow:hidden;border:1px solid var(--border)">
            <div style="height:100%;width:${barW}%;background:${bc};border-radius:4px;transition:width .5s ease"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:3px">
            <span>Used: <strong style="color:var(--txt)">${usedStr}</strong> / ${limitStr}</span>
          </div>
        </div>`;
      }
      // Unlimited or no percentage — simple row
      return`<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--mut)">${escH(label)}${notAllowedNote}</span>
        <span style="color:var(--txt);font-weight:600">${usedStr} / ${limitStr}</span>
      </div>`;
    };
    // Quota keys in display order
    const QUOTA_KEYS=[
      {k:'conversation',unit:''},
      {k:'replica',unit:''},
      {k:'video',unit:''},
      {k:'concurrentConversations',unit:''},
      {k:'conversationLengthLimit',unit:'sec'},
    ];
    const quotaRows=QUOTA_KEYS.map(({k,unit})=>mkQuotaRow(d[k],unit)).join('');
    const quotaSection=hasUsage&&quotaRows?`
      <div style="padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px">Billing Quotas</div>
        ${quotaRows}
      </div>`:'';
    // Info box when usage is not available
    const usageUnavailBox=!hasUsage&&d.usageMessage?`
      <div style="padding:8px 12px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.2);border-radius:8px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start">
        <span style="font-size:13px;margin-top:1px">ℹ</span>
        <span style="font-size:11px;color:var(--mut);line-height:1.55">${escH(d.usageMessage)}</span>
      </div>`:'';
    bodyEl.innerHTML=`
      <div style="display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${mkBadge(d.status)}
        ${credChip}
        ${mkHealthBadge(d.apiHealth)}
        ${enterpriseBadge}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px;margin-bottom:12px">
        <div><span style="color:var(--mut)">Provider:</span> <strong style="color:var(--txt)">${escH(d.provider||'—')}</strong></div>
        <div><span style="color:var(--mut)">Portal:</span> <a href="${escH(d.portal||'#')}" target="_blank" style="color:var(--link);font-size:11px">${escH((d.portal||'').replace(/^https?:\/\//,''))}</a></div>
        <div><span style="color:var(--mut)">Plan:</span> <strong style="color:var(--txt)">${escH(d.planName||'Unknown')}</strong></div>
        ${d.limitType?`<div><span style="color:var(--mut)">Limit Type:</span> <strong style="color:var(--txt)">${escH(d.limitType)}</strong></div>`:''}
        <div><span style="color:var(--mut)">Usage Data:</span> <span style="color:${hasUsage?'#10b981':statusKey==='warning'?'#f59e0b':'var(--mut)'}">${escH(d.usageStatus||'—')}</span></div>
        <div><span style="color:var(--mut)">Warning at:</span> <span style="color:#f59e0b;font-weight:700">${warnPct}%</span></div>
        <div><span style="color:var(--mut)">Critical at:</span> <span style="color:#f97316;font-weight:700">${critPct}%</span></div>
        <div style="grid-column:1/-1"><span style="color:var(--mut)">Last Checked:</span> <span style="color:var(--txt)">${fmtDate(d.lastCheckedTime)}</span></div>
      </div>
      ${quotaSection}
      ${usageUnavailBox}
      ${d.lastErrorCode?`
      <div style="padding:8px 12px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;margin-bottom:8px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#ef4444;margin-bottom:5px">Last Tavus Error</div>
        <div style="font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
          <div><span style="color:var(--mut)">Code:</span> <code style="color:#ef4444;font-size:11px">${escH(d.lastErrorCode)}</code></div>
          <div><span style="color:var(--mut)">Time:</span> <span style="color:var(--txt)">${fmtDate(d.lastErrorTime)}</span></div>
          ${d.lastErrorMessage?`<div style="grid-column:1/-1"><span style="color:var(--mut)">Message:</span> <span style="color:var(--txt)">${escH(d.lastErrorMessage)}</span></div>`:''}
        </div>
      </div>`:'<div style="font-size:11px;color:var(--mut);margin-bottom:8px">No Tavus errors recorded since last deploy.</div>'}
      <div style="padding:7px 10px;background:${statusKey==='blocked'?'rgba(239,68,68,.08)':statusKey==='critical'?'rgba(249,115,22,.08)':statusKey==='warning'?'rgba(245,158,11,.06)':'rgba(16,185,129,.06)'};border-radius:7px;border-left:3px solid ${barColor}">
        <span style="font-size:11px;color:var(--txt)">${escH(d.message||'')}</span>
      </div>`;
  }catch(e){
    bodyEl.innerHTML=`<div style="color:var(--fail);font-size:12px;padding:8px 0">✕ Error: ${escH(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════════
// STATS
// ══════════════════════════════════════════════════════
function calcStats(p){
  const all=[...STORE[p].smoke,...STORE[p].prod].filter(r=>!r._pending);
  return{total:all.length,pass:all.filter(r=>r.status==='Pass').length,fail:all.filter(r=>r.status==='Fail').length,blocked:all.filter(r=>r.status==='Blocked').length,ns:all.filter(r=>r.status==='Not Started').length,inp:all.filter(r=>r.status==='In Progress').length};
}
function isReady(p){
  const s=calcStats(p);
  const critFail=STORE[p].smoke.some(r=>!r._pending&&r.priority==='Critical'&&(r.status==='Fail'||r.status==='Blocked'));
  const prodIssue=STORE[p].prod.some(r=>!r._pending&&(r.status==='Fail'||r.status==='Blocked'));
  return !critFail&&!prodIssue&&s.total>0&&s.pass===s.total;
}
function updateStats(p){
  const s=calcStats(p);const pct=s.total?Math.round(s.pass/s.total*100):0;const ready=isReady(p);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set(`${p}-total`,s.total);set(`${p}-pass`,s.pass);set(`${p}-fail`,s.fail);set(`${p}-blocked`,s.blocked);set(`${p}-ns`,s.ns);set(`${p}-pct`,pct+'%');
  const bar=document.getElementById(`${p}-pbar`);if(bar)bar.style.width=pct+'%';
  const rs=document.getElementById(`${p}-rstatus`);if(rs)rs.textContent=ready?'🟢 Release Ready':'🔴 Not Ready';
  const rb=document.getElementById(`${p}-rbanner`);if(rb)rb.className='rbanner '+(ready?'ready':'notready');
  const rp=document.getElementById(`${p}-rpct`);if(rp)rp.textContent=`${s.pass}/${s.total} passed`;
  }
function updateStatus(p,sec,i,sel){
  STORE[p][sec][i].status=sel.value;
  STORE[p][sec][i]._savedAt=Date.now();
  sel.className='ssel '+sel.value.replace(' ','-');
  sel.closest('tr').dataset.status=sel.value;
  updateStats(p);
  saveToLS(p);
  // refresh filter counts
  const body=document.getElementById(`${p}-${sec}-body`);
  if(body){
    const fbar=body.closest('.tbl-wrap').previousElementSibling;
    if(fbar&&fbar.classList.contains('fbar')){
      const data=STORE[p][sec];
      fbar.querySelectorAll('.fb').forEach(b=>{const f=b.dataset.f;b.textContent=f==='all'?`All (${data.length})`:f+' ('+data.filter(r=>r.status===f).length+')';});
    }
  }
}

function approveItem(p,pendIdx){
  const item=STORE[p].pending[pendIdx];if(!item)return;
  item.status='approved';
  if(item.type==='add'){
    // find and update the pending-flagged row
    const rowIdx=STORE[p][item.section].findIndex(r=>r._pending&&r._pendIdx===pendIdx);
    if(rowIdx>=0){STORE[p][item.section][rowIdx]={...item.newData,_pending:false,_pendIdx:undefined,_id:'r_'+Date.now().toString(36)};}
    else{STORE[p][item.section].push({...item.newData,_pending:false,_id:'r_'+Date.now().toString(36)});}
  }else if(item.type==='edit'){
    const rowIdx=item.originalIdx;
    if(rowIdx>=0&&STORE[p][item.section][rowIdx]){STORE[p][item.section][rowIdx]={...item.newData,_pending:false,_pendIdx:undefined};}
  }
  saveToLS(p);/* proj-nav removed */renderProject(p);updateStats(p);toast('Change approved ✓');
}
function rejectItem(p,pendIdx){
  const item=STORE[p].pending[pendIdx];if(!item)return;
  item.status='rejected';
  if(item.type==='add'){
    // remove the pending-flagged placeholder row
    const rowIdx=STORE[p][item.section].findIndex(r=>r._pending&&r._pendIdx===pendIdx);
    if(rowIdx>=0)STORE[p][item.section].splice(rowIdx,1);
  }else if(item.type==='edit'){
    // revert the pending flag on original row
    const rowIdx=item.originalIdx;
    if(rowIdx>=0&&STORE[p][item.section][rowIdx]){STORE[p][item.section][rowIdx]._pending=false;STORE[p][item.section][rowIdx]._pendIdx=undefined;}
  }
  saveToLS(p);/* proj-nav removed */renderProject(p);toast('Change rejected');
}
// inline approve/reject from table row
function approveRow(p,sec,i){
  const row=STORE[p][sec][i];if(!row)return;
  const pendIdx=row._pendIdx;
  if(pendIdx!==undefined)approveItem(p,pendIdx);
  else{row._pending=false;saveToLS(p);renderProject(p);toast('Approved');}
}
function rejectRow(p,sec,i){
  const row=STORE[p][sec][i];if(!row)return;

}

function saveState(p){

  // Deep-copy current data into snapshot BEFORE resetting
  const snap={
    id:'rpt_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    datetime:now.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})+' '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),

    smoke:JSON.parse(JSON.stringify(STORE[p].smoke)),
    prod:JSON.parse(JSON.stringify(STORE[p].prod)),

    releaseNotes:JSON.parse(JSON.stringify(STORE[p].releaseNotes||[])),
    taskchecklist:JSON.parse(JSON.stringify(STORE[p].taskchecklist||[]))
  };
  STORE[p].reports.push(snap);
  // Reset ALL mutable fields on every non-pending row — status, comment, owner
  STORE[p].smoke.forEach(r=>{if(!r._pending){r.status='Not Started';r.comment='';r.owner='';}});
  STORE[p].prod.forEach(r=>{if(!r._pending){r.status='Not Started';r.comment='';r.owner='';}});

  if(Array.isArray(STORE[p].taskchecklist)){

    }));

  }

}
// ── SERVER-FIRST STORAGE ──
// _serverData mirrors MongoDB data loaded via /api/qa-data on startup.
// All reads come from here; all writes persist directly to MongoDB.
let _serverData={};
let _sseSource=null;
// Unique ID for this browser tab — server echoes it back so we can skip our own SSE events
const MY_CLIENT_ID='client_'+Date.now()+'_'+Math.random().toString(36).slice(2);

// ── SAVE STATUS INDICATOR ──
// Shows "✓ Saved", "⏳ Saving…", or "❌ Failed – Tap to retry" in top bar badge
let _activeSaves=0; // count of in-flight save calls
let _pendingRetries={}; // key → {key,value,retries}
let _savingClearTimer=null; // FIX D: force-clear "Saving..." after 5s if stuck

function _setSaveStatus(state,msg){
  const el=document.getElementById('save-status-badge');
  if(!el)return;
  el.className='save-status-badge save-status-'+state;
  el.textContent=msg;
  el.onclick=state==='error'?()=>_retryAllFailed():null;
}
function _retryAllFailed(){
  const pending=Object.values(_pendingRetries);
  if(!pending.length)return;
  _pendingRetries={};
  pending.forEach(p=>_doServerPost(p.key,p.value,3));
}
function _updateSaveStatusBadge(){
  if(_activeSaves>0){
    _setSaveStatus('saving','⏳ Saving…');
  } else if(Object.keys(_pendingRetries).length>0){
    _setSaveStatus('error','❌ Failed – Tap to retry');
  } else {
    _setSaveStatus('idle','✓ Saved');
  }
}

// POST to server — updates in-memory mirror immediately, retries up to 3× with backoff
function serverPost(key,value){
  // Block qa3_ project saves until server data has been successfully loaded.
  // Without this guard, empty-initialized STORE arrays wipe real MongoDB data.
  if(!_serverDataLoaded && key.startsWith('qa3_')){console.warn('[serverPost] blocked pre-load save for',key);return;}
  _serverData[key]=value; // update mirror immediately for instant UI reads
  // Deep-snapshot the value NOW so _replaceArrays and array contents are captured
  // before the caller deletes the flag or mutates the object (async fetch reads value later).
  const snapshot=JSON.parse(JSON.stringify(value));
  _doServerPost(key,snapshot,3);
}
async function _doServerPost(key,value,retriesLeft){
  _activeSaves++;
  _updateSaveStatusBadge();
  try{
    const r=await fetch('/api/qa-data/'+encodeURIComponent(key),{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},
      // FIX A: include clientId so server echoes it back in SSE — we skip our own events
      body:JSON.stringify({value,_clientId:MY_CLIENT_ID})
    });
    if(r.ok){
      const j=await r.json().catch(()=>({}));
      // FIX B+C: server returns mergedValue — use it directly, no extra re-fetch needed.
      // Update heartbeat hashes BEFORE touching STORE so next tick sees no change.
      const mv=j.mergedValue;
      if(mv!==undefined){
        _serverData[key]=mv;
        if(key==='qa3_daily_tasks'){
          // Server confirmed save — only clear pending flags for the rows that were in
          // the sent payload (not all rows), then merge server response respecting any
          // newer local edits made while the save was in-flight.
          if(Array.isArray(value))value.forEach(t=>{if(t.projectId&&t.date)_dtPendingSave.delete(t.projectId+'|'+t.date);});
          _mergeSseDailyTasks(Array.isArray(mv)?mv:[]);
          _lastHbDtHash=JSON.stringify(DAILY_TASKS); // hash after merge
        } else if(key==='qa3_team_tasks'){
          _lastHbTtHash=JSON.stringify(mv);
          TEAM_TASKS=mv;
        } else if(key==='qa3_releases'){
          _lastHbRlHash=JSON.stringify(mv);
          RELEASES=mv;
        } else if(key.startsWith('qa3_')&&mv&&typeof mv==='object'&&!Array.isArray(mv)){
          const pid=key.replace('qa3_','');
          if(STORE[pid]){
            // Server's mergedValue is authoritative — fully replace STORE arrays with server versions.
            // This prevents stale browser STORE from being re-saved by the next heartbeat.
            // Only replace arrays present in mv; preserve local fields not returned by server.
            const FULL_REPLACE_KEYS=['smoke','prod','reports','credentials','thirdparty',
              'feedback','apitests','pendingtasks','taskchecklist','testdata','releaseNotes','wfdocs'];
            FULL_REPLACE_KEYS.forEach(k=>{
              if(mv[k]!==undefined&&mv[k]!==null){
                STORE[pid][k]=Array.isArray(mv[k])?mv[k]:STORE[pid][k];
              }
            });
            if(mv.envDetails&&typeof mv.envDetails==='object'){
              STORE[pid].envDetails=mv.envDetails;
            }
            _deduplicateStoreProject(STORE[pid]);
            // Hash updated from server state — next heartbeat sees no change, no re-save of stale data
            _lastHbStoreHash[pid]=JSON.stringify(STORE[pid]);
          }
        }
      }
      delete _pendingRetries[key];
      _activeSaves=Math.max(0,_activeSaves-1);
      _updateSaveStatusBadge();
    } else if(r.status===401){
      _activeSaves=Math.max(0,_activeSaves-1);
      window.location.href='/';
    } else {
      throw new Error('HTTP '+r.status);
    }
  }catch(e){
    _activeSaves=Math.max(0,_activeSaves-1);
    if(retriesLeft>0){
      const delay=retriesLeft===3?1500:retriesLeft===2?3000:6000;
      _pendingRetries[key]={key,value,retries:retriesLeft-1};
      _updateSaveStatusBadge();
      setTimeout(()=>_doServerPost(key,value,retriesLeft-1),delay);
    } else {
      _pendingRetries[key]={key,value,retries:0};
      _updateSaveStatusBadge();
      console.error('[save] Failed to save key',key,'after all retries:',e.message);
    }
  }
}

let _sseReconnectDelay=1000; // exponential backoff: 1s→2s→4s→8s→16s→30s max
let _sseReconnectTimer=null;

// SSE grace period: ignore data events for 3s after connect to suppress startup noise
let _sseConnectedAt=0;
const _SSE_GRACE_MS=3000;
// Toast cooldown: don't show "updated live" toast more than once per 8s
let _lastSseToast={};
function _sseToastCooldown(key){
  const now=Date.now();
  if(now-(_lastSseToast[key]||0)<8000)return false;
  _lastSseToast[key]=now;return true;
}

function initSseListener(){
  clearTimeout(_sseReconnectTimer);
  if(_sseSource){_sseSource.close();_sseSource=null;}
  const token=_getToken();
  // EventSource can't send Authorization header — pass token as query param
  const url='/api/events'+(token?'?token='+encodeURIComponent(token):'');
  _sseSource=new EventSource(url);

  _sseSource.addEventListener('connected',e=>{
    try{
      const d=JSON.parse(e.data);
      // Server sends back our clientId — use it for echo-filtering
      if(d.clientId)window._SSE_CLIENT_ID=d.clientId;
      console.log('[sse] connected as',d.userName,'clientId=',d.clientId);
    }catch(_){}
    _sseConnectedAt=Date.now(); // mark connect time for grace period
    _sseReconnectDelay=1000; // reset backoff on successful connect
    _setSyncDot('green','Live');
    // Poll active user count once on connect
    _pollActiveUsers();
  });

  _sseSource.addEventListener('qa-data-update',e=>{
    try{
      const {key,value,sourceClientId}=JSON.parse(e.data);
      // Skip own events (use both client-side MY_CLIENT_ID and server-assigned _SSE_CLIENT_ID)
      // sourceClientId is MY_CLIENT_ID (sent in serverPost body)
      // _SSE_CLIENT_ID is the server-assigned SSE connection ID — different value
      // Check both so own saves are always filtered regardless of which ID was used
      if(sourceClientId&&(sourceClientId===MY_CLIENT_ID||sourceClientId===window._SSE_CLIENT_ID))return;
      // Grace period: ignore data events in the first 3s after connect (startup noise)
      if(_sseConnectedAt&&Date.now()-_sseConnectedAt<_SSE_GRACE_MS){
        console.log('[sse] grace period — ignoring startup event for key:',key);return;
      }
      if(_pendingRetries[key])console.warn('[sse] conflict: remote update for key',key,'— remote wins');
      _serverData[key]=value;
      _applySseUpdate(key,value);
    }catch(_){}
  });

  _sseSource.addEventListener('qa-data-delete',e=>{
    try{const {key}=JSON.parse(e.data);delete _serverData[key];}catch(_){}
  });

  // Real-time user list updates
  _sseSource.addEventListener('qa-users-update',e=>{
    try{
      const {action,user,userId,updates}=JSON.parse(e.data);
      if(action==='add'&&user){
        _teamMembersCache.push(user);
        _teamMembersCache.sort((a,b)=>a.name.localeCompare(b.name));
      } else if((action==='update'||action==='deactivate')&&userId){
        const idx=_teamMembersCache.findIndex(u=>u.id===userId);
        if(idx>=0){
          if(action==='deactivate')_teamMembersCache[idx].isActive=false;
          else if(updates)Object.assign(_teamMembersCache[idx],updates);
        }
      }
      // Refresh users modal if it's currently open
      const _um=document.getElementById('users-overlay-modal');
      if(_um&&_um.style.display!=='none')renderUsersModal();
    }catch(_){}
  });

  _sseSource.onerror=()=>{
    _sseSource.close();_sseSource=null;
    _setSyncDot('yellow','Reconnecting');
    console.warn('[sse] disconnected — reconnecting in',_sseReconnectDelay,'ms');
    _sseReconnectTimer=setTimeout(()=>{
      _sseReconnectDelay=Math.min(_sseReconnectDelay*2,30000);
      initSseListener();
    },_sseReconnectDelay);
  };
}
