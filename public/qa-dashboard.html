// Merge an incoming SSE project snapshot into STORE[pid] without clobbering in-flight local edits.
// Arrays are merged by id (incoming wins for matching id). Scalar fields replaced by incoming.
// Fields where an empty incoming SSE array must not overwrite non-empty local data.
// (Protects against stale/partial server responses on startup or reconnect.)
// When the server sends a non-empty array, it is always authoritative — use it directly.
const _SSE_NEVER_WIPE=new Set(['credentials','thirdparty','wfdocs','pendingtasks','apitests','reports']);
function _mergeSseProjectIntoStore(pid,incoming){
  const ex=STORE[pid];
  if(!ex||!incoming||typeof incoming!=='object')return;
  for(const key of Object.keys(incoming)){
    const inVal=incoming[key];
    if(inVal===null||inVal===undefined)continue;
    if(_PROJ_ARRAY_KEYS.includes(key)&&Array.isArray(inVal)){
      // Empty incoming on protected fields = stale/partial update, skip it
      if(_SSE_NEVER_WIPE.has(key)&&inVal.length===0&&(ex[key]||[]).length>0)continue;
      // Non-empty incoming = server's authoritative merged state after a delete/add.
      // Replace directly — Map-merge would resurrect deleted items by keeping old ids.
      if(inVal.length>0){ex[key]=inVal;continue;}
      // Empty incoming on non-protected field = server cleared it intentionally
      ex[key]=inVal;
    }else if(key==='envDetails'&&inVal&&typeof inVal==='object'){
      ex.envDetails=ex.envDetails||{production:[],staging:[]};
      ['production','staging'].forEach(side=>{
        if(!Array.isArray(inVal[side]))return;
        // Empty = skip (stale); non-empty = server authoritative
        if(inVal[side].length===0&&(ex.envDetails[side]||[]).length>0)return;
        ex.envDetails[side]=inVal[side];
      });
    }else{
      ex[key]=inVal;
    }
  }
}

function _applySseUpdate(key,value){
  // Don't clobber an input the user is actively typing in
  const ae=document.activeElement;
  const userTyping=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable);
  if(key==='qa3_daily_tasks'){
    // Use merge instead of full replace — preserves locally-edited tasks not yet confirmed by server
    _mergeSseDailyTasks(value);
    if(curView==='dailytasks'&&!userTyping){
      // Surgical update: re-render only the day tables that actually changed,
      // preserving scroll position and week open/collapse state.
      // Find which dates changed and re-render only those day containers.
      const changedDates=new Set((Array.isArray(value)?value:[]).map(t=>t.date).filter(Boolean));
      if(changedDates.size>0){
        changedDates.forEach(ds=>{
          const bodyEl=document.getElementById('dt-daybody-'+ds);
          if(bodyEl){
            // Re-render only the table rows inside this day's body container
            dtEnsureProjectRows(ds);
            const tasks=DAILY_TASKS.filter(t=>t.date===ds);
            tasks.sort((a,b)=>{const na=dtProjName(a.projectId).toLowerCase(),nb=dtProjName(b.projectId).toLowerCase();return na<nb?-1:na>nb?1:0;});
            const rows=tasks.map(t=>{
              const tidx=DAILY_TASKS.indexOf(t);
              const pColor=dtProjColor(t.projectId);
              const pName=dtProjName(t.projectId);
              return`<tr><td class="col-project"><span class="dt-proj-badge" style="background:${pColor}18;color:${pColor};border:1px solid ${pColor}44"><span class="dt-proj-dot" style="background:${pColor}"></span>${escH(pName)}</span></td>${DT_COLS.map(c=>`<td>${dtCellSelect(tidx,c.key,t[c.key]||'')}</td>`).join('')}<td>${dtAssignedSelect(tidx,t.assignedBy||'')}</td></tr>`;
            }).join('');
            const tbl=bodyEl.querySelector('table tbody');
            if(tbl)tbl.innerHTML=rows;
            else bodyEl.innerHTML=`<table class="dt-table"><thead><tr><th class="col-project">Project</th>${DT_COLS.map(c=>`<th>${escH(c.label)}</th>`).join('')}<th>ASSIGNED TO</th></tr></thead><tbody>${rows}</tbody></table>`;
          }
        });
      } else {
        // Unknown dates — full re-render as fallback (won't cause navigation)
        renderDailyTasksPage();
      }
    } else if(curView!=='dailytasks') {
      // Only show toast with cooldown — prevents repeated toasts on startup
      if(_sseToastCooldown('dt'))toast('📡 Daily tasks updated live');
    }
  }else if(key==='qa3_team_tasks'){
    loadTeamTasks();
    if(curView!=='teamtasks'){if(_sseToastCooldown('tt'))toast('📡 Team tasks updated live');}
    else if(!userTyping) renderTeamTasksPage();
  }else if(key==='qa3_releases'){
    loadReleases();
  }else if(key==='qa_users'){
    initUsers();
    // Users is a modal now — refresh it if open, no page navigation
    {const _um=document.getElementById('users-overlay-modal');if(_um&&_um.style.display!=='none'&&!userTyping)renderUsersModal();}
  }else if(key==='qa3_projects'){
    // Another user added/removed/edited a project — update PROJECTS and re-render grid
    if(Array.isArray(value)&&value.length>0){
      const serverById=new Map(value.filter(p=>p&&p.id&&p.name).map(p=>[p.id,p]));
      // Keep hardcoded defaults for built-ins not in the incoming list
      DEFAULT_PROJ.forEach(d=>{if(!serverById.has(d.id))serverById.set(d.id,d);});
      PROJECTS=Array.from(serverById.values()).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      // Ensure STORE entries exist for any newly added projects
      PROJECTS.forEach(p=>{
        if(!STORE[p.id])STORE[p.id]={env:mkEnv(p),gates:[...DEFAULT_GATES],smoke:mkSmoke(p.id),prod:mkProd(p.id),testdata:[],releaseNotes:[],reports:[],pending:[],credentials:[],wfdocs:[],envDetails:{production:[],staging:[]}};
      });
    }
    if(curView==='home'&&typeof renderProjectGrid==='function')renderProjectGrid();
    if(_sseToastCooldown('proj'))toast('📡 Projects updated live');
    return; // handled — skip the generic qa3_ branch and the final renderProjectGrid below
  }else if(key.startsWith('qa3_')){
    const pid=key.replace('qa3_','');
    if(STORE[pid]&&value&&typeof value==='object'&&!Array.isArray(value)){
      // Full-replace authoritative arrays from server — same as mergedValue handling
      const FULL_REPLACE_KEYS=['smoke','prod','reports','credentials','thirdparty',
        'feedback','apitests','pendingtasks','taskchecklist','testdata','releaseNotes','wfdocs'];
      FULL_REPLACE_KEYS.forEach(k=>{
        if(value[k]!==undefined&&value[k]!==null&&Array.isArray(value[k])){
          // Only replace if incoming is non-empty OR field is not protected
          const _PROTECTED=new Set(['credentials','thirdparty','wfdocs','pendingtasks','apitests','reports']);
          if(value[k].length>0||!_PROTECTED.has(k)) STORE[pid][k]=value[k];
        }
      });
      if(value.envDetails&&typeof value.envDetails==='object'){
        ['production','staging'].forEach(side=>{
          if(Array.isArray(value.envDetails[side])&&(value.envDetails[side].length>0||(STORE[pid].envDetails?.[side]||[]).length===0)){
            if(!STORE[pid].envDetails)STORE[pid].envDetails={production:[],staging:[]};
            STORE[pid].envDetails[side]=value.envDetails[side];
          }
        });
      }
      _deduplicateStoreProject(STORE[pid]);
      // Update hash so heartbeat doesn't re-save the old stale state
      _lastHbStoreHash[pid]=JSON.stringify(STORE[pid]);
    }
    if(curView==='project'&&curProj===pid&&!userTyping&&(curTab[pid]||'')!=='swagger'){
      renderProject(pid);
      // Flash highlight on all visible rows to indicate live update
      setTimeout(()=>{
        document.querySelectorAll('tr[data-idx]').forEach(r=>{
          r.classList.remove('row-live-update');
          void r.offsetWidth; // force reflow
          r.classList.add('row-live-update');
          setTimeout(()=>r.classList.remove('row-live-update'),1200);
        });
      },50);
      const pname=PROJECTS.find(p=>p.id===pid)?.name||pid;
      const tab=curTab[pid]||'';
      const tabLabel={smoke:'Smoke Tests',prod:'Prod Checklist',credentials:'Credentials',feedback:'Client Feedback',thirdparty:'Third Party',taskchecklist:'Task Checklist',pendingtasks:'Pending Tasks',releasenotes:'Release Notes',projoverview:'Overview',wfdocs:'Workflow Docs'}[tab]||tab;
      if(_sseToastCooldown('proj_'+pid))toast(`📡 ${pname}${tabLabel?' — '+tabLabel:''} updated live`);
    }
  }
  // Only refresh project grid if currently on home view — never navigate away from other views
  if(curView==='home'&&typeof renderProjectGrid==='function')renderProjectGrid();
}

let _serverDataLoaded=false; // guard: never save until server data has been fetched at least once
async function loadFromServer(){
  try{
    const r=await fetch('/api/qa-data',{cache:'no-store',headers:{Authorization:'Bearer '+_getToken()}});
    // On auth failure (401/403) — do NOT proceed, saves must stay blocked
    if(r.status===401||r.status===403){console.warn('[loadFromServer] auth failed ('+r.status+') — saves blocked');return;}
    if(!r.ok){console.warn('[loadFromServer] server error ('+r.status+') — saves blocked');return;}
    _serverData=await r.json();
    _serverDataLoaded=true;
    // Clear stale qa3_ keys from localStorage — they may have old data (duplicate reports,
    // deleted rows) that migrateLocalStorageToServer would re-post back to the server.
    // Server is always the source of truth after a successful load.
    try{
      const toRemove=[];
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&(k.startsWith('qa3_')||k==='qa3_daily_tasks'||k==='qa3_team_tasks'||k==='qa3_releases'))toRemove.push(k);
      }
      toRemove.forEach(k=>localStorage.removeItem(k));
    }catch(_){}
    // Strip any legacy base64 wfdoc blobs to keep memory clean
    for(const k of Object.keys(_serverData)){
      if(k.startsWith('qa3_')&&_serverData[k]&&_serverData[k].wfdocs){
        _serverData[k].wfdocs=(_serverData[k].wfdocs||[]).map(d=>{const c={...d};delete c.data;return c;});
      }
    }
  }catch(e){}
}

function saveToLS(p){
  // Never post to server before loadFromServer has successfully completed — prevents
  // empty-initialized STORE arrays from overwriting real MongoDB data on auth failure.
  if(!_serverDataLoaded){console.warn('[saveToLS] blocked — server data not yet loaded, skipping post for',p);return;}
  _serverData['qa3_'+p]=STORE[p];
  serverPost('qa3_'+p,STORE[p]);
}
function saveAllState(){
  PROJECTS.forEach(p=>saveToLS(p.id));
  _serverData['qa3_projects']=PROJECTS;
  serverPost('qa3_projects',PROJECTS);
}

// ── DAILY TASKS GLOBAL STATE ──
let DAILY_TASKS=[];
// Track tasks that have been modified locally but not yet confirmed saved by server.
// SSE updates from other users must not overwrite these pending local changes.
const _dtPendingSave=new Map(); // key: 'projectId|date' → timestamp of last local edit

function saveDailyTasks(){
  // Only stamp rows that are locally pending (recently edited by this user).
  // Stamping ALL rows overwrites other users' fresher _savedAt timestamps.
  const now=Date.now();
  DAILY_TASKS.forEach(t=>{
    const k=t.projectId+'|'+t.date;
    if(_dtPendingSave.has(k))t._savedAt=now;
  });
  _serverData['qa3_daily_tasks']=DAILY_TASKS;
  serverPost('qa3_daily_tasks',DAILY_TASKS);
}
function loadDailyTasks(){
  const all=_serverData['qa3_daily_tasks']||[];
  // Build set of real project IDs — never show rows for 'global' or unknown projects
  const realIds=new Set(PROJECTS.map(p=>p.id));
  const filtered=realIds.size>0?all.filter(t=>t.projectId&&realIds.has(t.projectId)):all.filter(t=>t.projectId&&t.projectId!=='global');
  // Deduplicate by projectId+date — keep the last entry (most recent save wins)
  const seen=new Map();
  filtered.forEach(t=>{const k=t.projectId+'|'+t.date;seen.set(k,t);});
  DAILY_TASKS=Array.from(seen.values());
}
// Merge incoming SSE daily tasks.
// Server array is authoritative — deleted rows (not in incoming) are removed.
// Exception: locally-pending rows (edited within GRACE window) override server version
// for their specific key, but are NOT kept if server omitted them (deletion wins).
function _mergeSseDailyTasks(incomingArr){
  if(!Array.isArray(incomingArr))return;
  const now=Date.now();
  const GRACE=60000;
  // Build incoming map — this is the server's authoritative state
  const incomingByKey=new Map();
  incomingArr.forEach(t=>{incomingByKey.set(t.projectId+'|'+t.date,t);});
  // Start from incoming (server authoritative), override with local pending edits
  const result=new Map(incomingByKey);
  DAILY_TASKS.forEach(t=>{
    const k=t.projectId+'|'+t.date;
    const pendingTs=_dtPendingSave.get(k)||0;
    const isLocallyPending=pendingTs>0&&(now-pendingTs)<GRACE;
    // Only keep local version if: (a) still pending AND (b) server ALSO has this row
    // If server dropped the row (deletion), don't resurrect it even if locally pending
    if(isLocallyPending&&incomingByKey.has(k)){
      result.set(k,t); // local edit wins for this key
    }
  });
  const merged=Array.from(result.values());
  _serverData['qa3_daily_tasks']=merged;
  const realIds=new Set(PROJECTS.map(p=>p.id));
  const seen=new Map();
  merged.filter(t=>t.projectId&&(realIds.size===0||realIds.has(t.projectId))&&t.projectId!=='global')
    .forEach(t=>{seen.set(t.projectId+'|'+t.date,t);});
  DAILY_TASKS=Array.from(seen.values());
}

// Pull wfdocs file metadata from server for all projects — server is the single source of truth.
// The server already deduplicates by name (keeping the entry with serverId/ghUrl preferred).
// We replace STORE entirely so legacy entries stored in qa-shared are not double-counted.
async function syncWfDocsFromServer(){
  try{
    await Promise.all(PROJECTS.map(async proj=>{
      try{
        const r=await fetch('/api/wfdocs/'+encodeURIComponent(proj.id),{cache:'no-store',headers:{Authorization:'Bearer '+_getToken()}});
        if(!r.ok)return;
        const serverFiles=await r.json();
        if(!Array.isArray(serverFiles))return;
        // Server is authoritative — replace wfdocs array only, no mirror update
        // (updating _serverData here triggers SSE broadcast → render loop)
        if(STORE[proj.id])STORE[proj.id].wfdocs=serverFiles.map(sf=>({name:sf.name,size:sf.size||0,uploadedAt:sf.uploadedAt||'',serverId:sf.fileId||sf.serverId||null}));
      }catch(e){}
    }));
  }catch(e){}
}

function loadAllState(){
  // Load from server mirror (_serverData populated by loadFromServer())
  const cp=_serverData['qa3_projects'];
  if(cp&&Array.isArray(cp)&&cp.length>0){
    // Server projects win (have latest data); defaults fill gaps for built-ins not in MongoDB
    const serverById=new Map(cp.filter(p=>p&&p.id&&p.name).map(p=>[p.id,p]));
    DEFAULT_PROJ.forEach(d=>{if(!serverById.has(d.id))serverById.set(d.id,d);});
    // Sort alphabetically by name — deduplicated by id (Map guarantees uniqueness)
    PROJECTS=Array.from(serverById.values()).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  } else {
    // No server data yet — use defaults sorted alphabetically
    PROJECTS=[...DEFAULT_PROJ].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  }
  initStore();
  PROJECTS.forEach(p=>{
    const d=_serverData['qa3_'+p.id];

  });
  loadDailyTasks();
  loadDayMeta();
  loadTeamTasks();
  loadReleases();
  // Check for auto-transitions after any full data reload (deferred so UI is ready)
  setTimeout(()=>rlCheckAutoTransitions(), 1500);

// SVG DONUT CHART (report colors — light theme)
// ══════════════════════════════════════════════════════
function svgDonut(pass,fail,blk,inp,ns,total,sz=180){
  if(!total)return`<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="60" fill="none" stroke="#e2e8f0" stroke-width="22"/></svg>`;
  const r=60,cx=sz/2,cy=sz/2,sw=22,C=2*Math.PI*r;
  const segs=[{v:pass,c:'#10b981'},{v:fail,c:'#ef4444'},{v:blk,c:'#f59e0b'},{v:inp,c:'#3b82f6'},{v:ns,c:'#cbd5e1'}].filter(s=>s.v>0);
  let acc=0,paths=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f1f5f9" stroke-width="${sw}"/>`;
  for(const s of segs){const len=(s.v/total)*C;paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw-2}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(C*.25).toFixed(2)}" transform="rotate(${acc},${cx},${cy})"/>`;acc+=(s.v/total)*360;}
  const pct=Math.round(pass/total*100);
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="#1e293b">${pct}%</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#64748b" font-weight="500">Pass Rate</text></svg>`;
}

// REPORT GENERATION
// ══════════════════════════════════════════════════════
function buildReport(p,snap){
  const pname=PROJECTS.find(x=>x.id===p)?.name||p;
  const smoke=snap?snap.smoke:STORE[p].smoke;
  const prod=snap?snap.prod:STORE[p].prod;
  const env=snap?snap.env:STORE[p].env;
  const gates=snap?snap.gates:STORE[p].gates;
  const td=snap?snap.testdata:STORE[p].testdata||[];
  const rns=snap?snap.releaseNotes:STORE[p].releaseNotes||[];
  const cleanSmoke=smoke.filter(r=>!r._pending),cleanProd=prod.filter(r=>!r._pending);
  const all=[...cleanSmoke,...cleanProd];
  const s={total:all.length,pass:all.filter(r=>r.status==='Pass').length,fail:all.filter(r=>r.status==='Fail').length,blk:all.filter(r=>r.status==='Blocked').length,ns:all.filter(r=>r.status==='Not Started').length,inp:all.filter(r=>r.status==='In Progress').length};
  const pct=s.total?Math.round(s.pass/s.total*100):0;
  const critFail=cleanSmoke.some(r=>r.priority==='Critical'&&(r.status==='Fail'||r.status==='Blocked'));
  const prodIssue=cleanProd.some(r=>r.status==='Fail'||r.status==='Blocked');
  const ready=!critFail&&!prodIssue&&pct===100;
  const now=snap?snap.datetime:new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  // Report color constants
  const RC={pass:'#10b981',fail:'#ef4444',blk:'#f59e0b',inp:'#3b82f6',ns:'#94a3b8',accent:'#6366f1',total:'#6366f1'};
  const priBadge=v=>{const m={Critical:'#ef4444',High:'#f97316',Medium:'#3b82f6',Low:'#10b981'};const c=m[v]||'#64748b';return`<span style="display:inline-flex;padding:2px 10px;border-radius:50px;font-size:11px;font-weight:700;background:${c}18;color:${c};border:1px solid ${c}44">${v}</span>`;};
  const stBadge=v=>{const m={Pass:'#10b981',Fail:'#ef4444',Blocked:'#f59e0b','Not Started':'#94a3b8','In Progress':'#3b82f6'};const c=m[v]||'#64748b';return`<span style="display:inline-flex;padding:2px 10px;border-radius:50px;font-size:11px;font-weight:700;background:${c}18;color:${c};border:1px solid ${c}44">${v}</span>`;};
  const TH=`padding:10px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:2px solid #e2e8f0`;
  const TD=`padding:9px 14px;font-size:12px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.45;color:#334155`;
  const TDalt=`padding:9px 14px;font-size:12px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.45;background:#fafbfc;color:#334155`;
  const chart=svgDonut(s.pass,s.fail,s.blk,s.inp,s.ns,s.total,190);
  const legend=[{c:RC.pass,l:'Pass',v:s.pass},{c:RC.fail,l:'Fail',v:s.fail},{c:RC.blk,l:'Blocked',v:s.blk},{c:RC.inp,l:'In Progress',v:s.inp},{c:RC.ns,l:'Not Started',v:s.ns}].filter(x=>x.v>0).map(x=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#475569;margin-right:14px;margin-bottom:4px"><span style="width:9px;height:9px;border-radius:50%;background:${x.c};flex-shrink:0"></span>${x.l}: <b style="color:#1e293b">${x.v}</b></span>`).join('');
  const envRows=Object.entries({Environment:env.environment||'—',Website:env.website?`<a href="${env.website}" style="color:${RC.accent};text-decoration:none">${env.website}</a>`:'—',Dashboard:env.dashboard?`<a href="${env.dashboard}" style="color:${RC.accent};text-decoration:none">${env.dashboard}</a>`:'—','Release Date':env.releaseDate||'—','QA Lead':env.qaLead||'—','App Version':env.appVersion||'—','Release Version':env.releaseVersion||'—',...(env.custom||[]).reduce((a,c)=>(c.key?(a[c.key]=c.value||'—'):0,a),{})}).map(([k,v],i)=>`<tr><td style="${i%2?TDalt:TD};color:#64748b;width:150px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px">${k}</td><td style="${i%2?TDalt:TD}">${v}</td></tr>`).join('');
  const smokeRows=cleanSmoke.map((r,i)=>`<tr><td style="${i%2?TDalt:TD};font-family:monospace;color:${RC.accent};font-size:11px;font-weight:700">${r.id}</td><td style="${i%2?TDalt:TD};color:#64748b;font-size:11px">${r.module}</td><td style="${i%2?TDalt:TD};font-weight:600;color:#1e293b">${r.step}</td><td style="${i%2?TDalt:TD}">${priBadge(r.priority)}</td><td style="${i%2?TDalt:TD}">${stBadge(r.status)}</td><td style="${i%2?TDalt:TD};color:#64748b;font-size:11px">${r.owner||'—'}</td><td style="${i%2?TDalt:TD};color:#94a3b8;font-size:11px;font-style:italic">${r.comment||'—'}</td></tr>`).join('');
  const prodRows=cleanProd.map((r,i)=>`<tr><td style="${i%2?TDalt:TD};font-family:monospace;color:${RC.accent};font-size:11px;font-weight:700">${r.id}</td><td style="${i%2?TDalt:TD};color:#64748b;font-size:11px">${r.module}</td><td style="${i%2?TDalt:TD};font-weight:600;color:#1e293b">${r.item}</td><td style="${i%2?TDalt:TD}">${priBadge(r.priority)}</td><td style="${i%2?TDalt:TD}">${stBadge(r.status)}</td><td style="${i%2?TDalt:TD};color:#64748b;font-size:11px">${r.owner||'—'}</td><td style="${i%2?TDalt:TD};color:#94a3b8;font-size:11px;font-style:italic">${r.comment||'—'}</td></tr>`).join('');
  const failItems=all.filter(r=>r.status==='Fail'||r.status==='Blocked');
  const tdRows=td.length?td.map((r,i)=>`<tr><td style="${i%2?TDalt:TD};font-weight:600">${r.accountName}</td><td style="${i%2?TDalt:TD}">${r.loginMethod}</td><td style="${i%2?TDalt:TD}"><code style="background:#f1f5f9;padding:2px 7px;border-radius:4px;font-size:11px;color:${RC.accent}">${r.credential}</code></td><td style="${i%2?TDalt:TD}">${r.role||'—'}</td><td style="${i%2?TDalt:TD}">${r.testDate||'—'}</td><td style="${i%2?TDalt:TD}">${r.testedBy||'—'}</td><td style="${i%2?TDalt:TD};color:#94a3b8">${r.notes||'—'}</td></tr>`).join(''):'';
  const rnHtml=rns.length?rns.map(rn=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid ${RC.accent};border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:16px;font-weight:800;color:${RC.accent}">v${rn.version}</span><span style="display:inline-flex;padding:2px 9px;border-radius:9px;font-size:10px;font-weight:700;background:${rn.status==='Published'?'rgba(16,185,129,.12)':'rgba(100,116,139,.1)'};color:${rn.status==='Published'?'#059669':'#64748b'};border:1px solid ${rn.status==='Published'?'rgba(16,185,129,.3)':'rgba(148,163,184,.3)'}">${rn.status||'Draft'}</span></div>
    <div style="font-size:11px;color:#64748b;margin-bottom:8px">📅 ${rn.releaseDate||'—'} &nbsp;·&nbsp; ✍ ${rn.author||'—'}</div>
    <div style="font-size:13px;color:#334155;margin-bottom:10px;line-height:1.5">${rn.summary||''}</div>
    ${rn.breakingChanges?`<div style="background:#fff5f5;border:1px solid #fecaca;border-radius:6px;padding:9px 14px;margin-bottom:8px;font-size:12px;line-height:1.5"><b style="color:#ef4444">⚠ Breaking Changes:</b> ${rn.breakingChanges}</div>`:''}
    ${(rn.changes||[]).length?`<div style="margin-bottom:4px">${(rn.changes||[]).map(c=>`<div style="font-size:12px;color:#475569;padding:3px 0;display:flex;gap:8px;line-height:1.5"><span style="color:${RC.accent};font-weight:700;flex-shrink:0">•</span>${c}</div>`).join('')}</div>`:''}
    ${rn.knownIssues?`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:9px 14px;margin-top:8px;font-size:12px;line-height:1.5"><b style="color:#d97706">⚠ Known Issues:</b> ${rn.knownIssues}</div>`:''}
  </div>`).join(''):'<p style="color:#94a3b8;font-size:13px;padding:8px 0">No release notes recorded.</p>';

  const statusOk=ready?'#10b981':'#ef4444';
  const statusBg=ready?'rgba(16,185,129,.18)':'rgba(239,68,68,.18)';
  const statusBorder=ready?'rgba(16,185,129,.5)':'rgba(239,68,68,.5)';
  const statusLabel=ready?'✓ READY FOR RELEASE':'✗ NOT READY';

  return`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${pname} — QA Report — ${now}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

}
function previewSavedReport(p,i){const snap=STORE[p].reports[i];const html=buildReport(p,snap);const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();}}

function _buildChecklistReportHtml(p,snap,platformFilter){
  const proj=PROJECTS.find(x=>x.id===p);
  const allItems=snap.items||[];
  const items=(platformFilter&&platformFilter!=='ALL')?allItems.filter(r=>r.platform===platformFilter):allItems;
  const rns=snap.releaseNotes||[];
  const s=tclStats(items);
  const passRate=s.total?Math.round((s.pass/s.total)*100):0;
  const dateStr=snap.datetime||new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const platLabel=(platformFilter&&platformFilter!=='ALL')?` — ${platformFilter}`:'';
  const platColor={Web:'#3b82f6',iOS:'#8b5cf6',Android:'#10b981'};
  const platAccent=(platformFilter&&platformFilter!=='ALL')?(platColor[platformFilter]||'#6366f1'):'#7c3aed';
  const statusColor={Pass:'#059669',Fail:'#dc2626',NA:'#64748b',Pending:'#d97706',Done:'#059669','Bugs Raised':'#f97316','Bugs Closed':'#6366f1','Bugs Re-Opened':'#ef4444',Hold:'#94a3b8','Ready for Prod':'#8b5cf6','Ready for Demo':'#3b82f6'};
  const envColor={Staging:'#f97316',Production:'#6366f1'};

  const donutSvg=(()=>{
    const r=70,cx=90,cy=90,sw=22,C=2*Math.PI*r;
    const segs=[{v:s.pass,c:'#059669'},{v:s.fail,c:'#dc2626'},{v:s.pending,c:'#d97706'},{v:s.na,c:'#94a3b8'}].filter(x=>x.v>0);
    if(!segs.length)return`<svg width="180" height="180"><circle cx="90" cy="90" r="70" fill="none" stroke="#e2e8f0" stroke-width="22"/><text x="90" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#64748b">0%</text></svg>`;
    let offset=0;
    const arcs=segs.map(sg=>{const dash=(sg.v/s.total)*C;const arc=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;offset+=dash;return arc;}).join('');
    return`<svg width="180" height="180">${arcs}<text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="24" font-weight="800" fill="#1e293b">${passRate}%</text><text x="${cx}" y="${cy+24}" text-anchor="middle" font-size="11" fill="#64748b">Pass Rate</text></svg>`;
  })();

  const tableRows=items.map(r=>`<tr>

// ── LOCALSTORAGE → SERVER MIGRATION ──
function _lsCollectMigData(){
  const migData={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k)continue;
    if(k.startsWith('qa3_')||k==='qa_users'||k==='qa3_daily_tasks'||k==='qa3_day_meta'||k==='qa3_team_tasks'||k==='qa3_releases'){
      try{
        let v=JSON.parse(localStorage.getItem(k));
        // Strip base64 wfdoc blobs — they are too large and handled separately
        if(v&&typeof v==='object'&&v.wfdocs){
          v={...v,wfdocs:(v.wfdocs||[]).map(d=>{const c={...d};delete c.data;return c;})};
        }
        migData[k]=v;
      }catch(e){}
    }
  }
  return migData;
}

async function migrateLocalStorageToServer(){
  const migData=_lsCollectMigData();
  if(!Object.keys(migData).length)return 0;
  // Push one at a time (not parallel) to avoid overwhelming server
  for(const [k,v] of Object.entries(migData)){
    try{
      await fetch('/api/qa-data/'+encodeURIComponent(k),{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},
        body:JSON.stringify({value:v})
      });
    }catch(e){}
  }
  return Object.keys(migData).length;
}

window.addEventListener('DOMContentLoaded',async()=>{
  initTheme();

  document.body.appendChild(loadEl);

  // Load all data from server with an 8s timeout — never hang indefinitely
  const _loadWithTimeout=async()=>{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    try{await Promise.race([loadFromServer(),timeout]);}catch(e){console.warn('[init] loadFromServer timed out or failed:',e.message);}
  };
  await _loadWithTimeout();

  // If server has no project data, auto-migrate from localStorage
  const serverHasData=Object.keys(_serverData).some(k=>k.startsWith('qa3_'));
  if(!serverHasData){
    const msgEl=document.getElementById('srv-loading-msg');
    if(msgEl)msgEl.textContent='Setting up workspace…';
    const n=await migrateLocalStorageToServer();
    if(n>0){
      await _loadWithTimeout();
    }
  }

  initUsers();
  loadAllState();
  // ── Set heartbeat hashes AFTER load — must happen after _serverDataLoaded is true ──
  // Only set hashes if server data actually loaded; if not, hashes stay empty so
  // heartbeat sees no changes and skips saves (blocked by _serverDataLoaded guard anyway).
  if(_serverDataLoaded){
    _lastHbDtHash=JSON.stringify(DAILY_TASKS);
    _lastHbTtHash=JSON.stringify(TEAM_TASKS);
    _lastHbRlHash=JSON.stringify(RELEASES);
    PROJECTS.forEach(p=>{_lastHbStoreHash[p.id]=JSON.stringify(STORE[p.id]);});
  }

  // Determine session: JWT token first, then cookie fallback
  try{
    const _authTimeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('auth timeout')),5000));
    const token=_getToken();
    const r=await Promise.race([
      fetch('/api/auth/session',{cache:'no-store',headers:token?{Authorization:'Bearer '+token}:{}}),
      _authTimeout
    ]);
    const d=await r.json();
    if(d.authenticated){
      _session={id:d.id||'u_sa',name:d.name||'User',email:d.email||'',role:d.role||'member'};
      // If no token yet (cookie-based session), only auto-fetch JWT for super admin.
      // Members must log in via the login form — never auto-login with a hardcoded password.
      if(!token&&d.role==='super_admin'){
        try{
          const lr=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:d.email||QA_SA_EMAIL,password:'Qateam@123'})});
          const ld=await lr.json();
          if(ld.token)_setToken(ld.token);
        }catch(_){}
      }
      await _loadTeamMembersFromServer();
    }
  }catch(e){console.warn('[init] session check failed:',e.message);}

  loadEl.remove();

  if(_session){
    document.getElementById('login-page').style.display='none';
    document.getElementById('dashboard').style.display='block';
    PROJECTS.forEach(p=>{curTab[p.id]=curTab[p.id]||'projoverview';});
    applyRolePermissions();
    renderTopBar();renderProjectGrid();
    // Sync DEFAULT_PROJ metadata (name/color/defaultAssignee) to MongoDB — silent background call.
    // Ensures MongoDB projects collection always has full records independent of client hardcodes.
    setTimeout(()=>{
      const _tok=_getToken();
      if(!_tok||!DEFAULT_PROJ.length)return;
      fetch('/api/admin/sync-default-projects',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tok},body:JSON.stringify({projects:DEFAULT_PROJ})}).catch(()=>{});
    },3000);
    // Check if this browser has localStorage data not yet on the server
    setTimeout(()=>_checkShowRestoreBanner(),800);
    // sync wfdocs from server after initial render — only re-render the active wfdocs tab
    // do NOT call renderProjectGrid() here — it triggers _serverData updates → SSE loop
    syncWfDocsFromServer().then(()=>{
      if(curView==='project'&&curProj&&curTab[curProj]==='wfdocs')renderProject(curProj);
    });
    // ── Auto-save heartbeat every 15s (was 60s — shorter window = less data lost on redeploy) ──
    setInterval(()=>_autoSaveHeartbeat(), 15000);
    // ── Auto-transition check: runs at startup + every 60s ──
    setTimeout(()=>rlCheckAutoTransitions(), 3000);
    setInterval(()=>rlCheckAutoTransitions(), 60000);
    // ── Real-time multi-user sync via SSE ──
    initSseListener();
    // Poll active users count every 60s
    setInterval(_pollActiveUsers, 60000);
    // ── Silent token refresh every 6 hours — prevents mid-session logout ──
    setInterval(_silentTokenRefresh, 6*60*60*1000);
    // ── Flush all unsaved data when user closes or navigates away ──
    window.addEventListener('beforeunload', ()=>_flushAllUnsaved());
    // ── Deep-link: ?report=<id> from Slack notification opens that report directly ──
    const _urlReport=new URLSearchParams(window.location.search).get('report');
    if(_urlReport){
      history.replaceState(null,'',window.location.pathname);
      setTimeout(()=>{showStatusReports();setTimeout(()=>srViewReport(_urlReport),600);},400);
    }
  }
});

// Force-save everything that has changed — called on beforeunload and can be called manually
function _flushAllUnsaved(){
  if(DAILY_TASKS.length>0){saveDailyTasks();}
  if(TEAM_TASKS.length>0){saveTeamTasks();}
  if(RELEASES.length>0){saveReleases();}
  // Save all project stores that have been loaded
  PROJECTS.forEach(p=>{if(STORE[p.id])saveToLS(p.id);});
}

// Heartbeat: retry any failed saves + re-save key volatile data as safety net
let _lastHbDtHash='', _lastHbTtHash='', _lastHbRlHash='';
let _lastHbStoreHash={};
let _hbSaving=false; // FIX E: prevent overlapping heartbeat saves
function _autoSaveHeartbeat(){
  if(_hbSaving)return; // skip if previous heartbeat's saves still in-flight
  // Retry any pending failed saves first
  if(Object.keys(_pendingRetries).length > 0){
    _retryAllFailed();
    return;
  }
  let anySaved=false;
  // Re-save daily tasks only if changed
  const dtHash=JSON.stringify(DAILY_TASKS);
  if(dtHash!==_lastHbDtHash){_lastHbDtHash=dtHash;saveDailyTasks();anySaved=true;}
  // Re-save team tasks only if changed
  const ttHash=JSON.stringify(TEAM_TASKS);
  if(ttHash!==_lastHbTtHash){_lastHbTtHash=ttHash;saveTeamTasks();anySaved=true;}
  // Re-save releases only if changed
  const rlHash=JSON.stringify(RELEASES);
  if(rlHash!==_lastHbRlHash){_lastHbRlHash=rlHash;saveReleases();anySaved=true;}
  // Re-save project stores (smoke, feedback, thirdparty, etc.) only if changed
  PROJECTS.forEach(p=>{
    const h=JSON.stringify(STORE[p.id]);
    if(h&&h!==_lastHbStoreHash[p.id]){_lastHbStoreHash[p.id]=h;saveToLS(p.id);anySaved=true;}
  });
  if(anySaved){
    _hbSaving=true;
    // Clear guard once all in-flight saves finish (activeSaves drops to 0)
    const poll=setInterval(()=>{if(_activeSaves===0){_hbSaving=false;clearInterval(poll);}},500);
  }
}

}

function _swSelectConfig(cfgId,url,tabEl,p){

async function _loadSwaggerSpec(cfgId,url,tabEl,p){
  if(_swLoading)return; // prevent concurrent loads causing refresh loop
  _swLoading=true;
  const ex=document.getElementById('sw-explorer-'+p);if(!ex){_swLoading=false;return;}
  ex.innerHTML=`<div class="sw-empty" style="padding:28px"><div class="sw-empty-icon" style="font-size:28px">⏳</div><div style="color:var(--mut);font-size:12px">Fetching ${escH(url)}…</div></div>`;
  try{
    const r=await fetch('/api/swagger-proxy?url='+encodeURIComponent(url),{headers:{Authorization:'Bearer '+_getToken()},cache:'no-store'});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'HTTP '+r.status);}
    const spec=await r.json();
    _swSpec=spec;_swBaseUrl=_swBuildBase(spec,url);_swMethodFilter='all';
    _renderSwaggerExplorer(spec,ex,p);
  }catch(e){ex.innerHTML=`<div class="sw-empty"><div class="sw-empty-icon">⚠️</div><div style="color:var(--fail);font-weight:600">Failed to load spec</div><div style="color:var(--mut);font-size:12px;margin-top:6px">${escH(e.message)}</div></div>`;}
  finally{_swLoading=false;}
}

function _swBuildBase(spec,url){
  if(spec.servers&&spec.servers[0])return spec.servers[0].url;
  if(spec.host){const sc=(spec.schemes&&spec.schemes[0])||'https';return`${sc}://${spec.host}${spec.basePath||''}`;}
  try{const u=new URL(url);return`${u.protocol}//${u.host}`;}catch(_){return'';}
}

function _swResolveRef(ref,seen){
  if(!ref||!_swSpec)return null;
  // '#/components/schemas/Foo' → _swSpec.components.schemas.Foo
  const parts=ref.replace(/^#\//,'').split('/');
  let node=_swSpec;
  for(const p of parts){node=node?.[p];if(!node)return null;}
  // guard against circular refs
  if(seen&&seen.has(ref))return{type:'object',properties:{}};
  return node;
}

function _swExampleFromSchema(s,depth,seen){
  depth=depth||0;seen=seen||new Set();
  if(depth>5)return'"..."';
  if(!s)return'{}';
  // resolve $ref first
  if(s.$ref){
    if(seen.has(s.$ref))return'"..."';
    const resolved=_swResolveRef(s.$ref,seen);
    if(!resolved)return'"..."';
    const newSeen=new Set(seen);newSeen.add(s.$ref);
    return _swExampleFromSchema(resolved,depth+1,newSeen);
  }
  if(s.allOf||s.oneOf||s.anyOf){
    const merged={type:'object',properties:{}};
    (s.allOf||s.oneOf||s.anyOf).forEach(sub=>{
      try{
        const r=sub.$ref?_swResolveRef(sub.$ref,seen):sub;
        if(r?.properties)Object.assign(merged.properties,r.properties);
        if(r?.type&&r.type!=='object')return _swExampleFromSchema(r,depth+1,seen);
      }catch(_){}
    });
    if(Object.keys(merged.properties).length)return _swExampleFromSchema(merged,depth+1,seen);
    const first=(s.allOf||s.oneOf||s.anyOf)[0];
    return first?_swExampleFromSchema(first,depth+1,seen):'{}';
  }
  if(s.example!==undefined)return JSON.stringify(s.example,null,2);
  if(s.type==='string')return JSON.stringify(s.enum?s.enum[0]:(s.format==='date-time'?'2024-01-01T00:00:00Z':s.format==='date'?'2024-01-01':s.format==='email'?'user@example.com':s.format==='uuid'?'00000000-0000-0000-0000-000000000000':'string'));
  if(s.type==='number'||s.type==='integer')return String(s.example!==undefined?s.example:0);
  if(s.type==='boolean')return'false';
  if(s.type==='array'){
    const items=s.items?_swExampleFromSchema(s.items,depth+1,seen):'""';
    return'[\n  '+items+'\n]';
  }
  if(s.type==='object'||s.properties){
    const ex={};
    const props=s.properties||{};
    for(const[k,v]of Object.entries(props)){
      try{ex[k]=JSON.parse(_swExampleFromSchema(v,depth+1,seen));}catch(_){ex[k]='string';}
    }
    return JSON.stringify(ex,null,2);
  }
  return'{}';
}

function _swSchemaView(s,indent,seen){
  indent=indent||0;seen=seen||new Set();
  if(indent>5)return'<span style="color:#999">...</span>';
  if(!s)return'<span style="color:#999">{}</span>';
  const pad='  '.repeat(indent);
  if(s.$ref){
    if(seen.has(s.$ref))return pad+'<span style="color:#999">'+escH(s.$ref.split('/').pop())+'</span>';
    const resolved=_swResolveRef(s.$ref,seen);
    if(!resolved)return pad+'<span style="color:#6b6b6b">'+escH(s.$ref.split('/').pop())+'</span>';
    const newSeen=new Set(seen);newSeen.add(s.$ref);
    return _swSchemaView(resolved,indent,newSeen);
  }
  if(s.allOf||s.oneOf||s.anyOf){
    const first=(s.allOf||s.oneOf||s.anyOf)[0];
    return first?_swSchemaView(first,indent,seen):'<span style="color:#999">{}</span>';
  }
  if(s.type==='object'||s.properties){
    const props=s.properties||{};
    const req=new Set(s.required||[]);
    if(!Object.keys(props).length)return pad+'<span style="color:#999">{}</span>';
    const lines=Object.entries(props).map(([k,v])=>{
      const vResolved=v.$ref?(_swResolveRef(v.$ref,seen)||v):v;
      const typeStr=v.$ref?v.$ref.split('/').pop():(vResolved.type||(vResolved.properties?'object':vResolved.type==='array'?'array':'any'));
      const reqMark=req.has(k)?'<span style="color:#e53e3e;font-weight:700"> *</span>':'';
      const enumStr=vResolved.enum?` = ${vResolved.enum.map(e=>JSON.stringify(e)).join(' | ')}`:'';
      const desc=vResolved.description?` <span style="color:#aaa;font-size:11px">// ${escH(vResolved.description.substring(0,70))}</span>`:'';
      return`${pad}  <span style="color:#555;font-weight:600">${escH(k)}</span>${reqMark}: <span style="color:#6b6b6b">${escH(typeStr)}</span><span style="color:#888">${escH(enumStr)}</span>${desc}`;
    });
    return`${pad}{\n${lines.join('\n')}\n${pad}}`;
  }
  if(s.type==='array'){
    return`${pad}Array [<br>${_swSchemaView(s.items||{},indent+1,seen)}<br>${pad}]`;
  }
  const typeStr=s.enum?escH(s.type||'string')+' ('+s.enum.map(e=>JSON.stringify(e)).join(' | ')+')':escH(s.type||'any');
  return`${pad}<span style="color:#6b6b6b">${typeStr}</span>`;
}

async function _swRun(eid,path,method,p){
  const respEl=document.getElementById(eid+'-resp');if(!respEl)return;
  respEl.style.display='block';respEl.innerHTML=`<div style="padding:12px 16px;color:var(--mut);font-size:12px">⏳ Sending ${method.toUpperCase()}…</div>`;
  try{
    let resolvedPath=path;const qp={},hd={};
    document.querySelectorAll(`#${eid} .sw-pinput`).forEach(inp=>{
      const n=inp.dataset.paramName,loc=inp.dataset.paramIn,v=inp.value.trim();if(!v)return;
      if(loc==='path')resolvedPath=resolvedPath.replace(`{${n}}`,encodeURIComponent(v));
      else if(loc==='query')qp[n]=v;
      else if(loc==='header')hd[n]=v;
    });
    const authTok=document.getElementById('sw-auth-token-'+p)?.value?.trim();
    const authType=document.getElementById('sw-auth-type-'+p)?.value;
    if(authTok&&authType!=='none')hd[authType==='ApiKey'?'X-API-Key':'Authorization']=(authType==='ApiKey'?'':authType+' ')+authTok;
    let body=null;
    const bodyEl=document.getElementById(eid+'-body');
    if(bodyEl?.value?.trim()){try{body=JSON.parse(bodyEl.value);}catch(_){respEl.innerHTML=`<div style="padding:12px 16px;color:var(--fail);font-size:12px">❌ Invalid JSON in request body</div>`;return;}}
    const fullUrl=_swBaseUrl+resolvedPath+(Object.keys(qp).length?'?'+Object.entries(qp).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'):'');
    const r=await fetch('/api/swagger-execute',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},body:JSON.stringify({method,url:fullUrl,headers:hd,body,params:qp})});
    _swRenderResp2(respEl,await r.json(),eid,method.toUpperCase(),fullUrl,body,hd);
  }catch(e){respEl.innerHTML=`<div style="padding:12px 16px;color:var(--fail);font-size:12px">❌ ${escH(e.message)}</div>`;}
}

function _swSyntax(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,m=>{
      let c='sw-jnum';
      if(/^"/.test(m)){c=/:$/.test(m)?'sw-jkey':'sw-jstr';}
      else if(/true|false/.test(m)){c='sw-jbool';}
      else if(/null/.test(m)){c='sw-jnull';}
      return`<span class="${c}">${m}</span>`;
    });
}

      <button onclick="navigator.clipboard.writeText(this.dataset.c);this.textContent='✅';setTimeout(()=>this.textContent='📋',2000)" data-c="${escH(curlCmd)}" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.1);border:none;border-radius:4px;color:#fff;padding:4px 8px;font-size:12px;cursor:pointer">📋</button>
    </div>
  </div>

  <!-- Request URL -->
  <div style="margin-bottom:14px">
    <div style="font-size:13px;font-weight:600;color:var(--txt);margin-bottom:6px">Request URL</div>
    <div style="background:#2d2d2d;color:#f8f8f2;font-family:monospace;font-size:12px;padding:10px 14px;border-radius:6px;word-break:break-all;line-height:1.5">${escH(reqUrl||'')}</div>
  </div>

  <!-- Server response -->
  <div>
    <div style="font-size:13px;font-weight:600;color:var(--txt);margin-bottom:8px">Server response</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="padding:6px 12px;font-size:12px;font-weight:700;color:var(--txt);text-align:left;width:80px">Code</th>
        <th style="padding:6px 12px;font-size:12px;font-weight:700;color:var(--txt);text-align:left">Details</th>
      </tr></thead>

        <td style="padding:10px 12px;font-family:monospace;font-size:14px;font-weight:700;color:${codeColor};vertical-align:top">${result.status}<br><span style="font-size:10px;color:var(--mut);font-weight:400">${ok?'':'Undocumented'}</span></td>
        <td style="padding:10px 12px;vertical-align:top">
          <div style="font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px">Response body</div>
          <div style="position:relative">
            <pre id="${rid}-b" style="background:#2d2d2d;color:#f8f8f2;font-family:monospace;font-size:12px;padding:14px 48px 14px 14px;border-radius:6px;max-height:320px;overflow:auto;margin:0;line-height:1.6;white-space:pre-wrap;word-break:break-all">${_swSyntax(bodyStr)}</pre>
            <div style="position:absolute;top:8px;right:8px;display:flex;gap:4px">
              <button onclick="navigator.clipboard.writeText(this.dataset.c);this.textContent='✅';setTimeout(()=>this.textContent='📋',2000)" data-c="${escH(bodyStr)}" style="background:rgba(255,255,255,.1);border:none;border-radius:4px;color:#fff;padding:4px 8px;font-size:12px;cursor:pointer">📋</button>

async function _swRunAll(p){
  if(!_swSpec){toast('No spec loaded','err');return;}
  const btn=document.getElementById('sw-run-all-btn-'+p);
  const panel=document.getElementById('sw-run-panel-'+p);
  if(!panel)return;

  // collect all endpoints
  const eps=[];
  for(const[path,methods]of Object.entries(_swSpec.paths||{})){
    for(const[method,op]of Object.entries(methods)){
      if(!['get','post','put','patch','delete','head','options'].includes(method))continue;
      eps.push({path,method,op});
    }
  }
  if(!eps.length){toast('No endpoints found','err');return;}

  const authTok=document.getElementById('sw-auth-token-'+p)?.value?.trim()||'';
  const authType=document.getElementById('sw-auth-type-'+p)?.value||'Bearer';

  // show panel
  panel.style.display='block';
  if(btn){btn.disabled=true;btn.textContent='⏳ Running…';}

  let pass=0,fail=0,err=0,done=0;
  const total=eps.length;
  const rows=[];

  // render initial panel
  const renderPanel=()=>{
    const pct=total?Math.round(done/total*100):0;
    panel.innerHTML=`
<div class="sw-run-header">
  <div class="sw-run-title">▶▶ Run All Results <span style="color:var(--mut);font-size:12px;font-weight:400">${done}/${total} completed</span></div>
  <div class="sw-run-stats">
    <div class="sw-run-stat"><div class="sw-run-stat-n" style="color:var(--pass)">${pass}</div><div class="sw-run-stat-l">Pass (2xx)</div></div>
    <div class="sw-run-stat"><div class="sw-run-stat-n" style="color:var(--fail)">${fail}</div><div class="sw-run-stat-l">Fail (4xx/5xx)</div></div>
    <div class="sw-run-stat"><div class="sw-run-stat-n" style="color:var(--mut)">${err}</div><div class="sw-run-stat-l">Error</div></div>
  </div>
</div>
<div class="sw-run-progress"><div class="sw-run-progress-bar" style="width:${pct}%"></div></div>
<div class="sw-run-body">${rows.map(r=>`<div class="sw-run-row">
  <span class="sw-run-row-status">${r.icon}</span>
  <span class="sw-run-row-method"><span class="sw-mbadge" style="background:${(_SW_MC[r.method]||_SW_MC.options).bg};color:${(_SW_MC[r.method]||_SW_MC.options).color};border:1.5px solid ${(_SW_MC[r.method]||_SW_MC.options).border};font-size:9px;padding:2px 7px">${r.method.toUpperCase()}</span></span>
  <span class="sw-run-row-path" title="${escH(r.path)}">${escH(r.path)}</span>
  <span class="sw-run-row-code" style="color:${r.codeColor}">${r.code}</span>
  <span class="sw-run-row-time">${r.time}ms</span>
</div>`).join('')}${done<total?`<div style="padding:12px 18px;font-size:12px;color:var(--mut)">⏳ Running ${total-done} more…</div>`:''}</div>
${done===total?`<div class="sw-run-footer">
  <span style="font-size:12px;font-weight:700;color:var(--txt)">✅ Completed: ${pass} passed, ${fail} failed, ${err} errors</span>
  <button class="sw-run-export-btn" onclick="_swExportRunResults('${p}')">📥 Export CSV</button>
  <button class="sw-run-close-btn" onclick="document.getElementById('sw-run-panel-${p}').style.display='none'">✕ Close</button>
</div>`:''}`;
  };

  // run concurrently in batches of 8
  const BATCH=8;
  const runOne=async(ep)=>{
    const hd={};
    if(authTok&&authType!=='none')hd[authType==='ApiKey'?'X-API-Key':'Authorization']=(authType==='ApiKey'?'':authType+' ')+authTok;
    const t0=Date.now();
    try{
      const r=await fetch('/api/swagger-execute',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+_getToken()},body:JSON.stringify({method:ep.method,url:_swBaseUrl+ep.path,headers:hd,body:null,params:{}})});
      const data=await r.json();
      const code=data.status||0;
      const time=data.duration||(Date.now()-t0);
      const ok=code>=200&&code<300;
      const isErr=code>=400;
      if(ok)pass++;else if(isErr)fail++;else err++;
      rows.push({path:ep.path,method:ep.method,code,time,icon:ok?'✅':isErr?'❌':'⚠️',codeColor:ok?'var(--pass)':isErr?'var(--fail)':'var(--blk)'});
    }catch(e){
      err++;
      rows.push({path:ep.path,method:ep.method,code:'ERR',time:Date.now()-t0,icon:'🔴',codeColor:'var(--mut)'});
    }
    done++;
    renderPanel();
  };

  // process in batches
  for(let i=0;i<eps.length;i+=BATCH){
    await Promise.all(eps.slice(i,i+BATCH).map(runOne));
  }

  if(btn){btn.disabled=false;btn.innerHTML=`▶▶ Run All <span style="background:rgba(255,255,255,.2);padding:1px 7px;border-radius:50px;font-size:11px">${total}</span>`;}

  // store results for export
  window._swLastRunResults=rows;
}

function _swExportRunResults(p){
  const rows=window._swLastRunResults||[];
  if(!rows.length){toast('No results to export','err');return;}
  const csv=['Method,Path,Status,Duration(ms)'].concat(rows.map(r=>`${r.method.toUpperCase()},${r.path},${r.code},${r.time}`)).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`swagger-run-${p}-${Date.now()}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported ✓');
}

// ══ QA STATE — MongoDB persistence via /api/qa-state ══════════════════════
// Loads previously saved test case statuses from MongoDB and overlays them
// on the rendered rows. Complementary to the existing STORE/serverPost system.

async function loadQaState(){
  try{
    const res=await fetch('/api/qa-state',{headers:{Authorization:'Bearer '+(_getToken()||'')}});
    if(!res.ok)return;
    const {testCases={}}=await res.json();
    Object.entries(testCases).forEach(([caseId,state])=>{
      if(!caseId||!state)return;
      const row=document.querySelector(`tr[data-case-id="${CSS.escape(caseId)}"]`);
      if(!row)return;
      // Apply status to the select
      const ssel=row.querySelector('select.ssel');
      if(ssel&&state.status){
        ssel.value=state.status;
        ssel.className=ssel.className.replace(/\bPass\b|\bFail\b|\bBlocked\b|\bNot-Started\b|\bIn-Progress\b/g,'').trim();
        const sc=(state.status||'').replace(' ','-');
        if(sc)ssel.classList.add(sc);
      }
      // Apply comment
      const commentInp=row.querySelector('.inp-sm');
      if(commentInp&&state.comment!==undefined)commentInp.value=state.comment;
    });
  }catch(e){console.warn('[QAState] loadQaState failed:',e.message);}
}

async function saveCaseField(caseId,fields){
  if(!caseId)return false;
  try{
    const res=await fetch(`/api/qa-state/${encodeURIComponent(caseId)}`,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(_getToken()||'')},
      body:JSON.stringify(fields)
    });
    return res.ok;
  }catch(e){console.warn('[QAState] saveCaseField failed:',e.message);return false;}
}

async function bulkSaveQaState(){
  const rows=document.querySelectorAll('tr[data-case-id]');
  const testCases={};
  rows.forEach(row=>{
    const caseId=row.dataset.caseId;if(!caseId)return;
    const ssel=row.querySelector('select.ssel');
    const commentInp=row.querySelector('.inp-sm');
    testCases[caseId]={
      status:ssel?.value||'Not Started',
      comment:commentInp?.value?.trim()||'',
      product:row.dataset.product||'',
      suite:row.dataset.suite||''
    };
  });
  if(!Object.keys(testCases).length)return;
  try{
    const res=await fetch('/api/qa-state/bulk',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+(_getToken()||'')},
      body:JSON.stringify({testCases})
    });
    const d=await res.json();
    if(res.ok)toast(`Saved ${d.updated||0} test cases to DB`,'suc');
    else toast('Bulk save failed','err');
  }catch(e){toast('Bulk save error','err');console.warn('[QAState] bulkSaveQaState failed:',e.message);}
}

// Wire loadQaState to run after the page renders (called from DOMContentLoaded above)
// This is additive — it overlays DB states on top of STORE-rendered rows
if(typeof _qaStateAutoLoad==='undefined'){
  window._qaStateAutoLoad=true;
  // Delay slightly to let renderProjectGrid() finish first
  document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>loadQaState(),1500));
}

async function _srFetch(url,retries){
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(url,{headers:{'Authorization':'Bearer '+_getToken()}});
      if(r.ok)return r.json();
      console.warn('[sr] fetch',url,'status',r.status);
      return null;
    }catch(e){
      if(i<retries){await new Promise(res=>setTimeout(res,600*(i+1)));}
      else{console.warn('[sr] fetch failed after retries:',url,e);}
    }
  }
  return null;
}

async function _srLoadSummary(){
  const d=await _srFetch('/api/status-reports/summary',2);
  if(!d)return;
  _srSummary={total:d.total||0,latest:d.latest||null,statusCounts:d.statusCounts||{}};

  if(s==='failed'||s==='fail')    return`<span class="sr-badge sr-badge-fail">✗ Failed</span>`;

function _srFmtDate(iso){
  if(!iso)return'—';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+
      ' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  }catch{return iso;}
}

function _srRenderPagination(){
  const el=document.getElementById('sr-pagination');
  if(!el)return;
  const {page,pages,total}=_srData;
  if(pages<=1){el.innerHTML='';return;}
  const btns=[];
  btns.push(`<button class="sr-pg-btn" ${page<=1?'disabled':''} onclick="_srGoPage(${page-1})">‹ Prev</button>`);
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-page)<=1)btns.push(`<button class="sr-pg-btn${i===page?' sr-pg-active':''}" onclick="_srGoPage(${i})">${i}</button>`);
    else if(Math.abs(i-page)===2)btns.push(`<span style="color:var(--mut);padding:0 4px">…</span>`);
  }
  btns.push(`<button class="sr-pg-btn" ${page>=pages?'disabled':''} onclick="_srGoPage(${page+1})">Next ›</button>`);
  el.innerHTML=`<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">${btns.join('')}</div>
    <div style="font-size:11px;color:var(--mut)">Showing ${((page-1)*_srLimit)+1}–${Math.min(page*_srLimit,total)} of ${total}</div>`;
}

  try{
    const r=await fetch('/api/status-reports/'+encodeURIComponent(id),{headers:{'Authorization':'Bearer '+_getToken()}});

  <div id="sr-view-modal" class="sr-modal" style="display:none" onclick="if(event.target===this)srCloseModal()">
    <div class="sr-modal-inner">
      <div class="sr-modal-hdr">
        <span id="sr-view-title" style="font-weight:700;font-size:14px;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button class="sr-modal-btn" onclick="srFullScreen()" title="Full screen">⛶</button>
        <button class="sr-modal-btn" onclick="srDownloadCurrent()" title="Download">⬇</button>
        <button class="sr-modal-btn sr-modal-close" onclick="srCloseModal()" title="Close">✕</button>
      </div>
      <iframe id="sr-view-frame" class="sr-view-frame" sandbox="allow-scripts" title="Status Report"></iframe>
    </div>
  </div>`;
}

</script>
</body>
</html>
